const ANTERIORES = [{"title": "Parcial 2022 · Tema 1", "slug": "parcial-2022-t1", "kind": "anterior", "topics": "24/10/2022, K2001 · campos de yylval y centinela; G: S → bX | cY | a; fragmento conversión(); ER ((ab)+)*", "exercises": [{"n": 1, "title": "Scanner, parser y rutinas semánticas", "short": "Scanner y parser", "pts": "0.5 puntos cada ítem", "items": [{"id": "1.1", "text": "¿La variable yylval posee tantos campos como tipos de tokens presenta el lenguaje de programación?", "stmt": [], "ctx": null, "opts": ["Sí: necesita exactamente un campo por cada tipo de token.", "No: tiene los campos necesarios según los valores semánticos; puede tener menos campos que tipos de tokens.", "Sí, porque cada token se identifica con un campo distinto de yylval.", "No: yylval nunca tiene más de un campo.", "Solo si se declara con %token.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Falso. No hay necesariamente correspondencia entre ambas cantidades. Si hubiera que reconocer 4 tipos de tokens (constantes octales, decimales, reales y literales cadena), alcanzaría con la %union del recuadro.", "yylval tendría 3 campos, menos que los 4 tipos de tokens, porque las constantes octales y decimales pueden guardarse en el mismo campo numero. %union define un campo por cada tipo de valor semántico necesario."], "blocks": [{"title": "", "code": ["%union {", "    int numero;", "    float num_coma;", "    char* cadena;", "}"]}], "imgs": [], "ref": "%union define una union de C con un campo por cada tipo de valor semántico que se necesite asociar a los tokens. Por defecto yylval es int."}, {"id": "1.2", "text": "En C, ¿en qué etapa se realiza la validación de tipos de datos?", "stmt": [], "ctx": null, "opts": ["En el análisis léxico.", "En el análisis sintáctico, porque a+b es una estructura válida.", "En tiempo de ejecución.", "En el preprocesamiento.", "En el análisis semántico, mediante rutinas semánticas.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Verdadero que se realiza en el análisis semántico. Para validar tipos no alcanza con que la estructura sintáctica sea correcta: también tiene que tener sentido. Por ejemplo, a+b es sintácticamente correcta, pero además hay que validar que los tipos de a y b sean compatibles con la suma."], "blocks": [], "imgs": [], "ref": "El análisis semántico verifica las reglas sensibles al contexto, por ejemplo la verificación de tipos para que cada operador trabaje sobre operandos permitidos."}, {"id": "1.3", "text": "¿Las validaciones semánticas comienzan una vez finalizadas las validaciones sintácticas?", "stmt": [], "ctx": null, "opts": ["Sí: siempre se realizan después de terminar todo el análisis sintáctico.", "Sí, porque el parser necesita el árbol completo para invocarlas.", "No: pueden realizarse en simultáneo y coordinadas con el análisis léxico y sintáctico.", "No: se realizan antes del análisis léxico.", "No: se realizan solo en tiempo de ejecución.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Falso. Las validaciones semánticas pueden realizarse en simultáneo con el análisis léxico y sintáctico: cuando el parser reconoce una estructura correcta, se ejecutan rutinas que verifican sus restricciones semánticas (por ejemplo, errores de tipo o dobles declaraciones). Algunas validaciones pueden hacerse al terminar el análisis sintáctico, pero no son todas ni es obligatorio hacerlas en ese momento."], "blocks": [], "imgs": [], "ref": "El análisis semántico está inmerso dentro del análisis sintáctico: el Parser llama a las rutinas semánticas a medida que reconoce las construcciones."}, {"id": "1.4", "text": "¿Por qué los analizadores sintácticos descendentes no pueden manejar producciones con recursividad a izquierda?", "stmt": [], "ctx": null, "opts": ["Sí pueden: el problema es la recursividad a derecha.", "Porque al expandir el no terminal recursivo se volvería a invocar el mismo procedimiento sin consumir entrada: un ciclo infinito.", "Porque esas producciones no se pueden derivar.", "Porque la recursividad a izquierda genera ambigüedad léxica.", "Porque solo trabajan con gramáticas regulares.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Verdadero que no pueden manejarlas. Los procedimientos que implementan esas producciones recursivas entrarían en un ciclo infinito: al expandir el no terminal recursivo, se intentaría generar de nuevo la recursividad sin haber consumido ningún símbolo de entrada. Por eso se transforman en recursividad a derecha."], "blocks": [], "imgs": [], "ref": "Las gramáticas LL(1) no pueden ser recursivas a izquierda; la recursividad a izquierda se transforma en recursividad a derecha, no al revés."}, {"id": "1.5", "text": "¿En los LR infinitos reconocidos por el scanner siempre es necesario un carácter de corte (centinela)?", "stmt": [], "ctx": null, "opts": ["Sí, en todos los casos.", "Sí, salvo para los identificadores.", "No, ningún LR infinito lo necesita.", "No siempre: los literales cadena son LR infinitos y la comilla doble de cierre alcanza para detectar el lexema.", "Solo para los literales cadena.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Falso. Los literales cadena son LR infinitos que no requieren carácter de corte: la propia comilla doble de cierre basta para detectar el lexema. Otros LR infinitos, como los identificadores y las constantes, sí lo necesitan."], "blocks": [], "imgs": [], "ref": "Cada lexema es la mayor secuencia posible de caracteres para su token, por lo que a veces se lee un primer carácter que no pertenece al lexema (centinela). Ese carácter extra se devuelve al flujo con ungetc."}]}, {"n": 2, "title": "Gramáticas y análisis sintáctico", "short": "Gramáticas LL(1)", "pts": "0.5 puntos por item", "items": [{"id": "2.1", "text": "¿Qué problemas impiden que G sea LL(1)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bX | cY | a", "X → Xc | Xb | b", "Y → cW | bW", "W → aW | c"], "img": null}, "opts": ["Solo la recursividad a izquierda de X.", "Solo el prefijo común de las alternativas de Y.", "La recursividad a izquierda de X y el prefijo común de las alternativas de S.", "La recursividad de W en aW.", "Ninguno: G ya es LL(1).", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["X → Xc | Xb es recursiva a izquierda. No hay prefijos comunes: las alternativas de S comienzan con b, c y a; las de Y, con c y b; las de W, con a y c. W → aW es recursiva a derecha, lo que no genera problemas."], "blocks": [], "imgs": [], "ref": "Limitaciones de LL(1): no pueden ser recursivas a izquierda y no pueden tener un noterminal con dos o más producciones cuyos lados derechos comiencen con el mismo terminal."}, {"id": "2.2", "text": "¿Qué reemplazo elimina la recursividad a izquierda de X → Xc | Xb | b conservando el lenguaje?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bX | cY | a", "X → Xc | Xb | b", "Y → cW | bW", "W → aW | c"], "img": null}, "opts": ["X → cX | bX | b.", "X → bT; T → cT | bT.", "X → bT | ε; T → cT | bT | ε.", "X → bT; T → cT | bT | ε.", "X → bT; T → cbT | ε.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["L(X) = b(c + b)*. Se reescribe como X → bT con la cola recursiva a derecha T → cT | bT | ε. A genera (c + b)*b; B no tiene derivación terminal para T; C agrega ε a L(X); E solo genera repeticiones de cb."], "blocks": [{"title": "Eliminación de recursividad a izquierda en X (ya es LL(1)):", "code": ["S → bX | cY | a", "X → bT", "T → cT | bT | ε", "Y → cW | bW", "W → aW | c"]}], "imgs": [], "ref": "Eliminación de la recursividad a izquierda: X → Xα | β se transforma en X → βZ y Z → αZ | ε. Toda secuencia comienza con β seguida de cero o más α."}, {"id": "2.3", "text": "Eliminada la recursividad a izquierda, ¿hace falta factorizar alguna producción?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bX | cY | a", "X → Xc | Xb | b", "Y → cW | bW", "W → aW | c"], "img": null}, "opts": ["Sí: las alternativas de S tienen un prefijo común.", "No: ningún no terminal tiene dos alternativas que comiencen con el mismo terminal.", "Sí: hay que factorizar W → aW | c.", "Sí: Y → cW | bW comparten W y deben factorizarse.", "No, porque la factorización solo se aplica a producciones ε.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Con eliminar la recursividad a izquierda ya se obtiene una gramática LL(1). Para factorizar, los lados derechos tienen que COMENZAR con el mismo terminal: compartir el sufijo W (como en Y → cW | bW) no es un prefijo común."], "blocks": [], "imgs": [], "ref": "Factorización a izquierda: A → αβ1 | … | αβn pasa a A → αB y B → β1 | … | βn. El prefijo común queda aislado en una sola producción."}, {"id": "2.4", "text": "En G, ¿cuál es SIGUIENTE(X)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bX | cY | a", "X → Xc | Xb | b", "Y → cW | bW", "W → aW | c"], "img": null}, "opts": ["{b, c}.", "{$}.", "{a, b, c, $}.", "{b, c, ε}.", "{b, c, $}.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["En X → Xc y X → Xb, después de X aparecen c y b. En S → bX, X está al final, por lo que se incorpora SIGUIENTE(S) = {$}. Resultado: {b, c, $}. ε nunca integra un conjunto SIGUIENTE. En la gramática obtenida, PREDICE(T → ε) = SIGUIENTE(T) = {$}, disjunto de {c} y {b}: es LL(1)."], "blocks": [], "imgs": [], "ref": "SIGUIENTE(A): si A va seguido de un terminal x, x ∈ SIGUIENTE(A); si va seguido de un noterminal B, PRIMERO(B) ⊆ SIGUIENTE(A); si A es el último símbolo de T → …A, SIGUIENTE(T) ⊆ SIGUIENTE(A). El axioma lleva fdt ($)."}, {"id": "2.5", "text": "¿Qué características posee una gramática LL(1)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bX | cY | a", "X → Xc | Xb | b", "Y → cW | bW", "W → aW | c"], "img": null}, "opts": ["Es una gramática regular reconocida por un AFD.", "Un parser LL elige la producción con un solo símbolo de preanálisis; no tiene recursividad a izquierda ni alternativas con prefijo común.", "Admite recursividad a izquierda si es directa.", "Requiere retroceso (backtracking) para elegir la producción.", "Solo puede usarse en análisis ascendente.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Una gramática LL(1) puede ser usada por un parser LL con un único símbolo de preanálisis: si un no terminal tiene varias producciones, el parser elige cuál aplicar con solo conocer el próximo token. No puede tener recursividad a izquierda ni un no terminal con dos o más producciones cuyos lados derechos comiencen con el mismo terminal."], "blocks": [], "imgs": [], "ref": "PREDICE(A → X1…Xm) = PRIMERO(X1…Xm) si ε no está en él; si está, (PRIMERO − {ε}) ∪ SIGUIENTE(A). Si los PREDICE de cada noterminal no se superponen, la gramática es LL(1)."}]}, {"n": 3, "title": "Código C: léxico, sintaxis, semántica y declaraciones", "short": "Código C", "pts": "0.75 puntos por item", "items": [{"id": "3.1", "text": "¿Cuál es el diagnóstico léxico correcto del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.4 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1   extern int global;", "2   int conversión(int par) {", "3       const int factor = 6", "4       int res;", "5       if ( par % 3 == 0 )", "6           res = par / 3", "7       else", "8           res = par * global;", "9       return rep;", "10  }"], "img": null}, "opts": ["No hay errores léxicos.", "extern no es un lexema válido.", "% no es un operador de C.", "conversión contiene un carácter (ó) que no forma parte de ninguna categoría léxica de C.", "== debe dividirse en dos tokens =.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["En la línea 2, el identificador conversión tiene una o con tilde, que no pertenece a ninguna categoría léxica de C: es un error léxico. extern es una palabra reservada; % y == son operadores válidos."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.2", "text": "¿Qué errores sintácticos y semánticos presenta el fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.4 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1   extern int global;", "2   int conversión(int par) {", "3       const int factor = 6", "4       int res;", "5       if ( par % 3 == 0 )", "6           res = par / 3", "7       else", "8           res = par * global;", "9       return rep;", "10  }"], "img": null}, "opts": ["Sintácticos: falta ; en las líneas 3 y 6. Semántico: rep se usa en la línea 9 sin haber sido declarado.", "Sintáctico: falta ; en la línea 8. Semántico: global no está inicializada.", "Sintáctico: if sin llaves. Semántico: factor no se usa.", "Ninguno sintáctico. Semántico: extern no puede usarse fuera de una función.", "Sintácticos: falta ; en las líneas 3 y 6. Semántico: factor se declara const.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["Errores sintácticos: falta ; al final de las líneas 3 y 6 (en la 6, antes del else). Error semántico: rep no fue declarado; se usa en el return de la línea 9 (la resolución original lo ubica en la línea 10). Que factor no se use no es un error, y extern int global es una declaración válida."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "3.3", "text": "Si en la línea 5 se eliminan todos los espacios en blanco, ¿cambia la cantidad de tokens?", "stmt": [], "ctx": {"text": "Para 3.1–3.4 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1   extern int global;", "2   int conversión(int par) {", "3       const int factor = 6", "4       int res;", "5       if ( par % 3 == 0 )", "6           res = par / 3", "7       else", "8           res = par * global;", "9       return rep;", "10  }"], "img": null}, "opts": ["Sí: disminuye, porque los espacios son tokens.", "Sí: par%3 pasa a ser un único identificador.", "Sí: ==0 pasa a ser una constante.", "Sí: aumenta, porque el scanner separa cada carácter.", "No: se mantienen los mismos 8 tokens.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["La cantidad de tokens se mantiene: if ( par % 3 == 0 ) son 8 tokens con espacios y sin ellos. Los espacios no actúan como centinela de ninguno de esos tokens: al quitarlos, ningún par de lexemas consecutivos forma un lexema más largo."], "blocks": [], "imgs": [], "ref": "Cada lexema es la mayor secuencia posible de caracteres para su token, por lo que a veces se lee un primer carácter que no pertenece al lexema (centinela). Ese carácter extra se devuelve al flujo con ungetc."}, {"id": "3.4", "text": "¿Cuál es el alcance del identificador rep?", "stmt": [], "ctx": {"text": "Para 3.1–3.4 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1   extern int global;", "2   int conversión(int par) {", "3       const int factor = 6", "4       int res;", "5       if ( par % 3 == 0 )", "6           res = par / 3", "7       else", "8           res = par * global;", "9       return rep;", "10  }"], "img": null}, "opts": ["Todo el archivo, por estar usado en un return.", "Ninguno: rep no está declarado. Si estuviera declarado en la función, su alcance sería solo dentro de ella.", "Desde la línea 9 hasta el final del archivo.", "El mismo que el de global.", "Solo la línea 9.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["rep no tiene alcance porque no está declarado. Si se declarara dentro de la función, su alcance sería únicamente dentro de ella."], "blocks": [], "imgs": [], "ref": "Tabla de símbolos: contiene los identificadores con sus atributos. Para nombres de variables, los atributos son tipo y ámbito."}]}, {"n": 4, "title": "Algoritmos y autómatas", "short": "Algoritmos y autómatas", "pts": "0.5 puntos por item", "items": [{"id": "4.1", "text": "¿Al aplicar el algoritmo de Thompson se puede obtener un AFD?", "stmt": [], "ctx": null, "opts": ["No: Thompson siempre genera transiciones ε.", "Sí, como caso particular: por ejemplo, el autómata de Thompson para la ER a.", "No: siempre genera al menos dos transiciones por el mismo carácter.", "Sí, siempre se obtiene un AFD.", "Solo si la ER contiene una unión.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Verdadero, como caso particular. El autómata de Thompson para la ER a tiene dos estados y una única transición con a: no hay transiciones ε ni dos transiciones por el mismo carácter, así que es un AFD (incompleto)."], "blocks": [], "imgs": ["media/image4.png"], "ref": "En el AFN de Thompson, al estado inicial no llegan transiciones; de cualquier estado no final parte una sola transición con un carácter, una sola transición-ε o dos transiciones-ε."}, {"id": "4.2", "text": "En un AFN, ¿los conjuntos hacia de un estado pueden ser vacíos para todos los caracteres del alfabeto?", "stmt": [], "ctx": null, "opts": ["No: todo estado tiene al menos una transición.", "No, porque hacia siempre incluye al propio estado.", "Solo en los AFD.", "Sí: en un AFN de Thompson, el estado final no tiene transiciones, así que su hacia es vacío para todo carácter.", "Solo si el AFN tiene un único estado.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Verdadero. En un AFN obtenido con Thompson, del estado final no parten transiciones; por lo tanto, hacia(final, x) es vacío para todo carácter x. No hay que confundirlo con la clausura-ε, que nunca es vacía porque contiene al propio estado."], "blocks": [], "imgs": [], "ref": "hacia(R, x): estados a los que se transita por x desde los estados de R. Cada estado nuevo del AFD es la Clausura-ε de un hacia(R, x)."}, {"id": "4.3", "text": "¿Cuántos estados tiene el AFN que se obtiene al aplicar Thompson a ER1, y cómo se compara con el de ER2?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere ER1 = ((ab)+)* y ER2 = (ab)*, donde (ab)+ es la clausura positiva (una o más repeticiones de ab).", "code": [], "img": null}, "opts": ["8 estados: 2 más que los 6 de ER2.", "12 estados: el doble que los 6 de ER2.", "6 estados: igual que ER2.", "10 estados: 4 más que los 6 de ER2.", "16 estados: el doble que los 8 de ER2.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Verdadero que tiene el doble. Thompson trabaja con unión, concatenación y clausura de Kleene, así que (ab)+ se escribe ab(ab)*. ER2 = (ab)* tiene 6 estados: a y b aportan 2 cada uno, la concatenación no agrega estados y la estrella agrega 2. Para ER1: ab aporta 4 y (ab)* aporta 6, total 10; la estrella exterior agrega 2: 12 estados, el doble de 6."], "blocks": [], "imgs": [], "ref": "Thompson: un carácter (o ε) es un AF básico de dos estados. La unión y la clausura de Kleene agregan un estado inicial y uno final nuevos; la concatenación solo une los autómatas con una transición-ε."}, {"id": "4.4", "text": "¿Cuántos estados tiene el AFD mínimo asociado a ER1, sin contar un estado de rechazo?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere ER1 = ((ab)+)* y ER2 = (ab)*, donde (ab)+ es la clausura positiva (una o más repeticiones de ab).", "code": [], "img": null}, "opts": ["1.", "3.", "2.", "4.", "12.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["((ab)+)* denota el mismo lenguaje que (ab)*: cualquier repetición de ab, incluida la vacía. El AFD mínimo tiene 2 estados: q0, inicial y final, que con a pasa a q1; y q1, que con b vuelve a q0."], "blocks": [], "imgs": ["media/image3.png"], "ref": "El AFD mínimo es el que tiene la menor cantidad de estados; dos ER son equivalentes si las reconoce el mismo AFD mínimo."}]}]}, {"title": "Parcial 2022 · Tema 2", "slug": "parcial-2022-t2", "kind": "anterior", "topics": "25/10/2022, K2052 · yylval, tipo de las constantes y centinela; G: S → acX | abY | b; fragmento calcular(); minimización de un AFD", "exercises": [{"n": 1, "title": "Scanner, parser y rutinas semánticas", "short": "Scanner y parser", "pts": "0.5 puntos cada ítem", "items": [{"id": "1.1", "text": "¿La variable yylval siempre posee la misma cantidad de campos, independientemente de los tipos de tokens del lenguaje?", "stmt": [], "ctx": null, "opts": ["Sí: siempre tiene un único campo int.", "Sí: siempre tiene un campo por cada palabra reservada.", "No: la cantidad de campos se adapta a los valores semánticos asociados a cada tipo de token.", "No: siempre tiene exactamente un campo por cada token.", "Sí, porque su tipo lo fija Bison.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Falso. La cantidad de campos no es independiente de los tipos de tokens: se adapta a los valores semánticos que maneja el lenguaje. Por ejemplo, para constantes octales, decimales y reales y literales cadena alcanzan 3 campos (int numero; float num_coma; char* cadena;), porque octales y decimales comparten el campo numero."], "blocks": [], "imgs": [], "ref": "%union define una union de C con un campo por cada tipo de valor semántico que se necesite asociar a los tokens. Por defecto yylval es int."}, {"id": "1.2", "text": "¿En C la validación de tipos de datos se realiza en tiempo de ejecución?", "stmt": [], "ctx": null, "opts": ["Sí: los tipos se validan al ejecutar cada operación.", "No: se realiza en el análisis semántico, dentro de la fase de análisis de la compilación.", "Sí, salvo para las constantes.", "No: se realiza en el análisis léxico.", "No: se realiza en el enlazado.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Falso. La validación de tipos se realiza durante el análisis semántico, que es parte de la fase de análisis de la compilación. En tiempo de ejecución, esas validaciones ya fueron realizadas."], "blocks": [], "imgs": [], "ref": "El análisis semántico verifica las reglas sensibles al contexto, por ejemplo la verificación de tipos para que cada operador trabaje sobre operandos permitidos."}, {"id": "1.3", "text": "¿Puede el scanner determinar el tipo de dato de una constante?", "stmt": [], "ctx": null, "opts": ["No: solo las rutinas semánticas pueden hacerlo.", "No: depende de la variable a la que se asigna.", "Solo para las constantes reales.", "No: se determina en tiempo de ejecución.", "Sí: lo determina la propia categoría léxica; en cambio, el tipo de un identificador lo determinan las rutinas semánticas.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Verdadero. El tipo de las constantes (enteras, reales, carácter) lo determina la propia categoría léxica. El scanner lo usa para saber en qué campo de yylval guardar el valor semántico, y esa información pasa al parser para las rutinas semánticas que validan la compatibilidad de tipos. En cambio, el tipo de un identificador lo determinan las rutinas semánticas cuando el parser reconoce una declaración, y queda guardado en la TS."], "blocks": [], "imgs": [], "ref": "El Scanner retorna pares ordenados; para constantes numéricas, (tipoConstanteNumerica, índice) o (tipoConstanteNumerica, valor)."}, {"id": "1.4", "text": "¿Pueden los analizadores sintácticos descendentes manejar producciones con recursividad a izquierda?", "stmt": [], "ctx": null, "opts": ["No: producen derivaciones por izquierda y, con recursividad a izquierda, caen en bucles infinitos.", "Sí, siempre que haya un solo símbolo de preanálisis.", "Sí: solo tienen problemas con la recursividad a derecha.", "Sí, porque reducen el árbol desde las hojas.", "No, porque solo aceptan gramáticas regulares.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["Verdadero que no pueden. Un analizador descendente produce derivaciones por izquierda desde el axioma, desplegando el árbol de análisis sintáctico. Con recursividad a izquierda cae en bucles infinitos; por eso estos analizadores se basan en gramáticas LL(1)."], "blocks": [], "imgs": [], "ref": "Descendente (LL): produce una derivación por izquierda. Ascendente (LR): usa la derivación por derecha en orden inverso; la última producción aplicada es la primera descubierta."}, {"id": "1.5", "text": "¿En los LR finitos reconocidos por el scanner siempre es necesario un carácter de corte (centinela)?", "stmt": [], "ctx": null, "opts": ["Sí, en todos los casos.", "No, ningún LR finito lo necesita.", "Solo los caracteres de puntuación lo necesitan.", "Sí, porque el scanner siempre lee un carácter de más.", "No siempre: un LR finito puede requerirlo o no.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Falso. En los LR infinitos, el lexema se obtiene al detectar el centinela; en los finitos, puede requerirse o no. En suma(1, 2); el identificador y las constantes necesitan centinela (los paréntesis y la coma). En cambio, los paréntesis, la coma y el punto y coma no lo necesitan: en C no hay lexemas que comiencen con ellos y sigan con más caracteres. Un operador como + sí lo requiere, porque puede ser ++ o +=."], "blocks": [], "imgs": [], "ref": "Ej. del resumen: Abcd (LR infinito) requiere centinela; { (LR finito) no lo requiere; + sí lo requiere, porque podría ser ++ o +=. El carácter extra se devuelve con ungetc."}]}, {"n": 2, "title": "Gramáticas y análisis sintáctico", "short": "Gramáticas LL(1)", "pts": "0.5 puntos por item", "items": [{"id": "2.1", "text": "¿Qué problemas impiden que G sea LL(1)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → acX | abY | b", "X → Xc | Xb | a", "Y → b | ε"], "img": null}, "opts": ["Solo la recursividad a izquierda de X.", "El prefijo común a en acX | abY y la recursividad a izquierda de X.", "Solo la producción ε de Y.", "Solo el prefijo común a en las alternativas de S.", "Ninguno: G ya es LL(1).", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["acX y abY comienzan con a, así que hay que factorizar; X → Xc | Xb es recursiva a izquierda. La producción ε de Y no genera conflicto."], "blocks": [], "imgs": [], "ref": "Limitaciones de LL(1): no pueden ser recursivas a izquierda y no pueden tener un noterminal con dos o más producciones cuyos lados derechos comiencen con el mismo terminal."}, {"id": "2.2", "text": "¿Qué reemplazo elimina la recursividad a izquierda de X → Xc | Xb | a?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → acX | abY | b", "X → Xc | Xb | a", "Y → b | ε"], "img": null}, "opts": ["X → aZ; Z → cZ | bZ | ε.", "X → cX | bX | a.", "X → aZ; Z → cZ | bZ.", "X → aZ | ε; Z → cZ | bZ | ε.", "X → aZ; Z → cbZ | ε.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["Se crea el no terminal Z para convertir la recursividad a izquierda en recursividad a derecha: X → aZ y Z → cZ | bZ | ε. L(X) = a(c + b)*. B genera (c + b)*a; C no tiene derivación terminal para Z; D agrega ε a L(X); E solo genera repeticiones de cb."], "blocks": [{"title": "1°) Eliminación de recursividad a izquierda en X", "code": ["S → acX | abY | b", "X → aZ", "Z → cZ | bZ | ε", "Y → b | ε"]}], "imgs": [], "ref": "Eliminación de la recursividad a izquierda: X → Xα | β se transforma en X → βZ y Z → αZ | ε. Toda secuencia comienza con β seguida de cero o más α."}, {"id": "2.3", "text": "¿Cuál es el resultado de factorizar a izquierda las producciones de S?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → acX | abY | b", "X → Xc | Xb | a", "Y → b | ε"], "img": null}, "opts": ["S → aU; U → cX | bY | b.", "S → aU | b; U → cX | bY | ε.", "S → aU | b; U → cX | bY.", "S → acU | b; U → X | bY.", "S → aU | ab; U → cX | Y.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["El prefijo común de acX y abY es a; se crea U: S → aU | b; U → cX | bY. A antepone a a b; B agrega la cadena a; D y E cambian el lenguaje."], "blocks": [{"title": "Gramática LL(1) final:", "code": ["S → aU | b", "U → cX | bY", "X → aZ", "Z → cZ | bZ | ε", "Y → b | ε"]}], "imgs": [], "ref": "Factorización a izquierda: A → αβ1 | … | αβn pasa a A → αB y B → β1 | … | βn. El prefijo común queda aislado en una sola producción."}, {"id": "2.4", "text": "En G, ¿cuál es PREDICE(Y → ε)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → acX | abY | b", "X → Xc | Xb | a", "Y → b | ε"], "img": null}, "opts": ["{b}.", "{ε}.", "{$}.", "{b, $}.", "{a, b, $}.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Como ε ∈ PRIMERO(ε), PREDICE(Y → ε) = SIGUIENTE(Y). Y solo aparece al final de S → abY, así que SIGUIENTE(Y) = SIGUIENTE(S) = {$}. Es disjunto de PREDICE(Y → b) = {b}: Y no genera conflicto."], "blocks": [], "imgs": [], "ref": "PREDICE(A → X1…Xm) = PRIMERO(X1…Xm) si ε no está en él; si está, (PRIMERO − {ε}) ∪ SIGUIENTE(A). Si los PREDICE de cada noterminal no se superponen, la gramática es LL(1)."}, {"id": "2.5", "text": "Sobre la gramática obtenida, ¿es posible implementar un parser predictivo?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → acX | abY | b", "X → Xc | Xb | a", "Y → b | ε"], "img": null}, "opts": ["No, porque tiene producciones ε.", "No, porque Z es recursiva a derecha.", "Sí, pero solo con retroceso (backtracking).", "No, porque S tiene dos alternativas.", "Sí: es LL(1), sin recursividad a izquierda y con PREDICE disjuntos en cada no terminal.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Sí. Un parser predictivo requiere una gramática en la que, dado un no terminal, se pueda elegir inequívocamente la producción, y sin recursividad a izquierda: una gramática LL(1). S: aU con a, b con b. U: cX con c, bY con b. Z: cZ con c, bZ con b, ε con {$}. Y: b con b, ε con {$}."], "blocks": [], "imgs": [], "ref": "Limitaciones de LL(1): no pueden ser recursivas a izquierda y no pueden tener un noterminal con dos o más producciones cuyos lados derechos comiencen con el mismo terminal."}]}, {"n": 3, "title": "Código C: léxico, sintaxis, semántica y declaraciones", "short": "Código C", "pts": "0.75 puntos por item", "items": [{"id": "3.1", "text": "¿Cuál es el diagnóstico léxico correcto del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.4 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1   double calcular (int i, float *p){", "2       int j = i * 2", "3       *i = 3.2", "4       p[j] = i + 7 * j;", "5       *p = i / 3;", "6       switch(j){", "7           p[i]++;", "8   }}"], "img": null}, "opts": ["3.2 no es una constante válida.", "No hay errores léxicos.", "switch no es una palabra reservada de C.", "++ debe dividirse en dos tokens +.", "}} forma un único token inválido.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["No hay errores léxicos: todos los lexemas pertenecen a alguna categoría léxica de C (palabras reservadas, identificadores, constantes enteras y reales, operadores y caracteres de puntuación)."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.2", "text": "¿Qué errores sintácticos y semánticos presenta el fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.4 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1   double calcular (int i, float *p){", "2       int j = i * 2", "3       *i = 3.2", "4       p[j] = i + 7 * j;", "5       *p = i / 3;", "6       switch(j){", "7           p[i]++;", "8   }}"], "img": null}, "opts": ["Sintáctico: falta default en el switch. Semántico: p[i]++ no es válido.", "Ninguno sintáctico. Semántico: la función no retorna un valor.", "Sintácticos: falta ; al final de las líneas 2 y 3. Semántico: en la línea 3 se aplica * a i, que es int.", "Sintáctico: falta ; en la línea 4. Semántico: i / 3 es una división entera.", "Sintácticos: falta ; en las líneas 2 y 3. Semántico: p[j] está fuera de rango.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Sintácticos: falta ; al final de las líneas 2 y 3, lo que deja secuencias de tokens que no pueden derivarse (si se lee todo como una sola secuencia, puede justificarse un único error desde la línea 2 hasta el ; de la línea 4). Semántico: el operador * (indirección) no es válido para i, que es int.", "Warnings (no son errores): la función se declara double pero no retorna valor; puede que no se pueda acceder al desplazamiento j desde donde apunta p; la línea 7 nunca se ejecuta (en el switch no hay ningún case)."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "3.3", "text": "¿Cuántos operadores hay en la línea 4?", "stmt": [], "ctx": {"text": "Para 3.1–3.4 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1   double calcular (int i, float *p){", "2       int j = i * 2", "3       *i = 3.2", "4       p[j] = i + 7 * j;", "5       *p = i / 3;", "6       switch(j){", "7           p[i]++;", "8   }}"], "img": null}, "opts": ["2.", "3.", "5.", "4.", "6.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Hay 4 operadores: asignación (=), acceso a un elemento de un arreglo ([ ]), suma (+) y multiplicación (*)."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.4", "text": "¿Cuál es el alcance del identificador calcular?", "stmt": [], "ctx": {"text": "Para 3.1–3.4 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1   double calcular (int i, float *p){", "2       int j = i * 2", "3       *i = 3.2", "4       p[j] = i + 7 * j;", "5       *p = i / 3;", "6       switch(j){", "7           p[i]++;", "8   }}"], "img": null}, "opts": ["Solo el cuerpo de la función.", "El bloque del switch.", "Ninguno, porque no se invoca.", "Solo la línea 1.", "De archivo: puede referenciarse en cualquier parte del archivo posterior a su declaración.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["calcular está declarado y definido, así que tiene alcance de archivo: puede referenciarse en cualquier parte del archivo, después de su declaración."], "blocks": [], "imgs": [], "ref": "Tabla de símbolos: contiene los identificadores con sus atributos. Para nombres de variables, los atributos son tipo y ámbito."}]}, {"n": 4, "title": "Algoritmos y autómatas", "short": "Algoritmos y autómatas", "pts": "0.5 puntos por item", "items": [{"id": "4.1", "text": "Al aplicar el algoritmo de Thompson, ¿se puede obtener un AFN con una cantidad impar de estados?", "stmt": [], "ctx": null, "opts": ["Sí, con la concatenación.", "No: siempre se obtiene una cantidad par de estados.", "Sí, con la unión.", "Sí, si la ER tiene una cantidad impar de símbolos.", "Solo con la clausura de Kleene.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Falso. Un símbolo genera 2 estados; la unión agrega uno al comienzo y uno al final; la concatenación une los autómatas con una transición ε sin agregar estados; la clausura de Kleene agrega un estado al comienzo y otro al final. Todas las operaciones dan una cantidad par de estados."], "blocks": [], "imgs": [], "ref": "Thompson: un carácter (o ε) es un AF básico de dos estados. La unión y la clausura de Kleene agregan un estado inicial y uno final nuevos; la concatenación solo une los autómatas con una transición-ε."}, {"id": "4.2", "text": "En un AFN, ¿la clausura-ε de un estado puede estar vacía?", "stmt": [], "ctx": null, "opts": ["Sí, si el estado no tiene transiciones ε.", "Sí, si el estado es final.", "Solo en los AFN de Thompson.", "No: siempre contiene, como mínimo, al propio estado.", "Sí, si el estado es inalcanzable.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["La clausura-ε de un estado nunca está vacía: contiene, como mínimo, al propio estado."], "blocks": [], "imgs": [], "ref": "Clausura-ε(q): q y todos los estados a los que se llega desde q usando solo transiciones-ε. Nunca es vacía, porque contiene al menos a q."}, {"id": "4.3", "text": "Al aplicar el algoritmo de clases, ¿se obtiene el mismo AFD?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere el AFD del diagrama. q0 es el estado inicial; q1+ y q3+ son finales.", "code": [], "img": "media/image12.png"}, "opts": ["Sí: el AFD ya es mínimo.", "No: q0 y q2 se fusionan porque ambos son no finales.", "No: q1+ y q3+ son equivalentes inmediatos y se fusionan.", "No: q0 y q1+ se fusionan porque ambos tienen un bucle con b.", "Solo B y C son correctas.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Falso. TT: 0- (a→1, b→0, c→2); 1+ (a→3, b→1, c→2); 2 (a, b, c→2); 3+ (a→3, b→1, c→2). Clases: C0 = {0, 2} (no finales) y C1 = {1, 3} (finales). 1 y 3 tienen la misma fila: equivalencia inmediata; se elimina 3 y se reemplaza por 1. En la TTC, 0 (C1, C0, C0) y 2 (C0, C0, C0) no son equivalentes por clase, así que se separan: 2 pasa a C2."], "blocks": [], "imgs": [], "ref": "Estados equivalentes inmediatos: pertenecen a la misma clase y tienen el mismo comportamiento (filas iguales en la TT). Solo hace falta uno de ellos."}, {"id": "4.4", "text": "¿Cuántos estados tiene el AFD mínimo?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere el AFD del diagrama. q0 es el estado inicial; q1+ y q3+ son finales.", "code": [], "img": "media/image12.png"}, "opts": ["4.", "2.", "1.", "3.", "5.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Quedan 3 estados: 0- (a→1, b→0, c→2), 1+ (a→1, b→1, c→2) y 2 (a, b, c→2)."], "blocks": [], "imgs": ["media/image15.png"], "ref": "Pasos para el AFD mínimo: 1) eliminar los estados inalcanzables; 2) partir en no finales y finales; 3) eliminar equivalentes inmediatos; 4) armar la TTC; 5) buscar equivalentes por clase."}]}]}, {"title": "Parcial 2023 · Tema 15", "slug": "parcial-2023-t15", "kind": "anterior", "topics": "07/11/2023, K2052 · tabla de símbolos, YYSTYPE y centinela; G: S → bcT | bSa; fragmento sumador(int h); ER ((ab)*)*", "exercises": [{"n": 1, "title": "Scanner, parser y rutinas semánticas", "short": "Scanner y parser", "pts": "0.5 puntos cada ítem", "items": [{"id": "1.1", "text": "¿Qué registra la tabla de símbolos respecto de las funciones?", "stmt": [], "ctx": null, "opts": ["Un registro de cada invocación a una función.", "Solo los nombres de las variables locales.", "Las declaraciones de las funciones (y de las variables) con sus atributos, lo que permite validar sus invocaciones.", "El código objeto generado para cada función.", "Nada: las funciones no se registran en la tabla de símbolos.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Falso que registre las invocaciones. La TS mantiene un registro de las DECLARACIONES de funciones y variables, y con esa información se valida que cada función se invoque correctamente, controlando la cantidad y el tipo de los parámetros de entrada y salida."], "blocks": [], "imgs": [], "ref": "Tabla de símbolos: contiene los identificadores con sus atributos. Para nombres de variables, los atributos son tipo y ámbito."}, {"id": "1.2", "text": "¿En qué momento se realiza el análisis semántico dinámico?", "stmt": [], "ctx": null, "opts": ["En tiempo de compilación, durante el análisis semántico.", "Durante el preprocesamiento.", "Durante el análisis léxico.", "En tiempo de ejecución; el estático, en cambio, se realiza en compilación.", "Durante el enlazado.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Verdadero que se realiza en tiempo de ejecución. El análisis semántico estático se realiza en compilación, antes de que el programa se ejecute. C solo provee análisis semántico estático; otros lenguajes (como JavaScript, Ruby y Scala) tienen ambos."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "1.3", "text": "¿Quién detecta los errores léxicos?", "stmt": [], "ctx": null, "opts": ["El parser, al no recibir el token esperado para derivar o reducir.", "El scanner, al encontrar una secuencia de caracteres que no pertenece a ninguna categoría léxica.", "Las rutinas semánticas.", "El enlazador.", "Solo el preprocesador.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Falso que los capture el parser. Los detecta el scanner al encontrar una secuencia de caracteres que no pertenece a ninguna categoría léxica (por ejemplo, la letra ñ en C). El scanner podría además provocar un error sintáctico si le retorna al parser un token especial, destinado a ese fin, que no figure en la gramática."], "blocks": [], "imgs": [], "ref": ""}, {"id": "1.4", "text": "¿Puede la variable yylval almacenar un tipo struct definido por el usuario?", "stmt": [], "ctx": null, "opts": ["No: yylval siempre es de tipo int.", "No: solo puede definirse como una union.", "Solo si el struct tiene un único campo.", "No: solo puede contener punteros a char.", "Sí: su tipo es el definido por YYSTYPE, que puede ser un struct.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Verdadero. yylval toma el tipo definido por YYSTYPE: por defecto es int, pero puede definirse como cualquier otro tipo, incluido un struct. Lo más habitual es una union, que a su vez puede tener miembros de tipo struct."], "blocks": [], "imgs": [], "ref": "%union define una union de C con un campo por cada tipo de valor semántico que se necesite asociar a los tokens. Por defecto yylval es int."}, {"id": "1.5", "text": "¿El LR de las palabras reservadas requiere un carácter de corte (centinela) para detectar un lexema?", "stmt": [], "ctx": null, "opts": ["Sí: hace falta para distinguir una palabra reservada de un identificador (char frente a character).", "No: es un LR finito, y los LR finitos nunca requieren centinela.", "No: el scanner reconoce la palabra al leer su última letra.", "Solo si la palabra reservada tiene más de cuatro letras.", "No, porque las palabras reservadas las reconoce el parser.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["Falso que no lo requiera. El centinela sirve para diferenciar una palabra reservada de un identificador: char es una palabra reservada, pero character es un identificador."], "blocks": [], "imgs": [], "ref": "Cada lexema es la mayor secuencia posible de caracteres para su token, por lo que a veces se lee un primer carácter que no pertenece al lexema (centinela). Ese carácter extra se devuelve al flujo con ungetc."}]}, {"n": 2, "title": "Gramáticas y análisis sintáctico", "short": "Gramáticas LL(1)", "pts": "0.5 puntos por item", "items": [{"id": "2.1", "text": "¿Qué problemas impiden que G sea LL(1)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bcT | bSa", "T → Ta | Tb | c"], "img": null}, "opts": ["Solo la recursividad a izquierda de T.", "Solo el prefijo común b en las alternativas de S.", "El prefijo común b en bcT | bSa y la recursividad a izquierda de T.", "La recursividad de S en bSa.", "Ninguno: G ya es LL(1).", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Las dos alternativas de S comienzan con b, así que hay que factorizar; T → Ta | Tb es recursiva a izquierda. bSa no es recursiva a izquierda, porque comienza con el terminal b."], "blocks": [], "imgs": [], "ref": "Limitaciones de LL(1): no pueden ser recursivas a izquierda y no pueden tener un noterminal con dos o más producciones cuyos lados derechos comiencen con el mismo terminal."}, {"id": "2.2", "text": "¿Cuál es el resultado de factorizar a izquierda las producciones de S?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bcT | bSa", "T → Ta | Tb | c"], "img": null}, "opts": ["S → bX; X → cT | Sa.", "S → bX; X → cT | a.", "S → bcX; X → T | Sa.", "S → bX | bSa; X → cT.", "S → bX; X → cT | Sa | ε.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["1°) Factorización en S: S → bX; X → cT | Sa. B pierde la recursión de S; C exige c antes de S; D no está factorizada; E agrega la cadena b."], "blocks": [{"title": "1°) Factorización en S", "code": ["S → bX", "X → cT | Sa", "T → Ta | Tb | c"]}], "imgs": [], "ref": "Factorización a izquierda: A → αβ1 | … | αβn pasa a A → αB y B → β1 | … | βn. El prefijo común queda aislado en una sola producción."}, {"id": "2.3", "text": "¿Qué reemplazo elimina la recursividad a izquierda de T → Ta | Tb | c?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bcT | bSa", "T → Ta | Tb | c"], "img": null}, "opts": ["T → cZ; Z → aZ | bZ.", "T → aT | bT | c.", "T → cZ | ε; Z → aZ | bZ | ε.", "T → cZ; Z → aZ | bZ | ε.", "T → cZ; Z → abZ | ε.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["2°) Eliminación de recursividad a izquierda en T: T → cZ; Z → aZ | bZ | ε. L(T) = c(a + b)*. A no tiene derivación terminal para Z; B genera (a + b)*c; C agrega ε a L(T); E solo genera repeticiones de ab."], "blocks": [{"title": "2°) Eliminación de recursividad a izquierda en T", "code": ["S → bX", "X → cT | Sa", "T → cZ", "Z → aZ | bZ | ε"]}], "imgs": [], "ref": "Eliminación de la recursividad a izquierda: X → Xα | β se transforma en X → βZ y Z → αZ | ε. Toda secuencia comienza con β seguida de cero o más α."}, {"id": "2.4", "text": "Aplicadas las transformaciones de 2.2 y 2.3, ¿qué resulta al verificar la gramática obtenida con los conjuntos PREDICE?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bcT | bSa", "T → Ta | Tb | c"], "img": null}, "opts": ["Es LL(1): los PRIMERO de las alternativas de cada no terminal son disjuntos.", "No es LL(1): PREDICE(Z → aZ) = {a} y PREDICE(Z → ε) = SIGUIENTE(Z) = {a, $} comparten a.", "No es LL(1): las alternativas de X comparten c.", "Es LL(1), porque ya no hay recursividad a izquierda ni prefijos comunes.", "No es LL(1): queda recursividad a izquierda en X.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["X no tiene conflicto: cT se elige con c y Sa con b. Pero PREDICE(Z → ε) = SIGUIENTE(Z). Z está al final de T, T al final de X y X al final de S, así que SIGUIENTE(Z) = SIGUIENTE(S); y por X → Sa, la a sigue a S. Resulta SIGUIENTE(Z) = {a, $}, que comparte a con PREDICE(Z → aZ) = {a}. Por ejemplo, con la entrada bbcca, al expandir Z con preanálisis a no se puede saber si esa a pertenece a la cola de T o a X → Sa.", "Nota: la resolución original concluye que la gramática es LL(1) porque compara solo los conjuntos PRIMERO. Según la bibliografía, cuando una producción deriva ε, su PREDICE incluye SIGUIENTE del no terminal, y ahí aparece el conflicto. La factorización y la eliminación de la recursividad son correctas, pero no alcanzan para obtener una gramática LL(1)."], "blocks": [], "imgs": [], "ref": "PREDICE(A → X1…Xm) = PRIMERO(X1…Xm) si ε no está en él; si está, (PRIMERO − {ε}) ∪ SIGUIENTE(A). Si los PREDICE de cada noterminal no se superponen, la gramática es LL(1)."}, {"id": "2.5", "text": "Sobre la gramática original G, ¿se requiere un AFP para reconocer el lenguaje que genera?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → bcT | bSa", "T → Ta | Tb | c"], "img": null}, "opts": ["No: alcanza un AF, porque G no tiene recursividad a izquierda en S.", "No: el lenguaje es regular, porque T genera c(a + b)*.", "Sí, pero solo porque T es recursiva a izquierda.", "Solo si se usa la gramática transformada.", "Sí: por bSa, la cantidad de a finales depende de la cantidad de b iniciales; una pila permite contarlas.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Sí. Por la producción bSa, se apila una marca por cada b y se desapila una por cada a, para obtener la misma cantidad de a que de b agregadas. Un AF no tiene memoria para contar una cantidad no acotada: el lenguaje es un LIC no regular, y su autómata mínimo es un AFP."], "blocks": [], "imgs": [], "ref": "AFP: T(e, ε, R) = (e', α): estando en e y con R en el tope, pasa a e', reemplaza R por α y no avanza ninguna posición en el flujo de entrada."}]}, {"n": 3, "title": "Código C: léxico, sintaxis, semántica y declaraciones", "short": "Código C", "pts": "0.75 puntos por item", "items": [{"id": "3.1", "text": "¿Cuál es el diagnóstico léxico correcto del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1  int sumador(int h){", "2      int i =1, j = 0;", "3      while(j<=2){", "4          int x = i+++i++;", "5          j++;}", "6      i +=x ;", "7      return i+h+j;", "8      return j;"], "img": null}, "opts": ["i+++i++ no puede dividirse en tokens válidos.", "+++ es un único operador inválido.", "No hay errores léxicos: i+++i++ se divide en i, ++, +, i, ++.", "h no es un identificador válido por tener una sola letra.", "0 no es una constante válida.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["No hay errores léxicos. Identificadores: sumador, h, i, j, x. Palabras reservadas: int, while, return. Caracteres de puntuación/operadores: ( ) { } ++ + = += ; <= ,. Constante entera octal: 0. Constantes enteras decimales: 1, 2. Como el scanner forma el lexema más largo posible, i+++i++ se divide en i ++ + i ++."], "blocks": [], "imgs": [], "ref": "Cada lexema es la mayor secuencia posible de caracteres para su token, por lo que a veces se lee un primer carácter que no pertenece al lexema (centinela). Ese carácter extra se devuelve al flujo con ungetc."}, {"id": "3.2", "text": "¿Qué errores sintácticos y semánticos presenta el fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1  int sumador(int h){", "2      int i =1, j = 0;", "3      while(j<=2){", "4          int x = i+++i++;", "5          j++;}", "6      i +=x ;", "7      return i+h+j;", "8      return j;"], "img": null}, "opts": ["Sintáctico: falta } para cerrar la función. Semántico: x se usa en la línea 6 fuera del bloque del while.", "Sintáctico: hay dos return seguidos. Semántico: h no se usa.", "Sintáctico: i+++i++ no es derivable. Semántico: ninguno.", "Ninguno sintáctico. Semántico: j se compara con una constante.", "Sintáctico: falta }. Semántico: hay dos sentencias return seguidas.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["Falta una llave de cierre en la definición de la función sumador. Error semántico: x solo existe dentro del while, por lo que no puede asignarse su valor a i fuera de ese ámbito."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "3.3", "text": "Omitiendo las líneas que presentan errores léxicos, sintácticos o semánticos, ¿qué valor retorna la función al invocarse como sumador(5)?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. Los números de línea no forman parte del código.", "code": ["1  int sumador(int h){", "2      int i =1, j = 0;", "3      while(j<=2){", "4          int x = i+++i++;", "5          j++;}", "6      i +=x ;", "7      return i+h+j;", "8      return j;"], "img": null}, "opts": ["12.", "9.", "18.", "15.", "13.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Se omite la línea 6 (i += x). El while se ejecuta 3 veces; en cada vuelta, i recibe dos postincrementos y j uno: i pasa de 1 a 7 y j de 0 a 3. El primer return devuelve i + h + j = 7 + 5 + 3 = 15.", "Aclaración: en C estándar, i++ + i++ modifica i dos veces sin un punto de secuencia intermedio, lo que es comportamiento indefinido. La cátedra asume que cada ++ incrementa i en 1."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.4", "text": "Dentro de una función se escribe la sentencia siguiente. ¿Qué declaraciones la hacen semánticamente válida? La inicialización es opcional.", "stmt": ["M.acumulador = R.contador[3] + *S ;"], "ctx": null, "opts": ["typedef struct { int acumulador; int contador[4]; } est; est *M, *R; int *S;", "typedef struct { int acumulador; int contador[4]; } est; est M, R; int *S;", "typedef struct { int acumulador; int contador[4]; } est; est M, R; int S;", "typedef struct { int acumulador; int contador; } est; est M, R; int *S;", "Solo A y B son correctas.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["M y R deben ser estructuras (no punteros) para usar el operador . ; contador debe admitir el índice 3 y *S exige que S sea un puntero. A usa . sobre punteros; C desreferencia un int; D indexa un int. Es la declaración de la resolución original."], "blocks": [{"title": "", "code": ["typedef struct {", "    int acumulador;", "    int contador[4];", "} est;", "est M, R;", "int *S;"]}], "imgs": [], "ref": ""}]}, {"n": 4, "title": "Algoritmos y autómatas", "short": "Algoritmos y autómatas", "pts": "0.5 puntos por item", "items": [{"id": "4.1", "text": "Al aplicar el algoritmo de clases sobre un AFD que no es mínimo, ¿siempre aparece al menos una equivalencia inmediata entre dos estados?", "stmt": [], "ctx": null, "opts": ["Sí, siempre.", "Sí, porque un AFD no mínimo siempre tiene dos filas iguales en su TT.", "Solo si el AFD está completo.", "No necesariamente: puede no haberlas y aun así reducirse por equivalencias por clase.", "No, porque las equivalencias inmediatas solo aparecen en los AFN.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Falso. Contraejemplo de la cátedra, en el recuadro (AFD completo; 5 es el estado de rechazo).", "C0 = {0, 1, 5} y C1 = {2, 3, 4}: no hay dos filas iguales dentro de una clase, así que no hay equivalencias inmediatas. Aun así, el AFD no es mínimo: 2, 3 y 4 son equivalentes por clase (con a y con b todos van a C1). El AFD mínimo queda con 4 estados: {0}, {1}, {5} y {2, 3, 4}."], "blocks": [{"title": "TT del contraejemplo:", "code": ["TT    a  b", "0-    1  5", "1     5  2", "2+    2  3", "3+    4  2", "4+    3  4", "5     5  5"]}], "imgs": [], "ref": "Estados equivalentes por clase: están en la misma clase y tienen el mismo comportamiento por clases (la sucesión de clases de llegada de sus transiciones)."}, {"id": "4.2", "text": "¿Qué se obtiene al aplicar el algoritmo de clausuras-ε sobre un AFD?", "stmt": [], "ctx": null, "opts": ["El mismo AFD, con los estados renombrados.", "Un AFD con más estados.", "El AFD mínimo.", "Nada: el algoritmo no se puede aplicar a un AFD.", "Un AFN equivalente.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["Verdadero que se obtiene el mismo AFD. Un AFD no tiene transiciones ε, así que cada clausura-ε contiene solo al propio estado; y como hay una única transición por carácter, cada hacia tiene un solo estado. Cada estado nuevo es {q}. Como el algoritmo solo genera estados alcanzables desde el inicial, un estado inalcanzable no aparecería."], "blocks": [], "imgs": [], "ref": "Clausura-ε(q): q y todos los estados a los que se llega desde q usando solo transiciones-ε. Nunca es vacía, porque contiene al menos a q."}, {"id": "4.3", "text": "Al aplicar el algoritmo de Thompson a la ER, ¿se obtiene un AFN con una cantidad impar de estados?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere la ER ((ab)*)*.", "code": [], "img": null}, "opts": ["Sí, porque la concatenación agrega un estado.", "Sí, porque hay dos clausuras de Kleene.", "No: la cantidad de estados siempre es par.", "Depende del orden en que se apliquen los operadores.", "Sí, porque el estado inicial es compartido entre las dos clausuras.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Falso. Con Thompson, la cantidad de estados siempre es par: los AF básicos tienen 2 estados; la unión y la clausura de Kleene agregan 2 cada una; la concatenación no agrega estados."], "blocks": [], "imgs": [], "ref": "En el AFN de Thompson, al estado inicial no llegan transiciones; de cualquier estado no final parte una sola transición con un carácter, una sola transición-ε o dos transiciones-ε."}, {"id": "4.4", "text": "¿Cuántos estados tiene el AFN que se obtiene?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere la ER ((ab)*)*.", "code": [], "img": null}, "opts": ["6.", "7.", "10.", "9.", "8.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["a y b aportan 2 estados cada uno (4); la concatenación ab no agrega estados; la primera estrella agrega 2 (6) y la segunda, 2 más: 8 estados."], "blocks": [], "imgs": ["media/image5.png"], "ref": "Thompson: un carácter (o ε) es un AF básico de dos estados. La unión y la clausura de Kleene agregan un estado inicial y uno final nuevos; la concatenación solo une los autómatas con una transición-ε."}]}]}];

const REPASO = {"modules": [{"n": 1, "title": "El mapa global", "sub": "Etapas del compilador y tabla de símbolos", "concepts": [{"id": "compilacion", "title": "Proceso de compilación", "what": "El compilador traduce un programa fuente a un programa objeto equivalente, en dos partes: análisis y síntesis.", "bullets": ["**Análisis**: léxico, sintáctico y semántico. Los tres interactúan con la tabla de símbolos.", "**Síntesis**: desde la representación intermedia genera el programa objeto (código para una MV, instrucciones `OP A, B, C`).", "El parser orquesta todo: le pide tokens al scanner y llama a las rutinas semánticas mientras reconoce construcciones.", "Gramática léxica: define los lexemas posibles. Gramática sintáctica: define las construcciones válidas.", "El análisis semántico está inmerso en el sintáctico y es **el comienzo de la síntesis**: si la construcción es correcta, las rutinas semánticas ya generan el código.", "Para que el parser sepa que no quedan más tokens, el scanner entrega un token especial `fdt` (fin de texto)."], "exam": "Los tres análisis no se hacen uno después del otro sobre todo el archivo: ocurren intercalados, dirigidos por el parser.", "practice": [[2, "1.3"], [1, "1.4"]]}, {"id": "ts", "title": "Tabla de símbolos", "what": "Estructuras de datos con todos los identificadores del programa fuente y sus atributos.", "bullets": ["Variables: **tipo y ámbito**.", "Rutinas: cantidad y tipo de parámetros, métodos de transferencia y tipo de retorno.", "Las palabras reservadas pueden ir en las primeras entradas, con un atributo que las distingue.", "El scanner puede cargar el lexema de un identificador, pero el tipo y el ámbito los resuelven las rutinas semánticas al reconocer la declaración.", "Ejemplo de una rutina: `int XX (double a) { … }` podría guardarse como `(XX, function, int, 1, double)`.", "**Ámbitos anidados**: una declaración dentro de un bloque oculta a la externa del mismo nombre. La búsqueda en la TS respeta los ámbitos: se usa la declaración visible más cercana, no la primera ni la última del archivo."], "exam": "Quién registra el tipo de una variable: las rutinas semánticas, no el scanner. La TS tampoco es el canal entre scanner y parser.", "practice": [[2, "1.2"], [4, "1.4"], [1, "1.3"]]}]}, {"n": 2, "title": "Capa léxica y lenguajes regulares", "sub": "Scanner, autómatas finitos y la cadena ER → AFN-ε → AFD → AFD mínimo", "concepts": [{"id": "scanner", "title": "Scanner y carácter de corte", "what": "Lee caracteres, arma lexemas y los entrega como tokens, uno por vez, cada vez que el parser lo invoca.", "bullets": ["Cada lexema es la secuencia **más larga posible** para su token.", "Centinela: el carácter leído que ya no pertenece al lexema. Se devuelve al flujo con `ungetc`.", "Lo necesitan los LR infinitos (identificadores, constantes) y los operadores con prefijo común (`+`, `++`, `+=`; `!`, `!=`). Un LR finito como `{` no.", "Excepción: el literal cadena termina al leer la comilla de cierre (sin `\\` previa). No necesita centinela.", "Retorna pares como (identificador, índice) o (tipoConstanteNumerica, valor): el tipo de una constante lo determina el propio scanner.", "**Error léxico**: el primer carácter que lee para armar el próximo lexema no inicia ningún lexema válido. El scanner se lo informa al parser.", "Ignora los espacios que separan lexemas. Se implementa con una rutina basada en un AFD (su TT) o con un programa auxiliar que recibe los tokens como ER (Flex).", "También retorna `(literal-cadena, índice)` y `(palabraReservada, índice)`. Para el tipo de una constante también se acepta que lo deduzca el parser con el token y yylval; **nunca** es una cuestión semántica."], "exam": "¿Todo LR infinito necesita centinela? No: el literal cadena es el contraejemplo. Aparece en los cuatro modelos.", "practice": [[1, "1.5"], [2, "1.5"], [3, "1.5"], [4, "1.5"], [3, "1.3"]]}, {"id": "af", "title": "AFD, AFN y AFN-ε", "what": "Los tres modelos de autómata finito reconocen lenguajes regulares; difieren en la función de transiciones.", "bullets": ["**AFD**: `T: Q × Σ → Q`. Un único estado de llegada por carácter.", "**AFN**: `T: Q × Σ → 2^Q`. 0, 1 o más transiciones por el mismo carácter.", "**AFN-ε**: `T: Q × (Σ ∪ {ε}) → 2^Q`. Suma transiciones que no leen carácter.", "AFD = 5-upla (Q, Σ, T, q0, F), con q0 único.", "Completo: una transición por carácter en cada estado. Se completa con un **estado de rechazo** del que no se sale; el resultado es equivalente.", "Validar una cadena: arranca en el inicial, hace una transición por cada símbolo y, al terminar, acepta si quedó en un estado final.", "La TT de un AFN-ε tiene una columna por cada carácter del alfabeto **más una para ε**.", "Dos AFD son equivalentes si reconocen el mismo LR."], "exam": "Hay que completar antes de complementar. El estado de rechazo es único, por eso el algoritmo de clases nunca lo fusiona.", "practice": [[1, "4.1"]]}, {"id": "thompson", "title": "Algoritmo de Thompson", "what": "Pasa de ER a AFN-ε componiendo autómatas básicos con los tres operadores: unión, concatenación y clausura de Kleene.", "bullets": ["Básico (un carácter o ε): **2 estados**.", "Unión: nuevo inicial y nuevo final, **+2**.", "Clausura de Kleene: nuevo inicial y nuevo final (**+2**), ε del inicial al final (cadena vacía) y del ex final al ex inicial (repetir).", "Concatenación: una transición-ε entre los dos autómatas, **+0**.", "Al inicial no llegan transiciones; el final es único y sin salidas."], "code": "(a+b)c*   a, b, c: 6   unión: +2   estrella: +2   = 10\n((ab)*)*  a, b: 4      estrella: +2   estrella: +2  = 8\n(ab)*     a, b: 4      estrella: +2                 = 6", "exam": "Contar estados: siempre da par, y una estrella de más suma 2 aunque (x*)* = x*. En unión y estrella el inicial solo tiene transiciones ε, así que hacia(inicial, x) = ∅.", "practice": [[1, "4.2"], [1, "4.3"], [2, "4.2"], [2, "4.3"], [3, "4.1"], [4, "4.1"]]}, {"id": "clausuras", "title": "Clausuras-ε (AFN → AFD)", "what": "Construcción de subconjuntos: cada estado del AFD es un conjunto de estados del AFN.", "bullets": ["**Clausura-ε(q)**: q más todo lo alcanzable solo con ε. Nunca es vacía.", "**hacia(R, x)**: estados a los que se llega con x desde los estados de R.", "Inicial del AFD = Clausura-ε del inicial del AFN.", "Cada estado nuevo = Clausura-ε(hacia(R, x)); se repite hasta que no aparezcan estados nuevos.", "Es final todo conjunto que contenga **al menos un** final del AFN.", "Las clausuras de dos estados distintos pueden compartir estados.", "**Clausura-ε(R)** de un conjunto: la unión de las clausuras de sus estados. Ej.: si R = {1, 3, 6}, se unen Clausura-ε(1), (3) y (6).", "Si el AFN no tiene transiciones ε, cada clausura es solo el propio estado y se calculan directamente los hacia.", "En un AFN de Thompson, la clausura-ε del inicial depende de la ER: para la ER `a` es solo {q0}."], "code": "q0 —ε→ q1, q1 —ε→ q3, q1 —a→ q2, q3 —a→ q4, q2 —ε→ q5\nClausura-ε({q0}) = {q0, q1, q3}\nhacia(·, a) = {q2, q4}   →   Clausura-ε = {q2, q4, q5}", "exam": "Calcular un paso: primero hacia, después clausura. Los estados de partida no se conservan después de consumir el símbolo.", "practice": [[4, "4.2"], [3, "4.2"], [1, "4.2"]]}, {"id": "clases", "title": "AFD mínimo (algoritmo de clases)", "what": "Obtiene el AFD con menos estados a partir de un AFD.", "bullets": ["Pasos: eliminar inalcanzables, partir en no finales y finales, eliminar equivalentes inmediatos, armar la TT por clases y refinar.", "**Equivalentes inmediatos**: misma clase y misma fila en la TT. Queda uno solo.", "**Equivalentes por clase**: misma clase y mismas clases de llegada **para todo** símbolo. Si difieren en uno, se separan.", "El algoritmo no elimina inalcanzables: es un paso previo aparte.", "El AFD mínimo es **único**: dos AFD, o dos ER, son equivalentes si tienen el mismo AFD mínimo.", "El estado de rechazo único nunca se fusiona: ningún otro estado se comporta igual. Solo si hubiera más de uno, uno podría eliminarse. Si se quiere sacar, se hace a mano antes o después del algoritmo."], "exam": "Analizar un AFD dado: separar finales y no finales, buscar filas iguales y contar. Muchas veces alcanza con razonar la ER: (ab)* da 2 estados (sin contar el de rechazo) y (a+b)* da 1.", "practice": [[1, "4.1"], [2, "4.1"], [3, "4.3"], [3, "4.4"], [4, "4.3"], [1, "4.4"], [2, "4.4"]]}, {"id": "operaciones", "title": "Complemento, intersección y AF a ER", "what": "Operaciones sobre AFD y el camino inverso, de autómata a expresión regular.", "bullets": ["**Complemento**: completar la TT y después intercambiar finales y no finales (F pasa a Q − F).", "**Intersección**: estados Q1 × Q2, inicial (q1, q2), finales F1 × F2. Se descartan los estados erróneos (inalcanzables o de los que no se sale) y los equivalentes inmediatos.", "**Unión**: un AFD que acepta las cadenas reconocidas por al menos uno de los dos AFD.", "**AF a ER**: eliminar los estados erróneos (los agregados al completar y los inalcanzables), plantear una ecuación por estado (+ε si es final) y resolver con `e = αe + β ⇒ e = α*β` hasta obtener la del **estado inicial**."], "exam": "El error típico es complementar sin completar: si quedan huecos, el resultado es incorrecto.", "practice": []}]}, {"n": 3, "title": "Capa sintáctica", "sub": "Derivaciones, LL(1) y cómo transformar una GIC", "concepts": [{"id": "derivaciones", "title": "Derivaciones, LL y LR", "what": "Cómo se elige qué noterminal expandir, y qué derivación construye cada tipo de parser.", "bullets": ["Por izquierda: se expande el primer noterminal. Por derecha: el último.", "**Descendente (LL)**: derivación por izquierda, del axioma a las hojas; expande el noterminal de la cima.", "**Ascendente (LR)**: derivación por derecha en orden inverso; reduce hasta llegar al axioma.", "Ambigua: dos derivaciones por izquierda distintas para la misma cadena.", "La derivación empieza siempre en el axioma y termina en una secuencia de terminales.", "**LR(1)**: con un solo token de preanálisis hace un análisis ascendente correcto. Se construye con un programa especial: Bison genera un parser ascendente.", "**Toda gramática LL(1) es LR(1)**, pero no al revés. El ascendente admite recursividad a izquierda (se usa para operadores asociativos a izquierda) y trabaja con una pila, como un AFP."], "code": "S → aST | b ;  T → cT | d      cadena: aabcdd\nizq:  S ⇒ aST ⇒ aaSTT ⇒ aabTT ⇒ aabcTT ⇒ aabcdT ⇒ aabcdd\nder:  S ⇒ aST ⇒ aSd ⇒ aaSTd ⇒ aaScTd ⇒ aaScdd ⇒ aabcdd", "exam": "Reconocer si una derivación es por izquierda y qué parser la construye. Aplicar una producción ε no consume el preanálisis.", "practice": [[4, "2.2"], [4, "2.5"]]}, {"id": "ll1", "title": "Gramáticas LL(1)", "what": "El parser elige la producción con un solo token de preanálisis, sin retroceso.", "bullets": ["Lo impiden: **recursividad a izquierda** y **alternativas que empiezan igual** (también cuando el prefijo queda oculto detrás de un noterminal, como X → aY en S → Xba).", "No lo impiden por sí solas: producciones ε, recursividad a derecha, muchas alternativas.", "Se verifica por noterminal: los PREDICE de sus producciones tienen que ser disjuntos. Que dos noterminales distintos compartan un símbolo no es conflicto."], "exam": "¿Qué impide que G sea LL(1)? Buscar prefijos comunes mirando PRIMERO (no solo el primer símbolo escrito) y recursividad a izquierda. Aparece en los cuatro modelos.", "practice": [[1, "2.1"], [2, "2.1"], [3, "2.1"], [4, "2.1"], [3, "1.4"], [1, "2.5"], [2, "2.5"], [3, "2.5"]]}, {"id": "transformaciones", "title": "Factorización y recursividad a izquierda", "what": "Las dos transformaciones que preparan una GIC para LL(1). Ambas conservan el lenguaje.", "bullets": ["**Factorización**: `A → αβ1 | αβ2` pasa a `A → αB ; B → β1 | β2`. Si una alternativa era solo α, B lleva ε.", "**Recursividad a izquierda**: `X → Xα | β` pasa a `X → βZ ; Z → αZ | ε`.", "Factorizar solo no alcanza si queda recursividad a izquierda.", "Si el prefijo común está oculto detrás de un noterminal, primero se **reemplaza** ese noterminal en S y después se factoriza."], "code": "S → baY | acX | a   ⇒   S → baY | aT ;  T → cX | ε\nX → Xa | Xb | a     ⇒   X → aZ ;  Z → aZ | bZ | ε\nS → abY | Xba | a ;  X → aY | ε\n   ⇒ S → abY | aYba | ba | a   ⇒   S → aT | ba ;  T → bY | Yba | ε", "exam": "Elegir la transformación correcta descartando opciones que pierden una cadena (falta ε), que no terminan (Z sin ε), que agregan ε al lenguaje o que generan otro lenguaje, como (a+b)*a.", "practice": [[1, "2.2"], [1, "2.3"], [2, "2.2"], [2, "2.3"], [3, "2.2"], [3, "2.3"], [4, "2.1"], [2, "1.4"]]}, {"id": "conjuntos", "title": "PRIMERO, SIGUIENTE y PREDICE", "what": "Los conjuntos que le dicen al parser predictivo qué producción aplicar según el próximo token.", "bullets": ["**PRIMERO(α)**: terminales que pueden iniciar α. Si un símbolo es anulable se mira el siguiente; incluye ε solo si todo α deriva ε.", "**SIGUIENTE(A)**: el terminal que sigue a A; PRIMERO del noterminal que sigue (sin ε); y si A queda al final, o lo que sigue es anulable, SIGUIENTE del lado izquierdo. El axioma lleva $.", "ε **nunca** está en SIGUIENTE.", "**PREDICE(A → α)** = PRIMERO(α) − {ε}, más SIGUIENTE(A) si α puede derivar ε.", "El símbolo de preanálisis es siempre un **terminal**: el próximo token.", "El noterminal nuevo de la cola recursiva hereda SIGUIENTE: en `Y → aZ ; Z → cZ | ε`, SIGUIENTE(Z) = SIGUIENTE(Y)."], "code": "S → ABd ;  A → a | ε ;  B → bB | ε\nPRIMERO(AB)    = {a, b, ε}\nSIGUIENTE(A)   = PRIMERO(Bd) = {b, d}\nPREDICE(B → ε) = SIGUIENTE(B) = {d}", "exam": "Calcular SIGUIENTE de un noterminal recursivo: X → Xa | Xb aporta a y b; si X queda al final de una producción de S, se suma SIGUIENTE(S), que tiene $. Está en los cuatro modelos.", "practice": [[1, "2.4"], [2, "2.4"], [3, "2.4"], [4, "2.3"], [4, "2.4"], [4, "2.5"]]}, {"id": "pas", "title": "PAS y Match", "what": "La implementación del parser descendente: un procedimiento por noterminal.", "bullets": ["Cada noterminal tiene su PAS, que procesa el lado derecho en orden.", "Para un noterminal se invoca su PAS (puede ser recursivo).", "Para un terminal t se invoca `Match(t)`: pide el próximo token al scanner; si es t, queda en `tokenActual`; si no, `ErrorSintactico(token)`. También se usa `ProximoToken()`.", "Las llamadas a las rutinas semánticas se insertan en los símbolos de acción.", "**Parser LL(1) con pila**: si la cima es un noterminal, se reemplaza por el lado derecho que indica PREDICE para el preanálisis. Si es un terminal igual al preanálisis, se desapila y se avanza; si no coincide, error sintáctico. Con $ en la pila y en la entrada, se acepta.", "Aplicar una producción ε solo desapila el noterminal: **no consume** el preanálisis."], "exam": "Las restricciones de LL(1) (sin recursividad a izquierda ni prefijos comunes) son las que permiten implementar el parser con PAS.", "practice": [[4, "2.5"]], "code": "S → ABd ;  B → bB | ε      pila: B d $   preanálisis: d\nPREDICE(B → ε) = SIGUIENTE(B) = {d}  →  aplicar B → ε\npila: d $   preanálisis: d   →  Match(d)  →  $ $  →  aceptar"}]}, {"n": 4, "title": "Capa semántica y Bison", "sub": "Qué verifica el análisis semántico y cómo se hablan scanner y parser", "concepts": [{"id": "semantico", "title": "Análisis semántico", "what": "Verifica lo que una GIC no puede expresar: las reglas sensibles al contexto (semántica estática).", "bullets": ["Está **inmerso en el sintáctico**: se hace en paralelo, al reconocer cada estructura.", "Verifica: variables declaradas y visibles en su ámbito, tipos compatibles, cantidad de argumentos, no modificar un `const`.", "En teoría esas restricciones las describe una GSC (tipo 1), pero no es factible: se implementan con **rutinas semánticas** que usan la TS. Esa es la respuesta de examen.", "Las rutinas semánticas chequean la semántica estática y, si está bien, traducen a código de MV.", "La semántica se divide en **estática** (lo que se verifica al compilar) y **en tiempo de ejecución**.", "Los símbolos de acción indican cuándo llamarlas, y cada símbolo gramatical tiene un registro semántico. En `<expresión> → <primaria> + <primaria> #sumar`, la rutina Sumar recibe los registros de cada `<primaria>` y produce el de `<expresión>`."], "exam": "Clasificar el error: usar una variable sin declaración visible, o fuera del bloque donde se declaró, es semántico. La validación de tipos en C se hace en compilación.", "practice": [[1, "1.2"], [1, "1.4"], [3, "1.2"], [4, "1.3"], [4, "1.4"]]}, {"id": "flexbison", "title": "Flex, Bison y la comunicación", "what": "Flex genera el scanner y Bison el parser; se comunican mediante yylex() y yylval.", "bullets": ["Flex (`.l`) genera `lex.yy.c` con `yylex()`. Bison (`.y`) genera `<nombre>.tab.c` (`y.tab.c` en modo yacc) con `yyparse()`. Se compilan juntos con gcc.", "`main()` llama a `yyparse()`, que le pide tokens a `yylex()` a medida que los necesita.", "`yylex()` retorna el **código del token** (un entero) y deja el **valor semántico** en `yylval`, variable global compartida.", "`yylex()` devuelve 0 en EOF. `yyparse()` devuelve 0 si la entrada es correcta y 1 si hay error, tras llamar a `yyerror()`.", "`yytext` guarda el texto del lexema e `yyleng` su longitud. Con `[0-9]+ { yylval = atoi(yytext); return NUM; }` y el lexema 36: retorna NUM, yylval = 36, yytext = \"36\", yyleng = 2."], "exam": "yylval no es una columna de la TS ni el valor de retorno de yylex(): es la variable compartida que carga el scanner antes de retornar el token.", "practice": [[1, "1.1"], [1, "1.3"], [2, "1.1"], [2, "1.3"], [4, "1.1"]]}, {"id": "archivobison", "title": "Archivo de Bison", "what": "Tres secciones: definiciones, reglas con acciones y código de usuario.", "bullets": ["`%union`: un campo por **tipo** de valor semántico (por defecto yylval es int). Se usa un campo a la vez.", "`%token` terminales, `%type` tipo de los noterminales, `%left` / `%right` asociatividad, `%start` axioma.", "Reglas: `$$` es el noterminal de la izquierda; `$1`, `$2`, … los símbolos de la derecha por posición.", "Código de usuario: por ejemplo `yyerror()`."], "code": "E : E '+' NUM   { $$ = $1 + $3; }     /* $2 es el token '+' */\n  | NUM         { $$ = $1; } ;", "exam": "Cuántos campos necesita yylval (uno por tipo, no por token) y qué valor recibe $$ en una reducción.", "practice": [[3, "1.1"], [4, "1.2"]]}]}, {"n": 5, "title": "Autómatas de mayor potencia", "sub": "Jerarquía de lenguajes, AFP y Máquina de Turing", "concepts": [{"id": "jerarquia", "title": "Jerarquía de lenguajes", "what": "Cada tipo de lenguaje formal tiene la gramática que lo genera y el autómata mínimo que lo reconoce.", "bullets": ["Cuanto más arriba en la tabla, más poderoso es el modelo: cada uno incluye a los de abajo.", "Un **LIC** es el lenguaje generado por una GIC: sus producciones tienen un solo noterminal a la izquierda.", "El AFP supera al AF por la pila: el AF solo controla los caracteres de la cadena; el AFP, los caracteres y la pila.", "La Máquina de Turing reconoce cualquier lenguaje formal."], "code": "Lenguaje                  Gramática   Autómata mínimo\nLIR  irrestricto          GIR         Máquina de Turing\nLSC  sensible al contexto GSC         Máquina de Turing\nLIC  indep. del contexto  GIC         AF con pila\nLR   regular              GR          Autómata finito", "exam": "Asociar cada lenguaje con su gramática y su autómata. El scanner trabaja con LR (AFD) y el parser con LIC (AFP).", "practice": []}, {"id": "afp", "title": "Autómata finito con pila (AFP)", "what": "Reconoce lenguajes independientes del contexto: es un AF con una pila como memoria.", "bullets": ["Componentes: flujo de entrada, control finito y pila (crece de a muchos símbolos, decrece de a uno).", "7-upla (E, A, A', T, e0, p0, F) con `T: E × (A ∪ {ε}) × A' → E × A'*`.", "Transición con ε: cambia de estado y opera la pila **sin avanzar** en la entrada.", "Reconoce por estado final o por pila vacía. Hay AFPD y AFPN.", "El alfabeto de la pila es distinto del de entr
