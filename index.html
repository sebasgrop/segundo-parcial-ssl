  const codeHTML = TP.code.map((line,i)=>`<div class="cl" data-line="${i+1}"><span class="ln">${i+1}</span><span class="lt">${esc(line)||' '}</span></div>`).join('');
  const ejemplo = `<section class="rmod" id="tp-ejemplo">
    <header class="rmod-head"><span class="rmod-n">archivo.i → salida.txt</span><h2>Ejemplo de la consigna</h2><p>El archivo de entrada y el reporte esperado. Tocá cualquier ubicación del reporte para marcarla en el código.</p></header>
    <div class="ex-code" id="exCode" aria-label="Archivo de entrada archivo.i">${codeHTML}</div>
    <div class="ex-hint" id="exHint" aria-live="polite">Elegí una ubicación del reporte.</div>
    <pre class="code ex-out">${reportHTML}</pre>
  </section>`;

  const defensa = `<section class="rmod" id="tp-defensa">
    <header class="rmod-head"><span class="rmod-n">15 minutos, responden todos</span><h2>Preparar la defensa</h2><p>Preguntas probables sobre el TP, conectadas con la teoría del parcial.</p></header>
    <article class="concept"><div class="auto">${TP.defensa.map((q,i)=>`<details><summary><span class="an">${i+1}</span>${esc(q[0])}</summary><p>${esc(q[1])}${q[2]?` <button class="concept-link" data-concept="${q[2]}">Repasar: ${esc(concTitle(q[2]))}</button>`:''}</p></details>`).join('')}</div></article>
  </section>`;

  $app.innerHTML = `
    ${tabsHTML('tp')}
    <section class="home-head">
      <h1>Trabajo práctico integrador</h1>
      <p>La consigna del TP 4 resumida, el plan de siete etapas del grupo con su avance y una guía para la defensa. El avance y los responsables se guardan en este navegador.</p>
    </section>
    <div class="repaso">
      <nav class="rnav" aria-label="Secciones del TP">
        <div class="rnav-prog"><span>${doneT} de ${totT} tareas del plan</span><i style="--p:${totT?doneT/totT*100:0}%"></i></div>
        ${nav}
      </nav>
      <div class="rcontent">${resumen}${plan}${errores}${ejemplo}${defensa}</div>
    </div>`;
  bindTabs();
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  $app.querySelectorAll('.rnav a').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:smooth,block:'start'}); }));
  $app.querySelectorAll('.dg-node').forEach(n=>{
    const go=()=>document.getElementById('stage-'+n.dataset.stage)?.scrollIntoView({behavior:smooth,block:'start'});
    n.addEventListener('click',go); n.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
  $app.querySelectorAll('[data-task]').forEach(cb=>cb.addEventListener('change',()=>{
    const st=tpState(); st.tasks[cb.dataset.task]=cb.checked; tpSave(st); const y=window.scrollY; renderTP(); window.scrollTo({top:y});
  }));
  $app.querySelectorAll('[data-owner]').forEach(inp=>inp.addEventListener('change',()=>{ const st=tpState(); st.owners[inp.dataset.owner]=inp.value.trim(); tpSave(st); }));
  $app.querySelectorAll('.copy-btn').forEach(b=>b.addEventListener('click',()=>copyPrompt(b)));
  $app.querySelectorAll('.lc').forEach(b=>b.addEventListener('click',()=>showLC(b.dataset.lc)));
  $app.querySelectorAll('.concept-link').forEach(b=>b.addEventListener('click',()=>{ state.tab='repaso'; store.set('ssl2-tab','repaso'); renderRepaso(b.dataset.concept); }));
  if(scrollTo) document.getElementById(scrollTo)?.scrollIntoView({block:'start'}); else window.scrollTo({top:0});
}

function showLC(lc){
  const [L,C] = lc.split(':').map(Number);
  const box = document.getElementById('exCode'); if(!box) return;
  box.querySelectorAll('.cl.hl').forEach(el=>{ el.classList.remove('hl'); const t=el.querySelector('.lt'); t.textContent = TP.code[+el.dataset.line-1] || ' '; });
  const row = box.querySelector(`.cl[data-line="${L}"]`); if(!row) return;
  const src = TP.code[L-1] || ''; const t = row.querySelector('.lt');
  const m = src.slice(C-1).match(/^([A-Za-z_]\w*|"[^"]*"|'[^']*'|\d[\w.]*|@\w+|\S)/); const len = m ? m[0].length : 1;
  t.innerHTML = esc(src.slice(0,C-1)) + `<mark>${esc(src.slice(C-1,C-1+len))}</mark>` + esc(src.slice(C-1+len));
  row.classList.add('hl');
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  document.getElementById('tp-ejemplo').scrollIntoView({behavior:smooth,block:'start'});
  box.scrollTo({top: row.offsetTop - box.clientHeight/2 + row.clientHeight/2, behavior:smooth});
  document.getElementById('exHint').innerHTML = `Línea ${L}, columna ${C}: <code>${esc(src.slice(C-1,C-1+len))}</code>`;
}

function copyPrompt(btn){
  const st = TP.stages.find(x=>x.n===+btn.dataset.copy); const txt = st.prompt;
  const ok = ()=>{ btn.textContent='Copiado'; setTimeout(()=>btn.textContent='Copiar prompt',1600); };
  const fallback = ()=>{ try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); }catch(e){ btn.textContent='No se pudo copiar'; } };
  try{ navigator.clipboard ? navigator.clipboard.writeText(txt).then(ok, fallback) : fallback(); }catch(e){ fallback(); }
}

/* ---------- grilla ---------- */
function gridHTML(){
  const model = DATA[state.m]; const sc = scoreOf(state.m, state.answers);
  const cols = model.exercises.map(ex=>`${ex.items.length}fr`).join(' ') + ' minmax(96px,1fr)';
  return `<nav class="exam-grid" style="grid-template-columns:${cols}" aria-label="Grilla de respuestas">
    ${model.exercises.map((ex,ei)=>`
      <div class="eg-col ${state.view==='quiz' && ei===state.ex ? 'active':''}">
        <button class="eg-head" data-ex="${ei}" aria-label="Ir al ejercicio ${ex.n}"><span>Ej ${ex.n}</span><span class="pts">${fmt(exMax(ex))} p</span></button>
        <div class="eg-cells" style="grid-template-columns:repeat(${ex.items.length},1fr)">
          ${ex.items.map((it,qi)=>{
            const a = state.answers[it.id]; const lock = !unlocked(ex,qi);
            const cls = [a ? (a===it.ans?'ok':'bad') : '', lock?'locked':'', (state.view==='quiz' && ei===state.ex && qi===state.q)?'current':''].join(' ');
            const label = `Ítem ${it.id}` + (a ? `, respondiste ${a}` : lock ? ', bloqueado hasta responder los anteriores' : ', sin responder');
            return `<button class="eg-cell ${cls}" data-ex="${ei}" data-q="${qi}" aria-label="${label}" ${lock?'aria-disabled="true"':''}><span class="id">${it.id}</span><span class="lt">${a||''}</span></button>`;
          }).join('')}
        </div>
      </div>`).join('')}
    <div class="eg-col eg-nota"><div class="eg-head"><span>Nota</span><span class="pts">10 p</span></div><div class="val">${sc.answered ? fmt(sc.total) : '–'}</div></div>
  </nav>`;
}
function bindGrid(){
  $app.querySelectorAll('.eg-head[data-ex]').forEach(b=>b.addEventListener('click',()=>{
    const ei=+b.dataset.ex; state.ex=ei; state.q=nextOpen(DATA[state.m].exercises[ei]); state.view='quiz'; renderQuiz();
  }));
  $app.querySelectorAll('.eg-cell').forEach(b=>b.addEventListener('click',()=>{
    const ei=+b.dataset.ex, qi=+b.dataset.q; const ex=DATA[state.m].exercises[ei];
    if(!unlocked(ex,qi)) return;
    state.ex=ei; state.q=qi; state.view='quiz'; renderQuiz();
  }));
}

/* ---------- pregunta ---------- */
function codeBlock(lines){ return `<pre class="code">${esc(lines.join('\n'))}</pre>`; }
/* una opción que solo contiene producciones ("S → aT; T → cX | ε.") se muestra con una producción por línea */
const PROD = /^[A-Z]'?\s*→\s*[A-Za-zε'|\s]+$/;
function optText(o){
  const prods = o.replace(/\.$/,'').split(/;\s*/);
  return prods.every(p=>PROD.test(p)) ? `<span class="prods">${prods.map(p=>`<span>${esc(p)}</span>`).join('')}</span>` : esc(o);
}
function fig(f){ return IMGS[f] ? `<figure class="fig"><img src="${IMGS[f]}" alt="Diagrama de la resolución"></figure>` : ''; }

function renderQuiz(){
  const model = DATA[state.m]; const ex = model.exercises[state.ex]; const it = ex.items[state.q];
  const chosen = state.answers[it.id];
  $crumb.innerHTML = `<button id="homeLink">ssl</button> / <b>${model.slug}</b> / ej-${ex.n} / ${it.id}` + (state.backConcept ? ` &nbsp; <button class="back-rep" id="backRep">← volver ${state.backTab==='temas' ? 'a temas frecuentes' : 'al repaso'}</button>` : '');

  const ctx = it.ctx ? `<div class="ctx"><p>${esc(it.ctx.text)}</p>${it.ctx.code.length?codeBlock(it.ctx.code):''}${it.ctx.img?fig(it.ctx.img):''}</div>` : '';
  const stmt = it.stmt.length ? `<div class="stmt">${codeBlock(it.stmt)}</div>` : '';
  const opts = it.opts.map((o,i)=>{
    const L = LETTERS[i]; let cls='', mark='';
    if(chosen){ if(L===it.ans){cls='is-ok';mark='✓';} else if(L===chosen){cls='is-bad';mark='✗';} }
    return `<button class="opt ${cls}" data-l="${L}" ${chosen?'aria-disabled="true"':''}><span class="k">${L})</span><span>${optText(o)}</span>${mark?`<span class="mark" aria-hidden="true">${mark}</span>`:''}</button>`;
  }).join('');

  let correction = '';
  if(chosen){
    const right = chosen===it.ans;
    correction = `<div class="correction ${right?'right':'wrong'}" role="status">
      <p class="verdict">${right ? `Correcto: ${it.ans})` : `Elegiste ${chosen}). Respuesta correcta: ${it.ans})`}</p>
      ${it.expl.map(p=>`<p>${esc(p)}</p>`).join('')}
      ${it.blocks.map(b=>`<div class="blk">${b.title?`<div class="bt">${esc(b.title)}</div>`:''}${b.code.length?codeBlock(b.code):''}</div>`).join('')}
      ${it.imgs.map(fig).join('')}
      ${it.ref?`<div class="ref"><b>Del resumen.</b> ${esc(it.ref)}</div>`:''}
    </div>`;
  }

  // siguiente paso
  let nextLabel='', nextFn=null;
  if(chosen){
    if(state.q < ex.items.length-1){ nextLabel=`Siguiente: ${ex.items[state.q+1].id}`; nextFn=()=>{state.q++;renderQuiz();}; }
    else {
      const pend = model.exercises.findIndex((e,ei)=>ei!==state.ex && e.items.some(x=>!state.answers[x.id]));
      if(pend>=0){ nextLabel=`Ir al ejercicio ${model.exercises[pend].n}`; nextFn=()=>{state.ex=pend;state.q=nextOpen(model.exercises[pend]);renderQuiz();}; }
      else { nextLabel='Ver nota'; nextFn=renderResults; }
    }
  }
  const allDone = scoreOf(state.m,state.answers).answered === scoreOf(state.m,state.answers).count;

  $app.innerHTML = `
    ${gridHTML()}
    <p class="ex-title"><b>Ejercicio ${ex.n}</b>: ${esc(ex.title)} (${esc(ex.pts)})</p>
    <article class="sheet enter">
      ${ctx}
      <div class="qhead"><span class="qnum">${it.id}</span><div class="qtext">${esc(it.text)}</div></div>
      ${stmt}
      <div class="opts" role="group" aria-label="Opciones">${opts}</div>
      ${correction}
      <div class="actions">
        <span class="hint">${chosen ? '' : 'Elegí una opción. Teclas A–F.'}</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          ${allDone && nextLabel!=='Ver nota' ? `<button class="btn ghost" id="toRes">Ver nota</button>`:''}
          ${nextFn?`<button class="btn" id="nextBtn">${nextLabel}</button>`:''}
        </span>
      </div>
    </article>`;
  document.getElementById('homeLink').addEventListener('click',()=>{state.backConcept=null;renderHome();});
  const br=document.getElementById('backRep'); if(br) br.addEventListener('click',()=>{const c=state.backConcept,t=state.backTab;state.backConcept=null;state.tab=t;document.querySelector('.wrap').classList.add('wide');t==='temas'?renderTemas(c):renderRepaso(c);});
  bindGrid();
  if(!chosen) $app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.l)));
  if(nextFn) document.getElementById('nextBtn').addEventListener('click',()=>{ nextFn(); window.scrollTo({top:0}); });
  const tr=document.getElementById('toRes'); if(tr) tr.addEventListener('click',renderResults);
  if(chosen){ const nb=document.getElementById('nextBtn'); if(nb) nb.focus({preventScroll:true}); }
}

function answer(L){
  const it = DATA[state.m].exercises[state.ex].items[state.q];
  if(state.answers[it.id]) return;
  state.answers[it.id]=L; saveAnswers(); renderQuiz();
}

document.addEventListener('keydown',e=>{
  if(state.view!=='quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k=e.key.toUpperCase();
  if(LETTERS.includes(k)){ const it=DATA[state.m].exercises[state.ex].items[state.q]; if(!state.answers[it.id]){ e.preventDefault(); answer(k); } }
  else if(e.key==='Enter'){ const nb=document.getElementById('nextBtn'); if(nb && document.activeElement===document.body){ e.preventDefault(); nb.click(); } }
});

/* ---------- resultados ---------- */
function renderResults(){
  state.view='results';
  const model = DATA[state.m]; const sc = scoreOf(state.m, state.answers);
  $crumb.innerHTML = `<button id="homeLink">ssl</button> / <b>${model.slug}</b> / nota`;
  const wrong=[];
  model.exercises.forEach((ex,ei)=>ex.items.forEach((it,qi)=>{ const a=state.answers[it.id]; if(a && a!==it.ans) wrong.push({ei,qi,it,a}); }));
  const pending = sc.count - sc.answered;
  const noun = model.kind==='practica' ? 'cuestionario' : model.kind==='anterior' ? 'parcial' : 'modelo';
  $app.innerHTML = `
    ${gridHTML()}
    <div class="res-head">
      <div><h2>${model.title}</h2><p>${sc.answered - wrong.length} de ${sc.count} ítems correctos${pending?`, ${pending} sin responder`:''}.</p></div>
      <div class="big-nota ${sc.total>=6?'pass':'fail'}">${fmt(sc.total)}<small> / 10</small></div>
    </div>
    <div class="sub-scores">
      ${model.exercises.map((ex,ei)=>`<div class="sub"><div class="t">Ejercicio ${ex.n}: ${esc(ex.short)}</div><div class="v">${fmt(sc.per[ei])} <span style="color:var(--ink-3);font-weight:500;font-size:.9rem">/ ${fmt(exMax(ex))}</span></div></div>`).join('')}
    </div>
    <div class="rev-title">${wrong.length ? 'Para repasar' : 'Sin errores'}</div>
    <div class="rev-list">
      ${wrong.length ? wrong.map(w=>`<button class="rev" data-ex="${w.ei}" data-q="${w.qi}"><span class="rid">${w.it.id}</span><span>${esc(w.it.text)}</span><span class="rl"><span class="y">${w.a})</span> → <span class="c">${w.it.ans})</span></span></button>`).join('')
        : `<p class="empty">Respondiste bien todos los ítems de este ${noun}.</p>`}
    </div>
    <div class="actions">
      <button class="btn ghost" id="resetBtn">Borrar respuestas y reintentar</button>
      <button class="btn" id="backHome">Elegir otro ${noun}</button>
    </div>`;
  document.getElementById('homeLink').addEventListener('click',()=>renderHome());
  document.getElementById('backHome').addEventListener('click',()=>renderHome('modelos'));
  document.getElementById('resetBtn').addEventListener('click',()=>{ store.del('ssl2-m'+state.m); state.answers={}; openModel(state.m); });
  $app.querySelectorAll('.rev').forEach(b=>b.addEventListener('click',()=>{ state.ex=+b.dataset.ex; state.q=+b.dataset.q; state.view='quiz'; renderQuiz(); window.scrollTo({top:0}); }));
  bindGrid();
  window.scrollTo({top:0});
}

/* ---------- tema ---------- */
(function(){
  const saved = store.get('ssl2-theme'); if(saved) document.documentElement.dataset.theme = saved;
  document.getElementById('themeBtn').addEventListener('click',()=>{
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
    const nxt = cur==='dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nxt; store.set('ssl2-theme', nxt);
  });
})();

state.tab = store.get('ssl2-tab') || 'modelos';
renderHome();
</script>
</body>
</html>
