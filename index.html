oat a, int *b){", "2      char _a_[1] = 64;", "3      while(i<=10){", "4          printf(\"%d \\n\",i);", "5          i++;}", "6      return 3;", "7      return 5;"], "img": null}, "opts": ["_a_ no puede declararse como arreglo de char.", "b es un puntero y no puede ser parámetro.", "i se usa en las líneas 3 a 5 sin ninguna declaración visible.", "Dos sentencias return seguidas constituyen un error semántico.", "La condición i<=10 no puede usarse en un while.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["La variable i, usada en el while, en el printf y en el postincremento, no se declara en ningún momento. Además, printf se usa sin estar declarada ni incluida previamente (#include <stdio.h>). Según el criterio de la cátedra, retornar un valor en una función void no genera error semántico: puede indicarse como warning."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "3.4", "text": "Dentro de una función se escribe la sentencia siguiente. ¿Qué declaraciones la hacen semánticamente válida? Suponga punteros válidos.", "stmt": ["M.contador = R[3] + (*S).entero ;"], "ctx": null, "opts": ["struct { int contador; } M; struct est { int entero; } S; int R[4];", "struct { int contador; } *M; struct est { int entero; } *S; int R[4];", "struct { int contador; } M; struct est { int entero; } *S; int R;", "struct { int contador; } M; struct est { int entero; } *S; int R[4];", "Solo B y D son correctas.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["M debe ser una estructura con el miembro contador; R debe admitir el índice 3; (*S).entero exige que S sea un puntero a una estructura con el miembro entero. A desreferencia una estructura; B usa . sobre un puntero; C indexa un int."], "blocks": [{"title": "", "code": ["struct { int contador; } M;", "struct est { int entero; } *S;", "int R[4];"]}], "imgs": [], "ref": ""}]}, {"n": 4, "title": "Algoritmos y autómatas", "short": "Algoritmos y autómatas", "pts": "0.5 puntos por item", "items": [{"id": "4.1", "text": "Al aplicar el algoritmo de Thompson, ¿se puede obtener un AFN con una cantidad impar de estados?", "stmt": [], "ctx": null, "opts": ["Sí, cuando la ER tiene una concatenación.", "Sí, cuando la ER tiene una cantidad impar de símbolos.", "Sí, al aplicar la clausura de Kleene.", "No: siempre se obtiene una cantidad par de estados.", "Solo si la ER es ε.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["El AFN de un carácter simple o de la ER nula tiene dos estados. Cada unión agrega un estado inicial y uno final (cantidad par); lo mismo ocurre con la clausura de Kleene, que solo varía en las transiciones ε que agrega. La concatenación agrega una transición ε entre los autómatas y no agrega estados. Por lo tanto, la cantidad de estados siempre es par."], "blocks": [], "imgs": [], "ref": "Thompson: un carácter (o ε) es un AF básico de dos estados. La unión y la clausura de Kleene agregan un estado inicial y uno final nuevos; la concatenación solo une los autómatas con una transición-ε."}, {"id": "4.2", "text": "En un AFN, ¿las clausuras-ε de dos estados distintos son siempre disjuntas?", "stmt": [], "ctx": null, "opts": ["Sí, siempre.", "Sí, porque cada estado pertenece a una sola clausura.", "No: si existe q7 —ε→ q8, ambas clausuras comparten q8.", "Solo en los AFN de Thompson.", "No, porque todas las clausuras contienen al estado inicial.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Contraejemplo: en este autómata, clausura-ε(q7) = {q7, q8} y clausura-ε(q8) = {q8}. Ambas contienen a q8, por lo que no son disjuntas."], "blocks": [], "imgs": ["media/image9.png"], "ref": "Clausura-ε(q): q y todos los estados a los que se llega desde q usando solo transiciones-ε. Nunca es vacía, porque contiene al menos a q."}, {"id": "4.3", "text": "Al aplicar el algoritmo de clases, ¿se obtiene el mismo AFD?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere el AFD del diagrama. q0 es el estado inicial; q1+ y q3+ son finales.", "code": [], "img": "media/image12.png"}, "opts": ["Sí: el AFD ya es mínimo.", "No: q1+ y q3+ son equivalentes y se fusionan.", "No: q0 y q2 son equivalentes porque ambos son no finales.", "No: q0 y q1+ se fusionan porque ambos tienen un bucle con b.", "Solo B y C son correctas.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Tabla de transición: q0 (a→q1, b→q0, c→q2); q1+ (a→q3, b→q1, c→q2); q2 (a, b, c→q2); q3+ (a→q3, b→q1, c→q2). Clases iniciales: C0 = {q0, q2} (no finales) y C1 = {q1+, q3+} (finales). q1+ y q3+ tienen exactamente las mismas transiciones: equivalencia inmediata; se toma q1+ como representante. En cambio, q0 y q2 se separan: con a, q0 va a C1 y q2 va a C0. Por lo tanto, no se obtiene el mismo AFD."], "blocks": [], "imgs": [], "ref": "Estados equivalentes inmediatos: pertenecen a la misma clase y tienen el mismo comportamiento (filas iguales en la TT). Solo hace falta uno de ellos."}, {"id": "4.4", "text": "¿Cuántos estados tiene el AFD mínimo, incluido el estado de rechazo q2?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere el AFD del diagrama. q0 es el estado inicial; q1+ y q3+ son finales.", "code": [], "img": "media/image12.png"}, "opts": ["4.", "2.", "3.", "1.", "5.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Tras fusionar q1+ con q3+ y separar q0 de q2, quedan tres clases: {q0}, {q1+} y {q2}. Ya no hay equivalencias, así que el AFD mínimo tiene 3 estados. Si además se elimina el estado de rechazo q2, quedan solo 2."], "blocks": [], "imgs": ["media/image15.png"], "ref": "Estados equivalentes por clase: están en la misma clase y tienen el mismo comportamiento por clases (la sucesión de clases de llegada de sus transiciones)."}]}]}, {"title": "Modelo 4", "slug": "modelo-4", "topics": "Acciones $$ y ámbitos; G: S → ABd y derivaciones; fragmento sumar() con const; clausura-ε y AFP", "exercises": [{"n": 1, "title": "Scanner, parser y rutinas semánticas", "short": "Scanner y parser", "pts": "0.5 puntos cada ítem", "items": [{"id": "1.1", "text": "Al reconocer el lexema 36, ¿qué devuelve el scanner y qué contiene yylval?", "stmt": [], "ctx": {"text": "Para 1.1 y 1.2, considere este fragmento de scanner y gramática con acciones. NUM tiene valor semántico entero y se dispone de atoi.", "code": ["[0-9]+  { yylval = atoi(yytext); return NUM; }", "E : E '+' NUM { $$ = $1 + $3; }", "  | NUM       { $$ = $1; } ;"], "img": null}, "opts": ["Devuelve 36 y yylval contiene el código de NUM.", "Devuelve NUM y yylval contiene el entero 36.", "Devuelve yytext y yylval contiene la cadena \"36\".", "Devuelve NUM y yylval contiene 2.", "Devuelve un token para 3 y otro para 6.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["[0-9]+ reconoce el lexema completo \"36\". atoi convierte su texto al valor entero 36, que se guarda en yylval. return NUM devuelve la categoría del token. El código del token y su atributo son datos diferentes; además, yytext es \"36\" e yyleng es 2."], "blocks": [], "imgs": [], "ref": "Cada token se identifica con un número entero y su valor semántico se guarda en la variable global compartida yylval, que luego se usa en las acciones de las producciones."}, {"id": "1.2", "text": "En la reducción E → E '+' NUM, el E de la derecha vale 5 y NUM vale 9. ¿Qué valor recibe el E de la izquierda?", "stmt": [], "ctx": {"text": "Para 1.1 y 1.2, considere este fragmento de scanner y gramática con acciones. NUM tiene valor semántico entero y se dispone de atoi.", "code": ["[0-9]+  { yylval = atoi(yytext); return NUM; }", "E : E '+' NUM { $$ = $1 + $3; }", "  | NUM       { $$ = $1; } ;"], "img": null}, "opts": ["5.", "9.", "El código del token '+'.", "14.", "59.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["En la acción, $1 es el valor del primer símbolo de la derecha (E = 5), $2 corresponde a '+' y $3 al tercero (NUM = 9). $$ designa el valor del E de la izquierda. La asignación $$ = $1 + $3 produce 5 + 9 = 14."], "blocks": [], "imgs": [], "ref": "En las acciones, los valores semánticos de la parte derecha se acceden con las pseudovariables $N (N = posición del símbolo); el noterminal de la parte izquierda se referencia con $$."}, {"id": "1.3", "text": "Dentro de una función se escribe «int x; x = y + 1;». Si y no tiene una declaración visible, ¿qué problema debe detectarse?", "stmt": [], "ctx": null, "opts": ["Error léxico: y no puede formar un identificador.", "Error sintáctico: una asignación no puede contener una suma.", "Error semántico: y se usa sin una declaración visible.", "Error léxico: el número 1 no es un token de C.", "Ningún error: la asignación declara automáticamente y.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["y es un identificador léxicamente válido y la asignación tiene una estructura sintáctica válida. La restricción incumplida es el uso de un identificador sin declaración visible: corresponde al análisis semántico y a la consulta de la tabla de símbolos. La asignación no declara y."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "1.4", "text": "Dentro de una función se escribe «int t; { float t; t = 2.5; }». ¿Qué declaración se vincula con t en la asignación?", "stmt": [], "ctx": null, "opts": ["La declaración externa int t, porque apareció primero.", "Ambas declaraciones simultáneamente.", "Ninguna: repetir el nombre en otro bloque siempre es inválido.", "La declaración interna float t, visible en ese bloque.", "La última declaración de t que aparezca en cualquier parte del archivo.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["El bloque interno introduce un ámbito anidado. Su declaración float t oculta temporalmente la externa y es la declaración visible más cercana para ese uso. La búsqueda en la tabla de símbolos debe respetar los ámbitos; no basta elegir la primera o la última aparición del nombre en todo el archivo."], "blocks": [], "imgs": [], "ref": "Tabla de símbolos: contiene los identificadores con sus atributos. Para nombres de variables, los atributos son tipo y ámbito."}, {"id": "1.5", "text": "Un scanner distingue los operadores ! y !=. Si la entrada es !x, ¿qué debe hacer tras reconocer el primer token?", "stmt": [], "ctx": null, "opts": ["Entregar ! y dejar x disponible para reconocer el token siguiente.", "Entregar != porque leyó un segundo carácter.", "Descartar x, aunque no forme parte del operador.", "Entregar !x como un único operador.", "Rechazar la entrada porque todo ! debe ir seguido de =.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["El prefijo != no coincide porque el segundo carácter es x. El lexema del primer token es únicamente !. Si el scanner examinó x para decidir, debe conservarlo para el próximo reconocimiento, mediante retroceso o un mecanismo equivalente. x no pertenece al operador y no debe perderse."], "blocks": [], "imgs": [], "ref": "Cada lexema es la mayor secuencia posible de caracteres para su token, por lo que a veces se lee un primer carácter que no pertenece al lexema (centinela). Ese carácter extra se devuelve al flujo con ungetc."}]}, {"n": 2, "title": "Gramáticas y análisis sintáctico", "short": "Gramáticas LL(1)", "pts": "0.5 puntos por item", "items": [{"id": "2.1", "text": "¿Qué transformación conserva el lenguaje y permite un análisis LL(1)?", "stmt": [], "ctx": {"text": "Para 2.1 use la gramática:", "code": ["S → Sc | ab | ad"], "img": null}, "opts": ["S → aRT; R → b | d; T → cT | ε.", "S → aR; R → bT | d; T → cT | ε.", "S → aRT; R → b | d; T → cT.", "S → Sc | aR; R → b | d.", "S → aRT; R → b | d | ε; T → cT | ε.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["El lenguaje original es {abcⁿ, adcⁿ | n ≥ 0}. La recursividad izquierda agrega c al final; se elimina con T → cT | ε y se factoriza el prefijo a mediante R → b | d. En A, R elige con b o d, y T con c o con SIGUIENTE(T) = {$} para ε: no hay conflicto LL(1). B no permite c después de ad; C no tiene una derivación terminal para T; D conserva recursividad izquierda; E agrega acⁿ."], "blocks": [], "imgs": [], "ref": "Para que una GIC sea LL(1) se aplican dos transformaciones: factorización a izquierda (prefijos comunes) y eliminación de la recursividad a izquierda."}, {"id": "2.2", "text": "Sobre la siguiente derivación y los analizadores sintácticos, evalúe las afirmaciones:", "stmt": ["S ⇒ ABd ⇒ aBd ⇒ abBd ⇒ abd"], "ctx": {"text": "Para 2.2–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y d.", "code": ["S → ABd","A → a | ε","B → bB | ε"], "img": null}, "opts": ["La secuencia mostrada es una derivación por izquierda.", "Un análisis LL puede construirla expandiendo el no terminal de la cima.", "Las reducciones de un análisis LR reconstruyen una derivación por derecha en orden inverso.", "En un análisis LL, aplicar una producción ε consume el símbolo de preanálisis.", "Solo A, B y C son correctas.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["A es verdadera: en cada paso se reemplaza el no terminal situado más a la izquierda. B es verdadera: LL construye una derivación por izquierda mediante expansiones desde S. C es verdadera: LR reduce desde la entrada hacia S y reconstruye una derivación por derecha en sentido inverso. D es falsa: una producción ε no consume entrada. La opción E reúne exactamente las afirmaciones verdaderas; por la instrucción de selección, es la única respuesta seleccionable."], "blocks": [], "imgs": [], "ref": "Descendente (LL): produce una derivación por izquierda. Ascendente (LR): usa la derivación por derecha en orden inverso; la última producción aplicada es la primera descubierta."}, {"id": "2.3", "text": "¿Cuál es PRIMERO(AB)?", "stmt": [], "ctx": {"text": "Para 2.2–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y d.", "code": ["S → ABd","A → a | ε","B → bB | ε"], "img": null}, "opts": ["{a}.", "{a, b}.", "{a, b, d}.", "{a, b, ε}.", "{b, ε}.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["PRIMERO(A) = {a, ε} y PRIMERO(B) = {b, ε}. Se incluye a; como A puede desaparecer, también se incluye b. Como ambos no terminales pueden producir ε, AB también puede hacerlo y se incluye ε. d pertenece a PRIMERO(ABd), pero no a PRIMERO(AB)."], "blocks": [], "imgs": [], "ref": "PRIMERO(X1…Xm): si Xi es terminal, pertenece; si es noterminal, se calculan los PRIMERO de sus producciones; si Xi puede generar ε, se mira también X(i+1), y así. Si toda la secuencia deriva ε, ε ∈ PRIMERO."}, {"id": "2.4", "text": "¿Cuál es SIGUIENTE(A)?", "stmt": [], "ctx": {"text": "Para 2.2–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y d.", "code": ["S → ABd","A → a | ε","B → bB | ε"], "img": null}, "opts": ["{b}.", "{b, d}.", "{a, b}.", "{b, d, $}.", "{b, d, ε}.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["En S → ABd, después de A aparece Bd. PRIMERO(Bd) = {b, d}, porque B puede producir una o varias b, o ε, y después siempre está d. Por eso SIGUIENTE(A) = {b, d}. Bd no es anulable: no se incorpora SIGUIENTE(S) = {$}. ε nunca integra un conjunto SIGUIENTE."], "blocks": [], "imgs": [], "ref": "SIGUIENTE(A): si A va seguido de un terminal x, x ∈ SIGUIENTE(A); si va seguido de un noterminal B, PRIMERO(B) ⊆ SIGUIENTE(A); si A es el último símbolo de T → …A, SIGUIENTE(T) ⊆ SIGUIENTE(A). El axioma lleva fdt ($)."}, {"id": "2.5", "text": "En el análisis LL(1) se llega a la siguiente configuración. ¿Qué acción corresponde?", "stmt": ["Pila:         B d $   (cima a la izquierda)", "Preanálisis:  d"], "ctx": {"text": "Para 2.2–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y d.", "code": ["S → ABd","A → a | ε","B → bB | ε"], "img": null}, "opts": ["Aplicar B → bB y consumir d.", "Desapilar B y consumir d en ese mismo paso.", "Aplicar B → ε, desapilar B y conservar d como preanálisis.", "Rechazar, porque d no pertenece a PRIMERO(B).", "Aceptar inmediatamente, aunque queden símbolos en la pila.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["PRIMERO(B) = {b, ε} y SIGUIENTE(B) = {d}. La entrada d selecciona B → ε: se retira B sin consumir entrada. La pila queda d $ y el preanálisis sigue siendo d. En el paso siguiente se empareja el terminal d y se avanza; luego, con $ en pila y entrada, se acepta."], "blocks": [], "imgs": [], "ref": "PREDICE(A → X1…Xm) = PRIMERO(X1…Xm) si ε no está en él; si está, (PRIMERO − {ε}) ∪ SIGUIENTE(A). Si los PREDICE de cada noterminal no se superponen, la gramática es LL(1)."}]}, {"n": 3, "title": "Código C: léxico, sintaxis, semántica y declaraciones", "short": "Código C", "pts": "0.75 puntos por item", "items": [{"id": "3.1", "text": "¿Cuál es el diagnóstico léxico correcto del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int sumar(int n) {", "2      const int base = 2;", "3      int total = 0;", "4      while (n > 0 {", "5          total += base;", "6          base = base + 1;", "7          n--;", "8      }", "9      return total;", "10 }"], "img": null}, "opts": ["const es un identificador inválido.", "+= debe dividirse necesariamente en dos tokens.", "Los lexemas son válidos y += es un único token.", "La ausencia de ) en la línea 4 es un error léxico.", "n-- es un único identificador.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["El scanner puede reconocer todos los lexemas: palabras reservadas, identificadores, constantes y operadores. += y -- son operadores compuestos, cada uno un token; n y -- son tokens separados. Falta un token ) para completar la estructura de while, pero esa ausencia es un problema sintáctico, no un lexema inválido."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.2", "text": "¿Qué cambio corrige el error sintáctico del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int sumar(int n) {", "2      const int base = 2;", "3      int total = 0;", "4      while (n > 0 {", "5          total += base;", "6          base = base + 1;", "7          n--;", "8      }", "9      return total;", "10 }"], "img": null}, "opts": ["Agregar ) entre 0 y { en la línea 4.", "Agregar ; después de while, antes de su cuerpo.", "Quitar const de la línea 2.", "Reemplazar += por = en la línea 5.", "Agregar ; después de la llave final de la función.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["La forma de la sentencia es while (expresión) sentencia. En la línea 4 se abrió ( y no se cerró antes de {. La corrección es while (n > 0) {. Quitar const resolvería otro problema, pero no repara esa estructura sintáctica."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.3", "text": "Corregida la línea 4, ¿qué restricción semántica se incumple?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int sumar(int n) {", "2      const int base = 2;", "3      int total = 0;", "4      while (n > 0 {", "5          total += base;", "6          base = base + 1;", "7          n--;", "8      }", "9      return total;", "10 }"], "img": null}, "opts": ["Una función int no puede devolver una variable int.", "Un while no puede tener una expresión relacional como condición.", "n-- exige que n sea un puntero.", "La asignación de la línea 6 intenta modificar un objeto declarado const.", "total += base solo es válido si ambos son float.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["base fue declarado const int: su valor puede usarse en total += base, pero base no es un lvalue modificable. La asignación base = base + 1 de la línea 6 incumple esa restricción. n es un int modificable, por lo que n-- es válido; también son válidos la condición y return total."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "3.4", "text": "Con estas estructuras y operaciones dentro de una función, ¿qué declaraciones de f e items permiten ambas operaciones? Suponga i válido, punteros válidos y datos inicializados.", "stmt": ["typedef struct { double importe; int unidades; } Item;", "typedef struct { Item *detalle; double total; } Factura;", "f->total = items[i].importe * items[i].unidades;", "f->detalle = &items[i];"], "ctx": null, "opts": ["Factura *f; Item items[5];", "Factura f; Item items[5];", "Factura *f; Item *items;", "Factura *f; double items[5];", "Solo A y C son correctas.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["En A, f es un puntero a Factura, por lo que f->total y f->detalle son válidos; items[i] es un Item y &items[i] tiene tipo Item*. En C, un Item* también admite indexación bajo las condiciones indicadas, con los mismos tipos. B usa -> sobre un objeto Factura, que exigiría .; D pretende acceder a miembros de un double. E reúne exactamente A y C."], "blocks": [], "imgs": [], "ref": ""}]}, {"n": 4, "title": "Algoritmos y autómatas", "short": "Algoritmos y autómatas", "pts": "0.5 puntos por item", "items": [{"id": "4.1", "text": "En Thompson para (a + b)c* ¿Cuántos estados se obtienen?", "stmt": [], "ctx": null, "opts": ["8.", "10.", "12.", "14.", "6.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Los literales a, b y c aportan 2 estados cada uno: 6. La unión a + b añade 2: subtotal 8. La estrella aplicada a c añade 2: total 10. La concatenación entre ambos fragmentos agrega una transición ε, pero no estados ni fusiones en la construcción indicada."], "blocks": [], "imgs": [], "ref": "Thompson: un carácter (o ε) es un AF básico de dos estados. La unión y la clausura de Kleene agregan un estado inicial y uno final nuevos; la concatenación solo une los autómatas con una transición-ε."}, {"id": "4.2", "text": "En un AFN, las únicas transiciones son q0 —ε→ q1, q1 —ε→ q3, q1 —a→ q2, q3 —a→ q4 y q2 —ε→ q5. Desde clausura-ε({q0}), ¿qué conjunto resulta tras consumir a y aplicar clausura-ε?", "stmt": [], "ctx": null, "opts": ["{q2, q4}.", "{q0, q1, q3}.", "{q2, q5}.", "{q2, q4, q5}.", "{q0, q1, q2, q3, q4, q5}.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Primero, clausura-ε({q0}) = {q0, q1, q3}; incluye q0 y los estados alcanzables sin consumir entrada. Desde q1 y q3, las transiciones con a alcanzan q2 y q4. La clausura de {q2, q4} incorpora q5 por q2 —ε→ q5. Resultado: {q2, q4, q5}. Los estados de partida no se conservan automáticamente después de consumir a."], "blocks": [], "imgs": [], "ref": "hacia(R, x): estados a los que se transita por x desde los estados de R. Cada estado nuevo del AFD es la Clausura-ε de un hacia(R, x)."}, {"id": "4.3", "text": "Al aplicar el algoritmo de clases de un AFD, p y q están en C0. Con a, δ(p,a) está en C1 y δ(q,a) está en C0, con C0 ≠ C1. ¿Qué corresponde hacer?", "stmt": [], "ctx": null, "opts": ["Mantener p y q juntos porque estaban en la misma clase.", "Separarlos solo si uno es final y el otro no.", "Separar p y q: con el mismo símbolo llegan a clases diferentes.", "Fusionar C0 y C1 para conservar p y q juntos.", "Separarlos únicamente si difieren para todos los símbolos.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["En el refinamiento se compara, para cada símbolo, la clase de destino. Si existe al menos un símbolo que lleva a clases diferentes, los estados no pueden permanecer en la misma subclase. Aquí a ya permite separar p y q, aunque ambos hayan compartido C0 y su condición de aceptación."], "blocks": [], "imgs": [], "ref": "Estados equivalentes por clase: están en la misma clase y tienen el mismo comportamiento por clases (la sucesión de clases de llegada de sus transiciones)."}, {"id": "4.4", "text": "¿Qué característica tiene una transición ε de un autómata de pila (AFP)?", "stmt": [], "ctx": null, "opts": ["Consume un carácter ε de la entrada.", "Solo puede ejecutarse después de consumir toda la entrada.", "Obliga a vaciar toda la pila.", "Puede cambiar el estado y operar sobre la pila sin consumir entrada.", "No puede consultar el símbolo de la cima.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["ε en la componente de entrada significa que la transición no consume un símbolo. Según la función de transición y el símbolo de cima requerido, puede cambiar de estado y reemplazar, apilar o desapilar símbolos. No es un carácter de la cadena, no exige que la entrada haya terminado y no obliga a vaciar la pila."], "blocks": [], "imgs": [], "ref": "AFP: T(e, ε, R) = (e', α): estando en e y con R en el tope, pasa a e', reemplaza R por α y no avanza ninguna posición en el flujo de entrada."}]}]}];
const PRACTICA = (()=>{
  /* `to` es la letra donde se ubica la opción correcta, para que la respuesta no quede siempre en la misma posición */
  const q = (id, text, opts, ans, expl, to = ans) => {
    const L = "ABCD"; const o = [...opts]; const [right] = o.splice(L.indexOf(ans), 1); o.splice(L.indexOf(to), 0, right);
    return {id, text, stmt: [], ctx: null, opts: o, ans: to, expl: [expl], blocks: [], imgs: [], ref: null};
  };
  const quiz = (n, title, short, topics, items) => ({title: `Práctica ${n}`, slug: `practica-${n}`, kind: "practica", topics, exercises: [{n: 1, title, short, pts: "1 punto cada ítem", items}]});
  return [
  quiz(1, "Autómatas y derivaciones", "Autómatas y derivaciones", "AFD vs AFP; transición ε de un AFP; Thompson; clausura-ε; algoritmo de clases y AFD mínimo; derivaciones, LL y LR", [
    q("1", "¿Cuál es la diferencia fundamental entre el mecanismo de reconocimiento de un Autómata Finito Determinístico (AFD) y un Autómata Finito de Pila (AFP)?", [
      "El AFD reconoce lenguajes de tipo 2 (LIC), mientras que el AFP solo reconoce lenguajes de tipo 3 (LR).",
      "El AFP cuenta con una memoria auxiliar tipo LIFO (pila) que le permite almacenar información sobre el proceso de derivación para reconocer LIC, mientras que el AFD no posee memoria auxiliar y solo reconoce LR.",
      "El AFP solo puede reconocer cadenas por estado final, mientras que el AFD únicamente reconoce cadenas por pila vacía.",
      "El AFD utiliza reglas de producción con el token error, mientras que el AFP requiere una Máquina de Turing para procesar su cinta."
    ], "B", "Los Lenguajes Regulares son reconocidos por Autómatas Finitos. Para reconocer Lenguajes Independientes del Contexto se requiere la memoria LIFO que brinda la pila de un AFP, donde se guarda el estado de la derivación (por ejemplo, el anidamiento de paréntesis o de llaves). Por eso el scanner trabaja con un AFD y el parser con un AFP.", "D"),
    q("2", "Un AFP tiene la transición T(2, ε, Z) = {(3, ε)}. ¿Qué hace el autómata al aplicarla?", [
      "Lee el carácter ε de la entrada, pasa al estado 3 y deja la pila sin cambios.",
      "Pasa al estado 3 y desapila Z, sin avanzar en la entrada.",
      "Pasa al estado 3 y apila Z, sin avanzar en la entrada.",
      "Solo puede aplicarse si la pila está vacía, y termina reconociendo la cadena."
    ], "B", "Una transición ε no consume ningún carácter de la entrada, pero sí consulta la cima de la pila: con Z en la cima pasa del estado 2 al 3 y reemplaza Z por ε, es decir, la desapila. ε no es un carácter que se lea.", "A"),
    q("3", "¿Cuál de las siguientes es una característica de todo AFN-ε obtenido con el algoritmo de Thompson?", [
      "El estado inicial tiene al menos una transición entrante para permitir la repetición.",
      "Puede tener varios estados finales, uno por cada operando de la ER.",
      "Al estado inicial no llegan transiciones, el final es único y sin transiciones de salida, y la cantidad de estados es siempre par.",
      "No tiene transiciones ε si la ER no usa la clausura de Kleene."
    ], "C", "Thompson compone autómatas básicos de 2 estados; la unión y la clausura suman 2 estados cada una y la concatenación no suma ninguno, así que el total siempre es par. Al inicial nunca llegan transiciones y el final es único y sin salidas. La concatenación y la unión también usan transiciones ε."),
    q("4", "¿Cuántos estados tiene el AFN-ε que se obtiene al aplicar el algoritmo de Thompson a la ER (a+b)*(ab)*?", [
      "10", "12", "14", "16"
    ], "C", "Hay cuatro caracteres (a, b, a, b): 4 autómatas básicos de 2 estados = 8. La unión a+b suma 2 (10), la estrella de (a+b)* suma 2 (12) y la estrella de (ab)* suma 2 (14). Las dos concatenaciones (ab y la de los dos factores) no agregan estados."),
    q("5", "Un AFN tiene solo estas transiciones: q0 —ε→ q1, q0 —ε→ q2, q1 —a→ q3, q2 —b→ q4, q3 —ε→ q5. Partiendo de Clausura-ε({q0}), ¿qué estado del AFD se obtiene al consumir a?", [
      "{q3}", "{q3, q5}", "{q0, q1, q2, q3, q5}", "{q3, q4, q5}"
    ], "B", "Clausura-ε({q0}) = {q0, q1, q2}. Con a solo hay transición desde q1: hacia({q0, q1, q2}, a) = {q3}. Luego se aplica la clausura: Clausura-ε({q3}) = {q3, q5}. Los estados de partida no se conservan después de consumir el símbolo."),
    q("6", "En el flujo de transformación ER → AFN → AFD → AFD mínimo, ¿cuál es el propósito específico del Algoritmo de Clases?", [
      "Transformar una Expresión Regular en un AFN con transiciones ε mediante el método de Thompson.",
      "Obtener las ecuaciones del autómata para hallar su ER equivalente.",
      "Tomar la Tabla de Transiciones de un AFD completo y particionar sus estados en clases de equivalencia para fusionar los estados equivalentes y obtener el AFD mínimo de ese lenguaje.",
      "Eliminar los estados inalcanzables del AFD."
    ], "C", "El Algoritmo de Clases parte de la Tabla de Transiciones de un AFD, separa inicialmente estados finales y no finales, y refina las clases según a qué clase llega cada estado con cada símbolo, hasta que no cambian. Al fusionar los estados de cada clase se obtiene el único AFD mínimo. Eliminar los inalcanzables es un paso previo aparte, no lo hace el algoritmo.", "A"),
    q("7", "¿Cuántos estados tiene el AFD mínimo que reconoce la ER (a+b)*a?", [
      "1, porque (a+b)* acepta cualquier cadena.",
      "2, y no necesita estado de rechazo.",
      "3, contando un estado de rechazo.",
      "4, uno por cada símbolo de la ER más el inicial."
    ], "B", "Alcanza con recordar si el último carácter leído fue a: un estado no final (la cadena no termina en a, incluido el inicio) y un estado final (termina en a). Con a se va al final y con b al no final desde cualquiera de los dos, así que el AFD ya está completo y no necesita estado de rechazo.", "D"),
    q("8", "Dada la gramática S → AB ; A → aA | b ; B → c y la derivación S ⇒ AB ⇒ Ac ⇒ aAc ⇒ abc, ¿qué afirmación es correcta?", [
      "Es una derivación por izquierda, la que construye un parser descendente LL(1).",
      "Es una derivación por derecha, la que un parser ascendente recorre en orden inverso.",
      "No es una derivación válida, porque se expandió B antes que A.",
      "Muestra que la gramática es ambigua."
    ], "B", "En el segundo paso se expandió B, el último noterminal de AB: en cada paso se reemplaza el noterminal de más a la derecha, así que es una derivación por derecha. Un parser ascendente (LR) hace estas reducciones en orden inverso; un descendente construye la derivación por izquierda.", "A"),
    q("9", "En la clasificación de analizadores sintácticos, ¿qué significan las siglas y el número en LL(1) y LR(1)?", [
      "La primera letra indica la fase del compilador (Léxico/Lógica), la segunda la regla de reducción y el 1 la cantidad de pilas utilizadas.",
      "En ambos casos la primera L significa lectura de la entrada de izquierda a derecha; la segunda letra indica el tipo de derivación (L por izquierda, R por derecha); y el 1 es un único token de preanálisis.",
      "La primera L representa la librería libl.a, la R el registro de la Tabla de Símbolos y el 1 que procesa una línea de código por paso.",
      "LL(1) analiza desde las hojas a la raíz (ascendente) con 1 token, mientras que LR(1) analiza de la raíz a las hojas (descendente) con 1 token."
    ], "B", "La primera L viene de Left-to-right (lectura de izquierda a derecha). La segunda letra es la derivación: L = derivación por izquierda, R = derivación por derecha (en orden inverso). El número es la cantidad de tokens de preanálisis. Toda gramática LL(1) es LR(1), pero no al revés.", "D"),
    q("10", "¿Qué relación existe entre la secuencia de producciones que reduce un parser ascendente (por ejemplo, LR) y los procesos formales de derivación?", [
      "Equivale exactamente a una derivación por izquierda en orden directo.",
      "Es la secuencia inversa de una derivación a derecha.",
      "Corresponde a una transformación de expresiones regulares mediante el Algoritmo de Thompson.",
      "Es una derivación sensible al contexto ejecutada por una Máquina de Turing."
    ], "B", "El análisis ascendente construye el árbol desde las hojas (tokens) hacia la raíz (axioma). Sus reducciones son exactamente la secuencia inversa de una derivación a derecha.")
  ]),
  quiz(2, "Gramáticas LL(1)", "LL(1)", "Recursividad a izquierda; factorización; prefijos comunes ocultos; PRIMERO, SIGUIENTE y PREDICE; parser LL(1) con pila y producciones ε", [
    q("1", "¿Por qué un analizador sintáctico descendente LL(1) no puede procesar directamente una gramática que contenga recursividad a izquierda?", [
      "Porque las gramáticas con recursividad a izquierda generan lenguajes sensibles al contexto.",
      "Porque el parser predictivo entraría en un ciclo infinito al expandir recursivamente el no terminal sin haber consumido ningún token de entrada.",
      "Porque Bison no permite declarar no terminales recursivos en la sección de reglas.",
      "Porque la pila del autómata se vaciaría inmediatamente antes de leer la cadena."
    ], "B", "Los parsers descendentes (PAS o LL(1) con pila) expanden los no terminales desde la raíz hacia las hojas. Ante una regla A → Aα, el procedimiento intenta expandir A indefinidamente sin consumir tokens, y entra en un bucle infinito.", "C"),
    q("2", "Dada la regla recursiva a izquierda A → Aα | β (donde β no comienza con A), ¿cuál es la estructura equivalente sin recursividad a izquierda que puede procesar un parser LL(1)?", [
      "A → αA' | β  y  A' → α | ε",
      "A → βA'  y  A' → αA' | ε",
      "A → A'β  y  A' → A'α | ε",
      "A → βα  y  A' → ε"
    ], "B", "La técnica estándar convierte la recursividad a izquierda en recursividad a derecha: A → βA' y A' → αA' | ε. Genera el mismo lenguaje y permite que el parser decida con el preanálisis sin entrar en un bucle infinito. Sin la ε, A' no terminaría nunca.", "A"),
    q("3", "Dada la producción A → αβ1 | αβ2, ¿cuál es el objetivo de aplicar Factorización a Izquierda?", [
      "Eliminar la recursividad a izquierda de la gramática.",
      "Aislar el prefijo común α en una producción A → αA' para que el parser LL(1) pueda decidir qué alternativa aplicar mirando el siguiente token de preanálisis.",
      "Convertir un AFN en un AFD mínimo.",
      "Forzar que todos los operadores tengan asociatividad a derecha."
    ], "B", "Si dos producciones de un mismo no terminal empiezan con el mismo prefijo α, el parser LL(1) no puede elegir mirando un solo token. La factorización aísla α (A → αA') y delega la decisión a A'. Factorizar solo no alcanza si además hay recursividad a izquierda.", "D"),
    q("4", "En el diseño de analizadores LL(1), ¿cómo se define el conjunto SIGUIENTE(A) de un no terminal A?", [
      "Es el conjunto de todos los terminales con los que puede comenzar cualquier cadena derivada desde A.",
      "Es el conjunto de no terminales que aparecen del lado izquierdo en las producciones donde A está del lado derecho.",
      "Es el conjunto de terminales que pueden aparecer inmediatamente a la derecha de A en alguna cadena de derivación válida.",
      "Es el conjunto de tokens declarados en la directiva %token de Bison."
    ], "C", "SIGUIENTE(A) agrupa los terminales que pueden figurar inmediatamente a continuación de A en alguna forma sentencial derivada desde el axioma: es su contexto derecho. Los terminales con los que puede comenzar lo que deriva A forman PRIMERO(A), no SIGUIENTE(A)."),
    q("5", "Al calcular SIGUIENTE(A) para un no terminal A en una GIC LL(1), ¿cuál de los siguientes elementos NUNCA puede formar parte de ese conjunto?", [
      "El símbolo de fin de texto ($ o fdt).",
      "La palabra nula (ε).",
      "Un token de puntuación como el punto y coma.",
      "Un token de categoría léxica como identificador o constante numérica."
    ], "B", "SIGUIENTE(A) contiene solo terminales que pueden aparecer a la derecha de A, más $ si A puede quedar al final de lo que deriva el axioma. La palabra nula no es un terminal que pueda aparecer en la entrada, así que nunca pertenece a un SIGUIENTE.", "A"),
    q("6", "Dada una producción A → α, ¿cuándo incluye PREDICE(A → α) a los elementos de SIGUIENTE(A)?", [
      "Siempre, sin importar la estructura de α.",
      "Únicamente cuando α puede derivar la palabra nula (ε).",
      "Solo cuando A es el axioma de la gramática.",
      "Solo cuando A tiene recursividad a derecha."
    ], "B", "PREDICE(A → α) es PRIMERO(α) − {ε}. Pero si α puede derivar ε, la regla también se predice con los tokens que pueden aparecer a continuación de A, por lo que se agrega SIGUIENTE(A).", "D"),
    q("7", "En un parser predictivo descendente con pila, ¿qué hace el algoritmo cuando en la cima de la pila hay un no terminal A, la entrada ofrece el token t y la tabla indica la regla A → X1 X2 X3?", [
      "Hace push de t en la pila y avanza el puntero de entrada.",
      "Hace pop de A y luego push de los símbolos del lado derecho en orden inverso (X3, X2 y finalmente X1) para que X1 quede en la cima.",
      "Informa un error sintáctico, porque en la cima debería haber un terminal.",
      "Reduce, reemplazando X1 X2 X3 por A en la pila."
    ], "B", "Al expandir A se lo saca de la pila (pop) y se apilan los símbolos del lado derecho en orden inverso, para que el primero (X1) quede en la cima listo para compararse con la entrada. Reemplazar X1 X2 X3 por A sería reducir, que es lo que hace un parser ascendente."),
    q("8", "Con la gramática S → aBc ; B → bB | ε, un parser LL(1) con pila tiene B c $ en la pila (cima a la izquierda) y el preanálisis es c. ¿Qué corresponde hacer?", [
      "Informar un error sintáctico, porque B no deriva ninguna cadena que empiece con c.",
      "Aplicar B → ε: desapilar B sin consumir c; luego, con c en la cima, hacer Match(c).",
      "Aplicar B → bB, porque es la única producción que consume un terminal.",
      "Aplicar B → ε y avanzar al siguiente token, descartando c."
    ], "B", "PREDICE(B → ε) = SIGUIENTE(B) = {c}, así que con preanálisis c se aplica B → ε. Una producción ε solo desapila el noterminal: no consume el preanálisis. Queda c en la cima, coincide con la entrada y se hace Match(c).", "C"),
    q("9", "¿Qué impide que la gramática S → aX | Yb ; Y → aZ | c (con X y Z definidos más abajo) sea LL(1)?", [
      "La recursividad a izquierda de S.",
      "Que las dos alternativas de S tienen un prefijo común oculto: PRIMERO(Yb) también contiene a.",
      "Que S tiene más de una alternativa.",
      "Nada: las dos alternativas de S empiezan con símbolos distintos (a e Y)."
    ], "B", "Hay que mirar PRIMERO y no solo el primer símbolo escrito: Y puede empezar con a, así que PREDICE(S → aX) y PREDICE(S → Yb) comparten a. Se resuelve reemplazando Y en S y factorizando. Que haya varias alternativas no impide LL(1) por sí solo.", "A"),
    q("10", "En la gramática S → aXb | Xc ; X → Xd | e, ¿cuál es SIGUIENTE(X)?", [
      "{b, c}", "{b, c, d}", "{b, c, d, $}", "{d, e}"
    ], "B", "En S → aXb a X le sigue b; en S → Xc le sigue c; en X → Xd le sigue d. X nunca queda al final de una producción de S, así que no hereda SIGUIENTE(S) y no lleva $.")
  ]),
  quiz(3, "Flex–Bison, semántica y código C", "Bison y semántica", "yylval, yytext y yyleng; campos de la %union; acciones, $$ y $n; semántica estática; const; warnings vs errores; ámbitos", [
    q("1", "¿Cómo se transfiere el valor semántico de un token (por ejemplo, el valor de una constante o el texto de un identificador) desde el analizador léxico (yylex) al sintáctico (yyparse)?", [
      "A través de los parámetros formales de la función yyerror().",
      "Mediante la variable global compartida yylval (cuyo tipo puede redefinirse con %union).",
      "Como valor de retorno de yylex().",
      "A través de la tabla de símbolos, en la columna del valor semántico."
    ], "B", "Cuando Flex reconoce un token, asigna su valor a la variable global yylval y retorna el entero que identifica el token. El valor de retorno de yylex() es el código del token, no su valor, y la tabla de símbolos no es el canal entre scanner y parser.", "D"),
    q("2", "En Flex está la regla  [0-9]+ { yylval = atoi(yytext); return NUM; }  y la entrada contiene el lexema 512. ¿Qué pasa al reconocerlo?", [
      "yylex() retorna 512 y yylval queda con el código de NUM.",
      "yylex() retorna NUM, yylval = 512, yytext = \"512\" e yyleng = 3.",
      "yylex() retorna NUM, yylval = \"512\" e yyleng = 512.",
      "yylex() no retorna nada: el parser lee yytext directamente."
    ], "B", "yylex() retorna el código del token (NUM) y deja el valor semántico en yylval: atoi convierte el texto \"512\" en el entero 512. yytext guarda el texto del lexema e yyleng su longitud, 3 caracteres.", "A"),
    q("3", "Un parser de Bison usa tokens con valores de tipo char* (ID), int (ENTERO), double (REAL) y char* (CADENA). ¿Cuántos campos necesita la %union de yylval?", [
      "1, porque yylval siempre es int.",
      "3, uno por cada tipo de valor semántico distinto.",
      "4, uno por cada token.",
      "Ninguno: los valores van en yytext."
    ], "B", "La %union tiene un campo por tipo de valor semántico, no por token: char*, int y double son 3 campos, y ID y CADENA comparten el de char*. Por defecto yylval es int, pero aquí hace falta la %union. Se usa un campo a la vez.", "C"),
    q("4", "En un archivo de especificación de Bison (.y), ¿en qué momento se ejecutan los bloques de código C (acciones semánticas) asociados a las reglas?", [
      "Cuando el scanner (yylex) lee el primer carácter del token.",
      "Al inicio del análisis, cuando yyparse() inicializa la pila.",
      "En el momento en que el parser reduce esa producción.",
      "Únicamente al terminar de leer todo el archivo fuente (EOF)."
    ], "C", "En los parsers generados por Bison, la acción de una regla se ejecuta cuando el lado derecho de la producción está en la pila y el parser reduce al no terminal. Ahí $$ recibe el valor del no terminal de la izquierda."),
    q("5", "Dada la regla de Bison  sentencia: IF '(' expresion ')' bloque ELSE bloque  ¿a qué símbolo corresponde $3 dentro de la acción semántica?", [
      "Al token IF.",
      "Al token paréntesis de apertura '('.",
      "Al no terminal expresion.",
      "Al primer no terminal bloque."
    ], "C", "Las pseudovariables $1, $2, $3… son los valores semánticos de los símbolos del lado derecho, contados de izquierda a derecha: $1 es IF, $2 es '(' y $3 es expresion. $$ es el no terminal de la izquierda (sentencia).", "A"),
    q("6", "¿Cuál de las siguientes validaciones corresponde a la Semántica Estática y NO puede verificarse solo con una Gramática Independiente del Contexto (BNF)?", [
      "Comprobar que una sentencia while termine con punto y coma.",
      "Verificar que la cantidad y el tipo de los argumentos de una invocación coincidan con la declaración de la función.",
      "Validar el balanceo de paréntesis en una expresión aritmética.",
      "Detectar un carácter que no inicia ningún lexema de C."
    ], "B", "Las GIC no pueden expresar restricciones dependientes del contexto, como la verificación de tipos o la cantidad de argumentos. Eso es Semántica Estática y lo validan las rutinas semánticas usando la Tabla de Símbolos, en paralelo con el análisis sintáctico.", "D"),
    q("7", "¿Cuál de los siguientes casos es un error de SEMÁNTICA ESTÁTICA en C, y no un error sintáctico ni léxico?", [
      "Escribir int a = 5 sin el punto y coma final.",
      "Desreferenciar una variable declarada como int (int x; *x = 10;).",
      "Escribir if (a > b { c = 1; } sin el paréntesis de cierre.",
      "Incluir un carácter @ fuera de una cadena literal."
    ], "B", "*x = 10; es derivable de la gramática de C, pero el operador * exige un puntero y x es un int: se viola una regla de tipos, que es Semántica Estática. El ; y el ) faltantes son errores sintácticos (falta un token) y el @ es un error léxico."),
    q("8", "Dentro de una función se escribe  const int max = 10;  y más abajo  max = max + 1;  ¿Cómo se clasifica el problema?", [
      "Error léxico: max no es un identificador válido.",
      "Error sintáctico: una constante no puede aparecer a la izquierda de =.",
      "Error semántico: max fue declarado const y no se puede modificar.",
      "Solo un warning: el compilador ignora el const."
    ], "C", "La sentencia es derivable de la gramática de C. Lo que se incumple es una restricción de contexto: max fue declarado const, así que no es un lvalue modificable. Detectarlo requiere consultar la tabla de símbolos, por lo que es un error semántico."),
    q("9", "¿Cuál de los siguientes problemas de un fragmento de C produce solo un warning y NO un error?", [
      "Usar una variable local que fue declarada pero nunca inicializada.",
      "Olvidar el punto y coma al final de una sentencia.",
      "Usar una variable que no tiene ninguna declaración visible.",
      "Olvidar el ) de cierre en la condición de un if."
    ], "A", "Usar una variable sin inicializar compila, con un warning. El ; o el ) faltantes son errores sintácticos (falta un token, no es un error léxico) y usar una variable sin declaración visible es un error semántico."),
    q("10", "Un programa en C tiene un bloque { int x = 20; } dentro de una función, y ya existe una variable global x. ¿Cómo administra esta situación la Tabla de Símbolos?", [
      "Sobrescribe el registro de la x global, borrando su tipo y su ubicación previa.",
      "Abre un nuevo nivel de ámbito e inserta la x local, que oculta a la global mientras se está dentro del bloque; al cerrar con } ese nivel se descarta y la x global vuelve a ser visible.",
      "Emite un error por redefinición del identificador.",
      "Usa siempre la primera declaración de x que aparece en el archivo."
    ], "B", "La Tabla de Símbolos organiza los identificadores por niveles de ámbito. Abrir un bloque crea un nivel nuevo donde los símbolos locales ocultan a los externos del mismo nombre: se usa la declaración visible más cercana. Al cerrarlo, ese nivel se descarta y la x global vuelve a ser visible.")
  ])
  ];
