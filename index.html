<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSL · Segundo Parcial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5;
  --sheet:#FBFCFD;
  --grid:rgba(20,33,61,.055);
  --ink:#14213D;
  --ink-2:#4A5872;
  --ink-3:#8492A8;
  --rule:#D5DCE6;
  --pen:#2D5BE3;
  --pen-soft:rgba(45,91,227,.09);
  --ok:#1E8A5A;
  --ok-soft:rgba(30,138,90,.10);
  --bad:#C2412D;
  --bad-soft:rgba(194,65,45,.09);
  --code-bg:#F2F5F9;
  --fig-filter:none;
  --fig-bg:#fff;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A22; --sheet:#1A212B; --grid:rgba(214,226,240,.045);
    --ink:#E4EAF2; --ink-2:#A9B5C6; --ink-3:#6F7D91; --rule:#2B3542;
    --pen:#7EA2FF; --pen-soft:rgba(126,162,255,.12);
    --ok:#4CC38A; --ok-soft:rgba(76,195,138,.12);
    --bad:#F07A63; --bad-soft:rgba(240,122,99,.12);
    --code-bg:#121820; --fig-filter:invert(.9) hue-rotate(180deg); --fig-bg:#1A212B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A22; --sheet:#1A212B; --grid:rgba(214,226,240,.045);
  --ink:#E4EAF2; --ink-2:#A9B5C6; --ink-3:#6F7D91; --rule:#2B3542;
  --pen:#7EA2FF; --pen-soft:rgba(126,162,255,.12);
  --ok:#4CC38A; --ok-soft:rgba(76,195,138,.12);
  --bad:#F07A63; --bad-soft:rgba(240,122,99,.12);
  --code-bg:#121820; --fig-filter:invert(.9) hue-rotate(180deg); --fig-bg:#1A212B;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
}
button{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:4px;}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 80px;}
code,.mono{font-family:var(--mono);font-size:.92em;}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;}
.crumb{font-family:var(--mono);font-size:.82rem;color:var(--ink-3);}
.crumb b{color:var(--ink);font-weight:500;}
.crumb button{background:none;border:0;padding:0;cursor:pointer;color:var(--pen);font-family:var(--mono);font-size:.82rem;}
.crumb button:hover{text-decoration:underline;}
.theme-btn{background:var(--sheet);border:1px solid var(--rule);border-radius:999px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2);}
.theme-btn svg{width:16px;height:16px;}

/* ---------- home ---------- */
.home-head h1{font-family:var(--cond);font-weight:700;font-size:clamp(2.1rem,6vw,3.1rem);line-height:1.02;letter-spacing:-.01em;margin:0 0 12px;}
.home-head p{margin:0 0 34px;color:var(--ink-2);max-width:60ch;}
/* secciones siguientes del inicio: separadas de la lista anterior y un nivel por debajo del título */
.home-head.sec{margin-top:56px;padding-top:30px;border-top:1px solid var(--rule);}
.home-head.sec h2{font-family:var(--cond);font-weight:700;font-size:clamp(1.55rem,4.2vw,2.05rem);line-height:1.1;letter-spacing:-.005em;margin:0 0 8px;}
.home-head.sec p{margin-bottom:22px;}
.model-list{display:grid;gap:12px;}
.model-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:center;text-align:left;
  background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;cursor:pointer;width:100%;
  transition:border-color .15s;
}
.model-row:hover{border-color:var(--pen);}
.model-row h2{margin:0;font-family:var(--cond);font-weight:600;font-size:1.3rem;}
.model-row .topics{grid-column:1/2;color:var(--ink-2);font-size:.9rem;}
.model-row .score{grid-row:1/3;grid-column:2;text-align:right;min-width:104px;}
.model-row .score .n{font-family:var(--cond);font-weight:700;font-size:1.7rem;line-height:1;}
.model-row .score .l{font-size:.78rem;color:var(--ink-3);}
.minigrid{grid-column:1/-1;display:flex;gap:3px;margin-top:8px;flex-wrap:wrap;}
.minigrid .g{display:flex;gap:3px;margin-right:8px;}
.minigrid i{width:12px;height:12px;border-radius:2px;background:var(--rule);display:block;}
.minigrid i.ok{background:var(--ok);} .minigrid i.bad{background:var(--bad);}
.home-foot{margin-top:28px;color:var(--ink-3);font-size:.85rem;max-width:62ch;}

/* ---------- exam grid (navigator) ---------- */
.exam-grid{
  background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;
  display:grid;margin-bottom:22px;
}
.eg-col{border-right:1px solid var(--ink);display:flex;flex-direction:column;min-width:0;}
.eg-col:last-child{border-right:0;}
.eg-head{
  all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  padding:7px 10px;border-bottom:1px solid var(--ink);font-family:var(--cond);font-weight:600;font-size:.95rem;
}
.eg-head:hover{background:var(--pen-soft);}
.eg-head:focus-visible{outline:2px solid var(--pen);outline-offset:-3px;}
.eg-head .pts{font-weight:500;color:var(--ink-3);font-size:.82rem;white-space:nowrap;}
.eg-head > span:first-child{white-space:nowrap;}
.eg-col.active .eg-head{background:var(--pen-soft);color:var(--pen);}
.eg-cells{display:grid;flex:1;}
.eg-cell{
  all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-height:52px;border-right:1px solid var(--rule);font-family:var(--cond);cursor:pointer;position:relative;
}
.eg-cell:last-child{border-right:0;}
.eg-cell .id{font-size:.68rem;color:var(--ink-3);font-weight:500;}
.eg-cell .lt{font-size:1.15rem;font-weight:700;line-height:1;min-height:1.1rem;}
.eg-cell.ok .lt{color:var(--ok);} .eg-cell.bad .lt{color:var(--bad);}
.eg-cell.ok{background:var(--ok-soft);} .eg-cell.bad{background:var(--bad-soft);}
.eg-cell.locked{cursor:not-allowed;}
.eg-cell.locked .id{opacity:.45;}
.eg-cell.current{box-shadow:inset 0 0 0 2px var(--pen);}
.eg-cell:focus-visible{outline:2px solid var(--pen);outline-offset:-4px;}
.eg-nota{display:flex;flex-direction:column;}
.eg-nota .eg-head{cursor:default;}
.eg-nota .eg-head:hover{background:none;}
.eg-nota .val{flex:1;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:1.35rem;min-height:52px;padding:0 10px;}
.eg-nota .val small{font-size:.75rem;color:var(--ink-3);font-weight:500;}

/* ---------- question ---------- */
.ex-title{font-family:var(--cond);font-weight:600;font-size:1.05rem;color:var(--ink-2);margin:0 0 12px;}
.ex-title b{color:var(--ink);}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;}
.ctx{margin:0 0 18px;}
.ctx p{margin:0 0 8px;color:var(--ink-2);font-size:.93rem;}
pre.code{
  margin:0;background:var(--code-bg);border:1px solid var(--rule);border-left:3px solid var(--ink-3);border-radius:6px;
  padding:12px 14px;font-family:var(--mono);font-size:.86rem;line-height:1.55;overflow-x:auto;white-space:pre;color:var(--ink);
}
.qhead{display:flex;gap:12px;align-items:baseline;margin-bottom:16px;}
.qnum{font-family:var(--cond);font-weight:700;font-size:1.5rem;color:var(--pen);line-height:1;flex:none;}
.qtext{font-size:1.06rem;font-weight:500;line-height:1.5;}
.stmt{margin:-4px 0 18px;}
.opts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;border:1px solid var(--ink);border-radius:6px;overflow:hidden;}
.opt{
  all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;
  border-bottom:1px solid var(--rule);font-size:.94rem;line-height:1.45;
}
.opt:nth-child(3),.opt:nth-child(6){border-bottom:0;}
.opt:nth-child(-n+3){border-right:1px solid var(--rule);}
.opt .k{font-family:var(--cond);font-weight:700;flex:none;width:1.3em;color:var(--ink-2);}
.opt:hover:not([aria-disabled="true"]){background:var(--pen-soft);}
.opt:focus-visible{outline:2px solid var(--pen);outline-offset:-3px;}
.opt[aria-disabled="true"]{cursor:default;}
.opt.is-ok{background:var(--ok-soft);} .opt.is-ok .k{color:var(--ok);}
.opt.is-bad{background:var(--bad-soft);} .opt.is-bad .k{color:var(--bad);}
.opt.is-bad span:last-child{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1.5px;}
.opt .mark{margin-left:auto;font-weight:700;flex:none;}
.opt .prods{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:.9rem;}
.opt.is-ok .mark{color:var(--ok);} .opt.is-bad .mark{color:var(--bad);}

/* correction */
.correction{margin-top:20px;border-left:3px solid var(--ok);padding:2px 0 2px 16px;}
.correction.wrong{border-color:var(--bad);}
.verdict{font-family:var(--cond);font-weight:700;font-size:1.05rem;margin:0 0 6px;}
.correction.right .verdict{color:var(--ok);} .correction.wrong .verdict{color:var(--bad);}
.correction p{margin:0 0 10px;color:var(--ink);font-size:.95rem;}
.blk{margin:12px 0;}
.blk .bt{font-size:.85rem;color:var(--ink-2);margin-bottom:4px;font-weight:500;}
figure.fig{margin:12px 0;background:var(--fig-bg);border:1px solid var(--rule);border-radius:6px;padding:10px;text-align:center;}
figure.fig img{max-width:100%;height:auto;max-height:340px;filter:var(--fig-filter);}
.ref{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--pen-soft);font-size:.88rem;color:var(--ink-2);}
.ref b{color:var(--pen);font-weight:600;}

.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap;}
.hint{font-size:.85rem;color:var(--ink-3);}
.btn{
  border:0;border-radius:8px;padding:11px 18px;font-weight:600;font-size:.93rem;cursor:pointer;background:var(--ink);color:var(--sheet);
}
.btn:hover{background:var(--pen);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);}
.btn.ghost:hover{border-color:var(--pen);color:var(--pen);background:transparent;}

/* results */
.res-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.res-head h2{font-family:var(--cond);font-weight:700;font-size:2rem;margin:0;line-height:1.05;}
.res-head p{margin:4px 0 0;color:var(--ink-2);}
.big-nota{font-family:var(--cond);font-weight:700;font-size:4rem;line-height:.9;}
.big-nota small{font-size:1.2rem;color:var(--ink-3);font-weight:500;}
.big-nota.pass{color:var(--ok);} .big-nota.fail{color:var(--bad);}
.sub-scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 26px;}
.sub{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;}
.sub .t{font-size:.8rem;color:var(--ink-3);}
.sub .v{font-family:var(--cond);font-weight:700;font-size:1.25rem;}
.rev-title{font-family:var(--cond);font-weight:600;font-size:1.2rem;margin:26px 0 10px;}
.rev-list{display:grid;gap:8px;}
.rev{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:11px 14px;cursor:pointer;font-size:.92rem;}
.rev:hover{border-color:var(--pen);}
.rev:focus-visible{outline:2px solid var(--pen);outline-offset:2px;}
.rev .rid{font-family:var(--cond);font-weight:700;}
.rev .rl{font-family:var(--cond);font-weight:600;white-space:nowrap;}
.rev .rl .y{color:var(--bad);} .rev .rl .c{color:var(--ok);}
.empty{color:var(--ink-2);}

/* ---------- tabs ---------- */
.tabs{display:inline-flex;gap:2px;padding:3px;background:var(--sheet);border:1px solid var(--rule);border-radius:9px;margin-bottom:26px;}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink-2);}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet);}
.tabs button:not([aria-selected="true"]):hover{color:var(--pen);}
@media (max-width:560px){
  .tabs{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none;}
  .tabs button{flex:none;white-space:nowrap;padding:7px 12px;}
}
.wrap.wide{max-width:1120px;}

/* ---------- repaso ---------- */
.rcontent{min-width:0;}
.repaso{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start;}
.rnav{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;}
.rnav-prog{font-size:.8rem;color:var(--ink-3);margin-bottom:10px;}
.rnav-prog i{display:block;height:4px;border-radius:2px;background:var(--rule);margin-top:6px;position:relative;overflow:hidden;}
.rnav-prog i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--ok);}
.rnav-mod{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:7px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.9rem;}
.rnav-mod:hover{background:var(--pen-soft);}
.rnav-mod .rn{font-family:var(--cond);font-weight:700;color:var(--pen);}
.rnav-mod .rc{font-family:var(--cond);font-size:.8rem;color:var(--ink-3);}
.rnav-mod .rc.all{color:var(--ok);font-weight:600;}
.rmod{margin-bottom:38px;scroll-margin-top:16px;}
.rmod-head{margin-bottom:14px;}
.rmod-n{font-family:var(--cond);font-weight:600;color:var(--pen);font-size:.9rem;}
.rmod-head h2{font-family:var(--cond);font-weight:700;font-size:1.6rem;margin:0;line-height:1.15;}
.rmod-head p{margin:2px 0 0;color:var(--ink-2);font-size:.92rem;}
.concept{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--rule);border-radius:10px;padding:18px 22px;margin-bottom:12px;scroll-margin-top:16px;}
.concept.seen{border-left-color:var(--ok);}
.concept.flash{box-shadow:0 0 0 2px var(--pen);}
.c-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.c-top h3{margin:0;font-family:var(--cond);font-weight:600;font-size:1.22rem;}
.freq{font-size:.78rem;color:var(--ink-3);white-space:nowrap;}
.freq.f4{color:var(--bad);font-weight:600;}
.freq.f3,.freq.f2{color:var(--pen);font-weight:500;}
.c-what{margin:0 0 10px;color:var(--ink-2);}
.c-list{margin:0 0 12px;padding-left:1.1em;}
.c-list li{margin:4px 0;font-size:.95rem;}
.c-list li::marker{color:var(--ink-3);}
.c-list.errs li::marker{content:"✗  ";color:var(--bad);}
.concept pre.code{margin:0 0 12px;font-size:.82rem;}
.c-exam{border-left:3px solid var(--pen);background:var(--pen-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-size:.92rem;}
.c-exam b{color:var(--pen);}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
.c-practice{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.c-practice .pl{font-size:.8rem;color:var(--ink-3);margin-right:2px;}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:3px 10px;font-family:var(--cond);font-weight:600;font-size:.8rem;cursor:pointer;color:var(--ink-2);}
.chip:hover{border-color:var(--pen);color:var(--pen);}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);}
.seen-btn{border:1px solid var(--rule);background:transparent;border-radius:7px;padding:5px 11px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink-2);}
.seen-btn:hover{border-color:var(--ok);color:var(--ok);}
.seen-btn[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);}
.auto details{border-top:1px solid var(--rule);}
.auto details:first-child{border-top:0;}
.auto summary{cursor:pointer;padding:10px 0;font-weight:500;list-style:none;display:flex;gap:10px;}
.auto summary::-webkit-details-marker{display:none;}
.auto summary .an{font-family:var(--cond);font-weight:700;color:var(--pen);min-width:1.4em;}
.auto details[open] summary{color:var(--pen);}
.auto details p{margin:0 0 12px 2.1em;color:var(--ink-2);font-size:.93rem;}
.rank{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;}
.rank li+li{border-top:1px solid var(--rule);}
.rank-row{display:grid;grid-template-columns:28px minmax(0,1fr) 44px 120px 34px;gap:12px;align-items:center;width:100%;padding:9px 16px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:.93rem;}
.rank-row:hover{background:var(--pen-soft);}
.rank-row:focus-visible{outline:2px solid var(--pen);outline-offset:-3px;}
.rank-row .rk{font-family:var(--cond);font-weight:700;color:var(--ink-3);}
.rank-row.seen .rt{color:var(--ok);}
.rank-row .rex{font-family:var(--cond);font-size:.8rem;color:var(--ink-3);}
.rank-row .rv{font-family:var(--cond);font-weight:600;text-align:right;}
.rbar{display:block;height:6px;border-radius:3px;background:var(--rule);overflow:hidden;}
.rbar i{display:block;height:100%;background:var(--ink-3);}
.rbar.f4 i{background:var(--bad);} .rbar.f3 i{background:var(--pen);}
@media (max-width:560px){
  .rank-row{grid-template-columns:22px minmax(0,1fr) 34px;row-gap:6px;padding:10px 12px;}
  .rank-row .rex{display:none;}
  .rank-row .rbar{grid-column:2;grid-row:2;}
  .rank-row .rv{grid-column:3;grid-row:1;}
}
.back-rep{background:none;border:0;padding:0;cursor:pointer;color:var(--pen);font-family:var(--mono);font-size:.82rem;}
.back-rep:hover{text-decoration:underline;}
@media (max-width:900px){
  .repaso{grid-template-columns:minmax(0,1fr);gap:18px;}
  .repaso > *{min-width:0;}
  .rnav{position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;gap:6px;padding:8px 0;background:var(--paper);margin:0 -16px;padding-left:16px;padding-right:16px;}
  .rnav-prog{display:none;}
  .rnav-mod{grid-template-columns:auto auto auto;white-space:nowrap;border:1px solid var(--rule);background:var(--sheet);}
  .concept{padding:16px;scroll-margin-top:68px;}
  .rmod{scroll-margin-top:68px;}
}

/* ---------- TP integrador ---------- */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sum-grid .concept{margin:0;}
.dg-wrap{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px 12px;margin-bottom:14px;}
.dg-scroll{overflow-x:auto;}
.depgraph{width:100%;min-width:620px;height:auto;display:block;max-height:260px;}
.dg-edge{fill:none;stroke:var(--ink-3);stroke-width:1.4;}
.dg-arrow{fill:var(--ink-3);}
.dg-node{cursor:pointer;}
.dg-node rect{fill:var(--paper);stroke:var(--ink);stroke-width:1.3;}
.dg-node.wip rect{fill:var(--pen-soft);stroke:var(--pen);}
.dg-node.done rect{fill:var(--ok-soft);stroke:var(--ok);}
.dg-node:hover rect,.dg-node:focus-visible rect{stroke-width:2.4;}
.dg-node:focus{outline:none;}
.dg-n{font-family:var(--cond);font-weight:700;font-size:15px;fill:var(--ink);}
.dg-p{font-weight:500;font-size:12px;fill:var(--ink-3);}
.dg-t{font-family:var(--sans);font-size:11.5px;fill:var(--ink-2);}
.dg-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--ink-3);margin-top:8px;}
.dg-legend .lg{display:inline-block;width:10px;height:10px;border-radius:2px;border:1.3px solid var(--ink);margin-right:5px;vertical-align:-1px;}
.dg-legend .lg.wip{border-color:var(--pen);background:var(--pen-soft);}
.dg-legend .lg.done{border-color:var(--ok);background:var(--ok-soft);}
.dg-total{margin-left:auto;font-weight:600;color:var(--ink-2);}
.st-n{font-family:var(--cond);font-weight:700;color:var(--pen);margin-right:4px;}
.st-bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin:4px 0 12px;}
.st-bar i{display:block;height:100%;background:var(--ok);}
.owner{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-3);margin-bottom:10px;}
.owner input{font:inherit;font-size:.88rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:4px 8px;width:180px;}
.owner input:focus{outline:2px solid var(--pen);outline-offset:1px;}
.tasks{list-style:none;margin:0 0 14px;padding:0;}
.tasks > li{border-top:1px solid var(--rule);}
.tasks > li:first-child{border-top:0;}
.tasks label{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;cursor:pointer;font-size:.93rem;}
.tasks input{width:16px;height:16px;margin-top:3px;accent-color:var(--ok);}
.tasks input:checked + span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3);}
.tasks ul{margin:4px 0 0;padding-left:1.1em;font-size:.9rem;}
.tasks li.num{list-style:none;margin-left:-1.1em;}
.st-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px;}
.bt{font-size:.8rem;color:var(--ink-3);margin-bottom:5px;font-weight:500;}
.files{display:flex;flex-direction:column;gap:3px;font-size:.86rem;}
.files .fnote{font-size:.78rem;color:var(--ink-3);margin:-2px 0 4px;}
.msgs{margin:0;padding-left:1em;font-size:.8rem;}
.msgs li{margin:2px 0;}
.handoff{font-size:.9rem;background:var(--ok-soft);border-radius:6px;padding:9px 12px;}
.handoff b{color:var(--ok);}
.handoff ul{margin:4px 0 0;padding-left:1.1em;}
.prompt{margin-top:12px;border:1px solid var(--rule);border-radius:7px;padding:0 12px;}
.prompt summary{cursor:pointer;padding:9px 0;font-weight:600;font-size:.9rem;color:var(--ink-2);}
.prompt[open] summary{color:var(--pen);}
.prompt pre.code{white-space:pre-wrap;max-height:340px;overflow:auto;margin-bottom:12px;font-size:.78rem;}
.prompt-actions{display:flex;justify-content:flex-end;margin-bottom:8px;}
.prompt-actions .btn{padding:6px 12px;font-size:.82rem;}
.err-list{display:grid;gap:12px;}
.err pre.code{white-space:pre-wrap;font-size:.8rem;margin:0 0 6px;}
.err-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:.84rem;color:var(--ink-2);}
.err-st{font-family:var(--cond);font-weight:700;color:var(--pen);border:1px solid var(--pen);border-radius:4px;padding:0 5px;font-size:.78rem;}
.err-ex{color:var(--ink-3);margin-left:auto;}
.lc{border:0;background:var(--pen-soft);color:var(--pen);font-family:var(--mono);font-size:.92em;padding:0 4px;border-radius:3px;cursor:pointer;}
.lc:hover{background:var(--pen);color:var(--sheet);}
.ex-code{background:var(--code-bg);border:1px solid var(--rule);border-radius:8px;max-height:380px;overflow:auto;font-family:var(--mono);font-size:.8rem;line-height:1.6;padding:6px 0;position:relative;}
.cl{display:grid;grid-template-columns:3.2em 1fr;white-space:pre;}
.cl .ln{color:var(--ink-3);text-align:right;padding-right:12px;user-select:none;}
.cl.hl{background:var(--pen-soft);}
.cl.hl .ln{color:var(--pen);font-weight:600;}
.cl mark{background:var(--bad-soft);color:var(--bad);border-bottom:2px solid var(--bad);font-weight:600;}
.ex-hint{font-size:.85rem;color:var(--ink-3);margin:8px 0 10px;min-height:1.4em;}
.ex-out{white-space:pre-wrap;font-size:.8rem;line-height:1.6;}
.concept-link{border:0;background:none;color:var(--pen);font-weight:600;cursor:pointer;padding:0;font-size:.88rem;}
.concept-link:hover{text-decoration:underline;}
@media (max-width:900px){
  .sum-grid,.st-meta{grid-template-columns:1fr;}
  .err-ex{margin-left:0;}
  .dg-total{margin-left:0;}
}

.hidden{display:none !important;}

@media (max-width:720px){
  .exam-grid{grid-template-columns:1fr 1fr !important;}
  .eg-col{border-bottom:1px solid var(--ink);}
  .eg-col:nth-child(2n){border-right:0;}
  .eg-nota{grid-column:1/-1;border-bottom:0;flex-direction:row;}
  .eg-nota .eg-head{border-bottom:0;border-right:1px solid var(--ink);}
  .eg-nota .val{min-height:40px;}
  .eg-cell{min-height:46px;}
  .opts{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row;}
  .opt:nth-child(-n+3){border-right:0;}
  .opt:nth-child(3){border-bottom:1px solid var(--rule);}
  .sheet{padding:18px 16px;}
  .sub-scores{grid-template-columns:1fr 1fr;}
  /* en celular la nota queda a la derecha del título y los temas usan todo el ancho */
  .model-row{padding:16px;gap:6px 14px;align-items:start;}
  .model-row .score{grid-row:1;min-width:0;}
  .model-row .score .n{font-size:1.4rem;}
  .model-row .topics{grid-column:1/-1;}
  .home-head.sec{margin-top:40px;padding-top:24px;}
}
@media (prefers-reduced-motion:no-preference){
  .sheet.enter{animation:enter .22s ease-out;}
  @keyframes enter{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
}
</style>
</head>

<script>
const DATA = [{"title": "Modelo 1", "slug": "modelo-1", "topics": "yylval y validaciones semánticas; G: S → baY | acX | a; fragmento sumador(); ER ((ab)*)*", "exercises": [{"n": 1, "title": "Scanner, parser y rutinas semánticas", "short": "Scanner y parser", "pts": "0.5 puntos cada ítem", "items": [{"id": "1.1", "text": "El analizador sintáctico invoca a yylex() para obtener el siguiente token. ¿Cómo accede luego a su valor semántico?", "stmt": [], "ctx": null, "opts": ["Consultando la columna yylval de la tabla de símbolos.", "Leyendo la variable compartida yylval, que el scanner cargó antes de retornar el token.", "Volviendo a invocar yylex() con el mismo lexema.", "Leyendo el valor de retorno de yylex(), que es el valor semántico.", "Solo A y B son correctas.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["La primera parte del planteo es cierta: el parser pide cada token invocando yylex(). Pero yylval no es una columna de una tabla: es una variable compartida entre el scanner y el parser. El scanner guarda allí el valor semántico y luego retorna el código del token. Además, la tabla de símbolos es una forma conceptual de llamar al espacio donde se guarda la información semántica; no es una tabla con columnas. yylex() retorna el código del token, no su valor."], "blocks": [], "imgs": [], "ref": "Cada token se identifica con un número entero y su valor semántico se guarda en la variable global compartida yylval, que luego se usa en las acciones de las producciones."}, {"id": "1.2", "text": "Durante la fase de análisis de un programa fuente, ¿con qué se realizan las validaciones semánticas?", "stmt": [], "ctx": null, "opts": ["Con una gramática sensible al contexto que reemplaza a la GIC.", "Con el scanner, mediante expresiones regulares.", "Con rutinas semánticas que complementan la GIC y usan la tabla de símbolos.", "Con una gramática regular adicional.", "Se postergan hasta el tiempo de ejecución.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Las validaciones semánticas se implementan con rutinas semánticas asociadas a la GIC, que consultan y actualizan la tabla de símbolos. Construir una gramática sensible al contexto que contemple todas las validaciones semánticas no es factible en la práctica de los lenguajes de programación."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "1.3", "text": "¿Cuál es el mecanismo principal de comunicación entre el analizador léxico y el sintáctico?", "stmt": [], "ctx": null, "opts": ["La tabla de símbolos, donde el scanner deja cada token.", "Un archivo intermedio con todos los tokens, generado antes del parsing.", "Las rutinas semánticas.", "La invocación de yylex(), que retorna el código del token, y la variable compartida yylval.", "Solo A y C son correctas.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["La comunicación se efectúa invocando la función yylex(), que retorna un entero que identifica al token, y mediante la variable compartida yylval, donde queda almacenado el valor semántico del token retornado, si corresponde. La tabla de símbolos no es el canal de comunicación entre ambos analizadores."], "blocks": [], "imgs": [], "ref": "Desde main() se invoca yyparse(), que durante el análisis invoca varias veces a yylex() para pedir los tokens que va reconociendo. El token es un entero y su valor queda en yylval."}, {"id": "1.4", "text": "Respecto del momento en que se realizan las validaciones semánticas, ¿qué afirmación es correcta?", "stmt": [], "ctx": null, "opts": ["Deben realizarse obligatoriamente al finalizar el análisis léxico y sintáctico de todo el archivo.", "Se realizan antes de comenzar el análisis léxico.", "Solo se realizan en tiempo de ejecución.", "Las realiza el scanner al reconocer cada identificador.", "Pueden realizarse en paralelo con el análisis sintáctico, al reconocer cada estructura.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["No necesariamente se hacen al final: las validaciones semánticas se realizan en paralelo con el análisis léxico y sintáctico. Por ejemplo, cuando el parser reconoce una declaración, se ejecutan rutinas semánticas que verifican que sea válida (por ejemplo, que no haya doble declaración)."], "blocks": [], "imgs": [], "ref": "El análisis semántico está inmerso dentro del análisis sintáctico: el Parser llama a las rutinas semánticas a medida que reconoce las construcciones."}, {"id": "1.5", "text": "¿Requiere el scanner un carácter de corte (centinela) para detectar el fin de un literal cadena como \"hola\"?", "stmt": [], "ctx": null, "opts": ["Sí: debe leer el carácter siguiente a la comilla de cierre para confirmar el lexema.", "No: la comilla doble de cierre, no precedida por un carácter de escape, delimita el lexema.", "Sí: necesita un espacio en blanco después de la cadena.", "No, porque los literales cadena no son reconocidos por el scanner.", "Sí, salvo que la cadena esté vacía.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Los literales cadena no requieren carácter de corte. Cuando se lee la comilla doble de cierre (sin un carácter de escape previo), el lexema queda reconocido como literal cadena sin necesidad de leer un carácter más."], "blocks": [], "imgs": [], "ref": "Cada lexema es la mayor secuencia posible de caracteres para su token, por lo que a veces se lee un primer carácter que no pertenece al lexema (centinela). Ese carácter extra se devuelve al flujo con ungetc."}]}, {"n": 2, "title": "Gramáticas y análisis sintáctico", "short": "Gramáticas LL(1)", "pts": "0.5 puntos por item", "items": [{"id": "2.1", "text": "¿Qué problemas impiden que G sea LL(1)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → baY | acX | a","X → Xa | Xb | a","Y → b | ε"], "img": null}, "opts": ["Solo la recursividad a izquierda de X.", "Solo el prefijo común a en las alternativas acX y a de S.", "La producción ε de Y.", "El prefijo común a en acX | a y la recursividad a izquierda de X.", "Ninguno: G ya es LL(1).", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Las alternativas acX y a de S comienzan con el mismo terminal a: con preanálisis a no se puede elegir la producción, por lo que hace falta factorizar. Además, X → Xa | Xb es recursiva a izquierda, lo que un análisis descendente no puede manejar. La producción ε de Y no genera conflicto: Y → b se elige con b e Y → ε con SIGUIENTE(Y) = {$}."], "blocks": [], "imgs": [], "ref": "Limitaciones de LL(1): no pueden ser recursivas a izquierda y no pueden tener un noterminal con dos o más producciones cuyos lados derechos comiencen con el mismo terminal."}, {"id": "2.2", "text": "¿Cuál es el resultado de factorizar a izquierda las producciones de S?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → baY | acX | a","X → Xa | Xb | a","Y → b | ε"], "img": null}, "opts": ["S → aT; T → aY | cX | ε.", "S → baY | aT; T → cX | ε.", "S → baY | aT; T → cX.", "S → bT | aT; T → aY | cX | ε.", "S → baY | acT; T → X | ε.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["El prefijo común de acX y a es a; se extrae y el resto queda en un nuevo no terminal: S → baY | aT; T → cX | ε. La alternativa baY comienza con b y no se modifica. C pierde la cadena a; A y D cambian el lenguaje; E genera ac, que no pertenece a L(G)."], "blocks": [{"title": "1°) Factorización en S", "code": ["S → baY | aT", "T → cX | ε", "X → Xa | Xb | a", "Y → b | ε"]}], "imgs": [], "ref": "Factorización a izquierda: A → αβ1 | … | αβn pasa a A → αB y B → β1 | … | βn. El prefijo común queda aislado en una sola producción."}, {"id": "2.3", "text": "¿Qué reemplazo elimina la recursividad a izquierda de X → Xa | Xb | a conservando el lenguaje?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → baY | acX | a","X → Xa | Xb | a","Y → b | ε"], "img": null}, "opts": ["X → aX | bX | a.", "X → Xa | Xb | a; Z → ε.", "X → aZ; Z → aZ | bZ | ε.", "X → aZ; Z → aZ | bZ.", "X → aZ | ε; Z → aZ | bZ | ε.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["L(X) = a(a + b)*: una a seguida de cualquier secuencia de a y b. Se reescribe como X → aZ y la cola recursiva a derecha Z → aZ | bZ | ε. A genera (a + b)*a (otro lenguaje); B mantiene la recursividad; D no tiene derivación terminal para Z; E agrega ε a L(X)."], "blocks": [{"title": "2°) Eliminación de recursividad a izquierda en X", "code": ["S → baY | aT", "T → cX | ε", "X → aZ", "Z → aZ | bZ | ε", "Y → b | ε"]}], "imgs": [], "ref": "Eliminación de la recursividad a izquierda: X → Xα | β se transforma en X → βZ y Z → αZ | ε. Toda secuencia comienza con β seguida de cero o más α."}, {"id": "2.4", "text": "En G, ¿cuál es SIGUIENTE(X)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → baY | acX | a","X → Xa | Xb | a","Y → b | ε"], "img": null}, "opts": ["{a, b}.", "{a, b, $}.", "{$}.", "{a, b, c, $}.", "{a, b, ε}.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["En X → Xa y X → Xb, después de X aparecen a y b. En S → acX, X está al final, por lo que SIGUIENTE(S) = {$} se incorpora a SIGUIENTE(X). Resultado: {a, b, $}. ε nunca integra un conjunto SIGUIENTE."], "blocks": [], "imgs": [], "ref": "SIGUIENTE(A): si A va seguido de un terminal x, x ∈ SIGUIENTE(A); si va seguido de un noterminal B, PRIMERO(B) ⊆ SIGUIENTE(A); si A es el último símbolo de T → …A, SIGUIENTE(T) ⊆ SIGUIENTE(A). El axioma lleva fdt ($)."}, {"id": "2.5", "text": "Aplicadas las transformaciones de 2.2 y 2.3, ¿es posible implementar un parser predictivo para la gramática obtenida?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → baY | acX | a","X → Xa | Xb | a","Y → b | ε"], "img": null}, "opts": ["No, porque la gramática conserva producciones ε.", "No, porque sigue habiendo dos alternativas de S que comienzan con a.", "Sí, pero solo con retroceso (backtracking).", "No: los parsers predictivos solo admiten gramáticas regulares.", "Sí: es LL(1); el próximo token determina inequívocamente la producción a aplicar.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["3°) Verificación: para cada no terminal, los conjuntos PREDICE de sus producciones son disjuntos. S: baY con b, aT con a. T: cX con c, ε con SIGUIENTE(T) = {$}. Z: aZ con a, bZ con b, ε con SIGUIENTE(Z) = {$}. Y: b con b, ε con {$}. Al ser LL(1), con conocer el próximo token se determina qué producción aplicar, sin retroceso. Las producciones ε no impiden el análisis predictivo."], "blocks": [{"title": "Gramática LL(1) final:", "code": ["S → baY | aT", "T → cX | ε", "X → aZ", "Z → aZ | bZ | ε", "Y → b | ε"]}], "imgs": [], "ref": "PREDICE(A → X1…Xm) = PRIMERO(X1…Xm) si ε no está en él; si está, (PRIMERO − {ε}) ∪ SIGUIENTE(A). Si los PREDICE de cada noterminal no se superponen, la gramática es LL(1)."}]}, {"n": 3, "title": "Código C: léxico, sintaxis, semántica y declaraciones", "short": "Código C", "pts": "0.75 puntos por item", "items": [{"id": "3.1", "text": "¿Cuál es el diagnóstico léxico correcto del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int sumador(){", "2      int i,j = 0;", "3      while(j<=10){", "4          int x = i;", "5          j++;}", "6      i +=x ;", "7      return i;;"], "img": null}, "opts": ["sumador es una palabra reservada mal escrita.", "0 no es un lexema válido porque una constante no puede comenzar con 0.", ";; forma un único token inválido.", "+= debe separarse necesariamente en los tokens + y =.", "No hay errores léxicos: todos los lexemas son válidos y += y ++ son tokens únicos.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Toda palabra pertenece a alguna categoría léxica. Identificadores: sumador, i, j, x. Palabras reservadas: int, while, return. Caracteres de puntuación/operadores: ( ) { } ++ = += ; <= ,. Constante entera octal: 0. Constante entera decimal: 10. Cada ; es un token independiente."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.2", "text": "¿Qué cambio corrige el error sintáctico del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int sumador(){", "2      int i,j = 0;", "3      while(j<=10){", "4          int x = i;", "5          j++;}", "6      i +=x ;", "7      return i;;"], "img": null}, "opts": ["Agregar ; después de la llave de cierre del while en la línea 5.", "Eliminar el segundo ; de la línea 7.", "Agregar } después de la línea 7 para cerrar la definición de sumador.", "Reemplazar += por = en la línea 6.", "Agregar paréntesis a la declaración de la línea 2.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["La llave abierta en la línea 1 nunca se cierra: la } de la línea 5 cierra el bloque del while. Falta la llave de cierre de la definición de la función. Los ;; consecutivos son válidos: el último ; es una sentencia de expresión vacía."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.3", "text": "Corregido el error sintáctico, ¿qué restricción semántica se incumple?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int sumador(){", "2      int i,j = 0;", "3      while(j<=10){", "4          int x = i;", "5          j++;}", "6      i +=x ;", "7      return i;;"], "img": null}, "opts": ["i se usa en la línea 4 sin estar inicializada, y eso es un error semántico.", "x se usa en la línea 6 fuera del bloque del while, donde fue declarada.", "Una función int no puede retornar una variable int.", "j no puede compararse con una constante entera.", "El ; extra de la línea 7 es un error semántico.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["x se declara dentro del bloque del while; su ámbito termina en la } de la línea 5. En la línea 6, i += x usa x sin una declaración visible: error semántico. Que i no esté inicializada puede indicarse como warning, pero no es un error semántico."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "3.4", "text": "Dentro de una función se escribe la sentencia siguiente. ¿Qué declaraciones la hacen semánticamente válida? La inicialización es opcional; suponga punteros válidos.", "stmt": ["M.acumulador = R.contador[3] + *S ;"], "ctx": null, "opts": ["typedef struct { int acumulador; int contador[4]; } est; est M, R; int *S;", "typedef struct { int acumulador; int contador[4]; } est; est *M, *R; int *S;", "typedef struct { int acumulador; int contador[4]; } est; est M, R; int S;", "typedef struct { int acumulador; int contador; } est; est M, R; int *S;", "Solo A y B son correctas.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["M y R deben ser estructuras (no punteros) para usar el operador . ; contador debe admitir indexación y *S exige que S sea un puntero. En A, contador es un arreglo de 4 enteros (el índice 3 es válido) y S es un puntero a int. B usa . sobre punteros, que exigiría ->; C desreferencia un int; D indexa un int. Es la misma declaración propuesta en la resolución original."], "blocks": [{"title": "", "code": ["typedef struct {", "    int acumulador;", "    int contador[4];", "} est;", "est M, R;", "int *S;"]}], "imgs": [], "ref": ""}]}, {"n": 4, "title": "Algoritmos y autómatas", "short": "Algoritmos y autómatas", "pts": "0.5 puntos por item", "items": [{"id": "4.1", "text": "Al aplicar el algoritmo de clases sobre un AFD que no es mínimo, ¿puede el estado de rechazo eliminarse por tener equivalencia por clases con otro estado no final?", "stmt": [], "ctx": null, "opts": ["Sí, siempre que exista otro estado no final.", "Sí, porque el algoritmo comienza agrupando todos los no finales en una misma clase.", "No: el estado de rechazo es único, por lo que ningún otro estado tiene su mismo comportamiento.", "Sí: el algoritmo de clases siempre elimina el estado de rechazo.", "No, porque el estado de rechazo es un estado final.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["El estado de rechazo es único; por lo tanto, su comportamiento no puede ser equivalente (ni inmediato ni por clases) al de ningún otro estado. Si se desea, se elimina manualmente antes o después de aplicar el algoritmo de clases. La única salvedad sería un AFD con más de un estado de rechazo: solo en ese caso uno de ellos podría eliminarse."], "blocks": [], "imgs": [], "ref": "Estados equivalentes inmediatos: pertenecen a la misma clase y tienen el mismo comportamiento (filas iguales en la TT). Solo hace falta uno de ellos."}, {"id": "4.2", "text": "En un AFN generado por Thompson, ¿cuántos estados tiene la clausura-ε del estado inicial?", "stmt": [], "ctx": null, "opts": ["Siempre tres.", "Siempre dos.", "Siempre al menos dos, porque el inicial siempre tiene una transición ε.", "Depende de la ER: para la ER a, la clausura-ε del inicial es solo {q0}.", "Siempre todos los estados del AFN.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["No siempre tiene tres estados: puede tener más o menos según la ER. En el AFN de Thompson para la ER a, el estado inicial solo tiene una transición con a; su clausura-ε posee un único estado, el propio q0."], "blocks": [], "imgs": ["media/image4.png"], "ref": "En el AFN de Thompson, al estado inicial no llegan transiciones; de cualquier estado no final parte una sola transición con un carácter, una sola transición-ε o dos transiciones-ε."}, {"id": "4.3", "text": "¿Cuántos estados tiene el AFN que se obtiene al aplicar Thompson a ER1, y cómo se compara con el de ER2?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere ER1 = ((ab)*)* y ER2 = (ab)*.", "code": [], "img": null}, "opts": ["12 estados: el doble que los 6 de ER2.", "8 estados: 2 más que los 6 de ER2.", "6 estados: igual que ER2, porque (x*)* = x*.", "10 estados: 4 más que los 6 de ER2.", "8 estados: el doble que los 4 de ER2.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["La diferencia entre ambas ER es un único operador clausura de Kleene. Para Thompson eso implica agregar solo dos estados (un nuevo inicial y un nuevo final). ER2 = (ab)*: a y b aportan 2 estados cada uno (4), la concatenación no agrega estados y la estrella agrega 2: 6. ER1 agrega otra estrella: 8. No es el doble."], "blocks": [{"title": "Estructura del AFN de ER1 ((ab)*)* (8 estados):", "code": []}], "imgs": ["media/image5.png"], "ref": "Thompson: un carácter (o ε) es un AF básico de dos estados. La unión y la clausura de Kleene agregan un estado inicial y uno final nuevos; la concatenación solo une los autómatas con una transición-ε."}, {"id": "4.4", "text": "¿Cuántos estados tiene el AFD mínimo asociado a ER1, sin contar un estado de rechazo?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere ER1 = ((ab)*)* y ER2 = (ab)*.", "code": [], "img": null}, "opts": ["2.", "1.", "3.", "4.", "8.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["ER1 denota el lenguaje de cualquier repetición de la secuencia ab (incluida la vacía). El AFD mínimo tiene 2 estados: q0, inicial y final, que con a pasa a q1; y q1, que con b vuelve a q0. No hace falta aplicar los otros dos algoritmos: alcanza con analizar la ER."], "blocks": [], "imgs": ["media/image3.png"], "ref": "El AFD mínimo es el que tiene la menor cantidad de estados; dos ER son equivalentes si las reconoce el mismo AFD mínimo."}]}]}, {"title": "Modelo 2", "slug": "modelo-2", "topics": "yylval y factorización; G: S → abY | Xba | a; fragmento iterador(); ER ((a+b)*)*", "exercises": [{"n": 1, "title": "Scanner, parser y rutinas semánticas", "short": "Scanner y parser", "pts": "0.5 puntos cada ítem", "items": [{"id": "1.1", "text": "¿Qué afirmación describe correctamente a la variable yylval?", "stmt": [], "ctx": null, "opts": ["Es una variable local del scanner, inaccesible para el parser.", "Es una columna de la tabla de símbolos.", "Contiene el código numérico del token reconocido.", "Es compartida: el scanner escribe en ella el valor semántico y el parser lo lee mediante las pseudovariables.", "Solo la usa el parser para guardar $$.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["yylval es compartida por el analizador léxico y el sintáctico: permite indicar, para cada token hallado, su valor semántico cuando corresponde. El scanner escribe en ella y el parser la lee a través de las pseudovariables ($1, $2, …). Por ejemplo, al reconocer una constante entera decimal se guarda en algún campo de yylval su valor entero. El código del token es el valor de retorno de yylex()."], "blocks": [], "imgs": [], "ref": "En las acciones, los valores semánticos de la parte derecha se acceden con las pseudovariables $N (N = posición del símbolo); el noterminal de la parte izquierda se referencia con $$."}, {"id": "1.2", "text": "¿Quién registra en la tabla de símbolos el nombre y el tipo de una variable declarada?", "stmt": [], "ctx": null, "opts": ["El scanner, que al reconocer el identificador guarda su nombre y su tipo.", "Las rutinas semánticas, cuando el parser reconoce una declaración.", "El preprocesador.", "El scanner, al reconocer la palabra reservada del tipo.", "Nadie: en C los tipos se verifican en ejecución.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["El analizador léxico trabaja token por token y no puede identificar por sí solo una sentencia de declaración; por eso no le corresponde esa tarea. La realizan las rutinas semánticas una vez que el analizador sintáctico detecta la estructura de una declaración. Aunque en algunas implementaciones (como Micro) el scanner coloca el lexema de un identificador en la TS, el tipo y el ámbito los resuelven las rutinas semánticas: el identificador puede pertenecer a distintos bloques y el scanner no puede distinguirlos."], "blocks": [], "imgs": [], "ref": "Tabla de símbolos: contiene los identificadores con sus atributos. Para nombres de variables, los atributos son tipo y ámbito."}, {"id": "1.3", "text": "¿Cómo se relacionan temporalmente el análisis léxico y el sintáctico?", "stmt": [], "ctx": null, "opts": ["El sintáctico comienza una vez que el léxico terminó de procesar todo el archivo.", "El léxico comienza una vez finalizado el sintáctico.", "Son simultáneos: el parser orquesta el análisis y pide tokens al scanner a medida que los necesita.", "Son procesos independientes que no intercambian información.", "El sintáctico se ejecuta solo si el léxico no encontró errores en todo el archivo.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Los análisis se realizan de forma simultánea. El analizador sintáctico orquesta la etapa de análisis: trabaja en paralelo con el léxico, recibiendo tokens e identificando estructuras sintácticas como expresiones, sentencias y declaraciones."], "blocks": [], "imgs": [], "ref": "Desde main() se invoca yyparse(), que durante el análisis invoca varias veces a yylex() para pedir los tokens que va reconociendo. El token es un entero y su valor queda en yylval."}, {"id": "1.4", "text": "Respecto de la factorización a izquierda, ¿qué afirmación es correcta?", "stmt": [], "ctx": null, "opts": ["Garantiza siempre obtener una gramática LL(1).", "Elimina la recursividad a izquierda.", "Cambia el lenguaje generado por la gramática.", "Solo puede aplicarse a gramáticas regulares.", "No alcanza por sí sola: S → aa | ab | Sb factorizada como S → aT | Sb; T → a | b sigue sin ser LL(1).", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["La factorización a izquierda es necesaria pero no suficiente para obtener una gramática LL(1). Contraejemplo: S → aa | ab | Sb. Factorizando: S → aT | Sb; T → a | b. Sigue sin ser LL(1), porque conserva la recursividad a izquierda S → Sb (aT y Sb comparten a en PRIMERO)."], "blocks": [{"title": "", "code": ["S → aa | ab | Sb", "S → aT | Sb", "T → a | b"]}], "imgs": [], "ref": "Para que una GIC sea LL(1) se aplican dos transformaciones: factorización a izquierda (prefijos comunes) y eliminación de la recursividad a izquierda."}, {"id": "1.5", "text": "Un scanner de C lee el carácter +. ¿Qué necesita para determinar el lexema del operador?", "stmt": [], "ctx": null, "opts": ["Nada: + siempre es un token completo.", "Leer el carácter siguiente (carácter de corte) para decidir entre +, ++ y +=.", "Consultar la tabla de símbolos.", "Esperar a que el parser le indique el operador esperado.", "Leer hasta el próximo espacio en blanco.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["En algunos operadores de C hay que leer el carácter siguiente para determinar el lexema. Con + puede tratarse de +, ++ o +=: solo el carácter que sigue lo decide. Si ese carácter no forma parte del operador, se devuelve al flujo de entrada con ungetc, porque será el primero del próximo lexema."], "blocks": [], "imgs": [], "ref": "Ej. del resumen: Abcd (LR infinito) requiere centinela; { (LR finito) no lo requiere; + sí lo requiere, porque podría ser ++ o +=. El carácter extra se devuelve con ungetc."}]}, {"n": 2, "title": "Gramáticas y análisis sintáctico", "short": "Gramáticas LL(1)", "pts": "0.5 puntos por item", "items": [{"id": "2.1", "text": "¿Qué problemas impiden que G sea LL(1)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abY | Xba | a","Y → Yc | a","X → aY | ε"], "img": null}, "opts": ["Solo la recursividad a izquierda de Y.", "Solo el prefijo común a entre abY y a.", "La recursividad a izquierda de Y y que abY, a y Xba pueden comenzar con a.", "Solo la producción ε de X.", "Ninguno: G ya es LL(1).", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Y → Yc es recursiva a izquierda. En S, abY y a comparten el prefijo a, y además PRIMERO(Xba) = {a, b}: como X → aY, Xba también puede comenzar con a. Factorizar solo abY | a no alcanza: hay que considerar también Xba."], "blocks": [], "imgs": [], "ref": "Limitaciones de LL(1): no pueden ser recursivas a izquierda y no pueden tener un noterminal con dos o más producciones cuyos lados derechos comiencen con el mismo terminal."}, {"id": "2.2", "text": "¿Qué reemplazo elimina la recursividad a izquierda de Y → Yc | a conservando el lenguaje?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abY | Xba | a","Y → Yc | a","X → aY | ε"], "img": null}, "opts": ["Y → aZ; Z → cZ | ε.", "Y → cY | a.", "Y → aZ; Z → cZ.", "Y → aY | c.", "Y → aZ | ε; Z → cZ | ε.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["L(Y) = ac*. Se reescribe como Y → aZ con la cola recursiva a derecha Z → cZ | ε. B genera c*a; C no tiene derivación terminal para Z; D genera a*c; E agrega ε a L(Y)."], "blocks": [{"title": "", "code": ["Y → aZ", "Z → cZ | ε"]}], "imgs": [], "ref": "Eliminación de la recursividad a izquierda: X → Xα | β se transforma en X → βZ y Z → αZ | ε. Toda secuencia comienza con β seguida de cero o más α."}, {"id": "2.3", "text": "Al reemplazar X en las producciones de S y factorizar a izquierda, ¿qué producciones se obtienen para S?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abY | Xba | a","Y → Yc | a","X → aY | ε"], "img": null}, "opts": ["S → aT | Xba; T → bY | ε.", "S → aT | ba; T → bY | Yba | ε.", "S → aT; T → bY | Yba | ba | ε.", "S → aT | ba; T → bY | Yba.", "S → abY | aYba | ba | a.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Factorizar solo abY | a da S → aT | Xba; T → bY | ε (opción A), pero aT y Xba siguen compartiendo a en PRIMERO. Desglosando X: S → abY | aYba | ba | a. Factorizando el prefijo a: S → aT | ba; T → bY | Yba | ε. C antepone a a ba; D pierde la cadena a; E no está factorizada."], "blocks": [{"title": "", "code": ["S → aT | ba", "T → bY | Yba | ε", "Y → aZ", "Z → cZ | ε"]}], "imgs": [], "ref": "Factorización a izquierda: A → αβ1 | … | αβn pasa a A → αB y B → β1 | … | βn. El prefijo común queda aislado en una sola producción."}, {"id": "2.4", "text": "En G, ¿cuál es SIGUIENTE(Y)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abY | Xba | a","Y → Yc | a","X → aY | ε"], "img": null}, "opts": ["{c, $}.", "{b, c}.", "{a, b, c, $}.", "{b, c, $}.", "{b, c, ε}.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Por S → abY, Y está al final: incorpora SIGUIENTE(S) = {$}. Por Y → Yc, se agrega c. Por X → aY, se incorpora SIGUIENTE(X), y en S → Xba, después de X aparece b. Resultado: {b, c, $}. ε nunca integra un conjunto SIGUIENTE."], "blocks": [], "imgs": [], "ref": "SIGUIENTE(A): si A va seguido de un terminal x, x ∈ SIGUIENTE(A); si va seguido de un noterminal B, PRIMERO(B) ⊆ SIGUIENTE(A); si A es el último símbolo de T → …A, SIGUIENTE(T) ⊆ SIGUIENTE(A). El axioma lleva fdt ($)."}, {"id": "2.5", "text": "Sobre la gramática obtenida, ¿es posible implementar un parser predictivo?", "stmt": ["S → aT | ba", "T → bY | Yba | ε", "Y → aZ", "Z → cZ | ε"], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abY | Xba | a","Y → Yc | a","X → aY | ε"], "img": null}, "opts": ["Sí: los conjuntos PREDICE de las producciones de cada no terminal son disjuntos.", "No, porque T tiene tres alternativas.", "No, porque quedan producciones ε.", "Sí, pero solo con retroceso (backtracking).", "No, porque Z es recursiva a derecha.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["S: aT con a, ba con b. T: bY con b, Yba con a, ε con SIGUIENTE(T) = {$}. Z: cZ con c, ε con SIGUIENTE(Z) = SIGUIENTE(Y) = {b, $}. Los conjuntos PREDICE de cada no terminal son disjuntos: la gramática es LL(1) sin ambigüedades, y conociendo el próximo token se determina inequívocamente qué producción aplicar. La cantidad de alternativas, las producciones ε y la recursividad a derecha no impiden el análisis predictivo."], "blocks": [], "imgs": [], "ref": "PREDICE(A → X1…Xm) = PRIMERO(X1…Xm) si ε no está en él; si está, (PRIMERO − {ε}) ∪ SIGUIENTE(A). Si los PREDICE de cada noterminal no se superponen, la gramática es LL(1)."}]}, {"n": 3, "title": "Código C: léxico, sintaxis, semántica y declaraciones", "short": "Código C", "pts": "0.75 puntos por item", "items": [{"id": "3.1", "text": "¿Cuál es el diagnóstico léxico correcto del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int iterador(){", "2      int i,j,k = 0;", "3      while(i<=10){", "4          int x = i;", "5          i++;", "6          --j;}", "7      return x; ;};"], "img": null}, "opts": ["--j forma un único identificador.", "0 es una constante inválida.", "iterador no es un identificador válido.", "No hay errores léxicos: todos los lexemas son válidos y ++ y -- son tokens únicos.", ";; en la línea 7 es un lexema inválido.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["Toda palabra pertenece a alguna categoría léxica. Identificadores: iterador, i, j, k, x. Palabras reservadas: int, while, return. Caracteres de puntuación/operadores: ( ) { } ++ -- = ; <= ,. Constante entera octal: 0. Constante entera decimal: 10. -- y j son tokens separados."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.2", "text": "¿Qué diagnóstico sintáctico es correcto?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int iterador(){", "2      int i,j,k = 0;", "3      while(i<=10){", "4          int x = i;", "5          i++;", "6          --j;}", "7      return x; ;};"], "img": null}, "opts": ["Falta una llave de cierre de la función.", "Los ; adicionales de la línea 7 son errores sintácticos.", "int i,j,k = 0; es inválida porque solo k se inicializa.", "--j debe escribirse j-- para ser válido.", "Una declaración no puede aparecer dentro del cuerpo del while.", "Ninguna de las anteriores es correcta."], "ans": "F", "expl": ["El código no presenta errores sintácticos. Estructuras: definición de función (líneas 1–7); declaración de variables (línea 2); sentencia de iteración while (líneas 3–6); declaración de variable (línea 4); sentencia de expresión con postincremento (línea 5) y con predecremento (línea 6); sentencia de salto return (línea 7). Los ; adicionales son sentencias de expresión vacías. Las llaves están balanceadas: la } de la línea 6 cierra el while y la de la línea 7, la función."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.3", "text": "¿Qué restricción semántica se incumple?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  int iterador(){", "2      int i,j,k = 0;", "3      while(i<=10){", "4          int x = i;", "5          i++;", "6          --j;}", "7      return x; ;};"], "img": null}, "opts": ["i y j se usan sin inicializar, y eso es un error semántico.", "Una función int no puede contener dos ; seguidos.", "x se retorna en la línea 7 fuera del bloque del while, donde fue declarada.", "k se declara y no se usa.", "--j solo es válido si j es un puntero.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["x solo existe dentro del bloque del while; en la línea 7 no tiene una declaración visible y no puede retornarse. Que i y j no estén inicializadas puede indicarse como warning, pero no son errores semánticos. Una variable sin usar tampoco es un error."], "blocks": [], "imgs": [], "ref": "Las rutinas semánticas chequean la semántica estática de cada construcción (variables definidas, tipos correctos, etc.), restricciones sensibles al contexto que no pueden expresarse en una GIC."}, {"id": "3.4", "text": "Dentro de una función se escribe la sentencia siguiente. ¿Qué declaraciones la hacen semánticamente válida? La inicialización es opcional.", "stmt": ["M.medidas.ancho = S.medidas.ancho + talla[3] ;"], "ctx": null, "opts": ["typedef struct { int ancho; } est_aux; typedef struct { est_aux medidas; } est; est M, S; int talla[4];", "typedef struct { int ancho; } est_aux; typedef struct { est_aux *medidas; } est; est M, S; int talla[4];", "typedef struct { int ancho; } est; est M, S; int talla[4];", "typedef struct { int ancho; } est_aux; typedef struct { est_aux medidas; } est; est *M, *S; int talla[4];", "Solo A y B son correctas.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["M y S deben ser estructuras con un miembro medidas que, a su vez, sea una estructura con un miembro ancho; talla debe admitir el índice 3. B declara medidas como puntero, que exigiría ->; C no tiene el miembro medidas; D usa . sobre punteros."], "blocks": [{"title": "", "code": ["typedef struct {", "    int ancho;", "} est_aux;", "typedef struct {", "    est_aux medidas;", "} est;", "est M, S;", "int talla[4];"]}], "imgs": [], "ref": ""}]}, {"n": 4, "title": "Algoritmos y autómatas", "short": "Algoritmos y autómatas", "pts": "0.5 puntos por item", "items": [{"id": "4.1", "text": "¿El algoritmo de clases elimina los estados inalcanzables de un AFD?", "stmt": [], "ctx": null, "opts": ["Sí, siempre: es su objetivo principal.", "No necesariamente: si no tiene equivalencia inmediata ni por clases con otro estado, permanece.", "Sí, porque un estado inalcanzable siempre es equivalente al estado de rechazo.", "No, porque el algoritmo solo trabaja con estados finales.", "Sí, pero solo si es un estado final.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["El algoritmo de clases fusiona estados equivalentes (inmediatos o por clases); no analiza la alcanzabilidad. Por eso, en el procedimiento para obtener el AFD mínimo, eliminar los inalcanzables es un paso previo que se hace aparte. Contraejemplo (q0 estado inicial): q2+ es inalcanzable, pero no es equivalente a q0+ (con b, q2+ va a q2+ y q0+ va al rechazo) ni a q1 (no final). No se elimina."], "blocks": [], "imgs": ["media/image7.png"], "ref": "Pasos para el AFD mínimo: 1) eliminar los estados inalcanzables; 2) partir en no finales y finales; 3) eliminar equivalentes inmediatos; 4) armar la TTC; 5) buscar equivalentes por clase."}, {"id": "4.2", "text": "Dado un AFN generado por Thompson, ¿puede el conjunto hacia del estado inicial ser vacío para todo carácter del alfabeto?", "stmt": [], "ctx": null, "opts": ["No: el estado inicial siempre tiene una transición con un carácter.", "No, porque eso dejaría al AFN sin transiciones.", "Solo si la ER denota el lenguaje vacío.", "Solo si la ER contiene una unión.", "Sí: en la unión y en la clausura de Kleene el estado inicial solo tiene transiciones ε.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Es posible y se da en varios AFN de ER sencillas, como la unión de dos caracteres o la clausura de Kleene de un carácter. Alcanza con un ejemplo, porque el enunciado dice «puede ser». En el AFN de a*, el estado inicial 0 solo tiene transiciones ε: hacia(0, a) = ∅."], "blocks": [], "imgs": ["media/image16.png"], "ref": "Thompson: un carácter (o ε) es un AF básico de dos estados. La unión y la clausura de Kleene agregan un estado inicial y uno final nuevos; la concatenación solo une los autómatas con una transición-ε."}, {"id": "4.3", "text": "¿Cuántos estados tiene el AFN que se obtiene al aplicar Thompson a ER1, y cómo se compara con el de ER2?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere ER1 = ((a+b)*)* y ER2 = (a+b)*.", "code": [], "img": null}, "opts": ["16 estados: el doble que los 8 de ER2.", "8 estados: igual que ER2, porque (x*)* = x*.", "12 estados: 4 más que los 8 de ER2.", "10 estados: 2 más que los 8 de ER2.", "10 estados: el doble que los 5 de ER2.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["La diferencia entre ambas ER es un único operador clausura de Kleene: para Thompson eso agrega solo dos estados. ER2 = (a+b)*: a y b aportan 2 estados cada uno (4), la unión agrega 2 (6) y la estrella agrega 2 (8). ER1 agrega otra estrella: 10. No es el doble."], "blocks": [{"title": "Estructura del AFN de ER1 ((a+b)*)* (10 estados):", "code": []}], "imgs": ["media/image2.png"], "ref": "Thompson: un carácter (o ε) es un AF básico de dos estados. La unión y la clausura de Kleene agregan un estado inicial y uno final nuevos; la concatenación solo une los autómatas con una transición-ε."}, {"id": "4.4", "text": "¿Cuántos estados tiene el AFD mínimo asociado a ER1?", "stmt": [], "ctx": {"text": "Para 4.3 y 4.4 considere ER1 = ((a+b)*)* y ER2 = (a+b)*.", "code": [], "img": null}, "opts": ["2.", "1.", "3.", "10.", "0.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["ER1 representa el lenguaje universal sobre el alfabeto {a, b}: todas las cadenas, incluida la vacía. Alcanza con un único estado, inicial y final, con un bucle sobre sí mismo para a y b."], "blocks": [], "imgs": ["media/image13.png"], "ref": "El AFD mínimo es el que tiene la menor cantidad de estados; dos ER son equivalentes si las reconoce el mismo AFD mínimo."}]}]}, {"title": "Modelo 3", "slug": "modelo-3", "topics": "%union y validación de tipos; G: S → abX | acY | a; fragmento main(float a, int *b); AFD con q1+ y q3+", "exercises": [{"n": 1, "title": "Scanner, parser y rutinas semánticas", "short": "Scanner y parser", "pts": "0.5 puntos cada ítem", "items": [{"id": "1.1", "text": "¿Cuántos campos necesita la variable yylval?", "stmt": [], "ctx": null, "opts": ["Los necesarios según los tipos de valor semántico que deban transmitirse.", "Exactamente uno por cada categoría léxica del lenguaje.", "Uno por cada palabra reservada.", "Ninguno: yylval solo guarda el código del token.", "Uno por cada identificador declarado.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["yylval posee tantos campos como sean necesarios, lo que no implica uno por cada token (categoría léxica). Por ejemplo, si el lenguaje reconoce constantes enteras (decimales, octales, hexadecimales) y reales, alcanzan 2 campos: uno int y otro float. Con Bison, yylval es int por defecto y, con %union, se define un campo por cada tipo de valor semántico necesario, no por cada token."], "blocks": [], "imgs": [], "ref": "%union define una union de C con un campo por cada tipo de valor semántico que se necesite asociar a los tokens. Por defecto yylval es int."}, {"id": "1.2", "text": "¿Cuándo se realiza en C la validación de tipos de datos?", "stmt": [], "ctx": null, "opts": ["En tiempo de ejecución.", "Durante el análisis léxico.", "Durante el preprocesamiento.", "Durante el análisis semántico, en compilación, mediante las rutinas semánticas.", "Durante el enlazado.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["La validación de tipos (en expresiones, declaraciones, funciones y sus parámetros) se realiza durante la tercera etapa de la fase de análisis de la compilación, el análisis semántico, mediante las rutinas semánticas. No se hace en tiempo de ejecución."], "blocks": [], "imgs": [], "ref": "El análisis semántico verifica las reglas sensibles al contexto, por ejemplo la verificación de tipos para que cada operador trabaje sobre operandos permitidos."}, {"id": "1.3", "text": "¿Quién puede determinar el tipo de dato de una constante entera?", "stmt": [], "ctx": null, "opts": ["Solo las rutinas semánticas, consultando la tabla de símbolos.", "Nadie hasta el tiempo de ejecución.", "Solo el parser, porque depende del contexto sintáctico.", "Depende de la declaración de la variable a la que se asigna.", "El scanner: la categoría léxica y su valor alcanzan, sin contexto ni tabla de símbolos.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["La categoría léxica constante entera tiene la información suficiente para que el propio scanner determine su tipo: int, y según el valor leído, long int o long long int si no alcanza. No depende de otros tokens, del contexto ni de la tabla de símbolos; de hecho, el scanner puede retornar el par (tipoConstanteNumerica, valor). También se acepta que lo determine el parser con el token y el valor de yylval; en ningún caso es una cuestión semántica ni sensible al contexto."], "blocks": [], "imgs": [], "ref": "El Scanner retorna pares ordenados; para constantes numéricas, (tipoConstanteNumerica, índice) o (tipoConstanteNumerica, valor)."}, {"id": "1.4", "text": "¿Qué tipo de producciones no pueden manejar los analizadores sintácticos descendentes?", "stmt": [], "ctx": null, "opts": ["Las recursivas a derecha.", "Las recursivas a izquierda; por eso se transforman en recursivas a derecha.", "Las producciones ε.", "Las que contienen terminales.", "Las que tienen más de dos símbolos.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Los analizadores descendentes no pueden manejar producciones con recursividad a izquierda. En su reemplazo se usan producciones con recursividad a derecha, mediante las transformaciones convenientes de la GIC."], "blocks": [], "imgs": [], "ref": "Las gramáticas LL(1) no pueden ser recursivas a izquierda; la recursividad a izquierda se transforma en recursividad a derecha, no al revés."}, {"id": "1.5", "text": "Para los lenguajes regulares infinitos que reconoce el scanner, ¿siempre se necesita un carácter de corte (centinela)?", "stmt": [], "ctx": null, "opts": ["Sí, en todos los casos.", "Sí, salvo para los identificadores.", "No: un literal cadena termina al leer la comilla doble de cierre, sin leer un carácter más.", "No: ningún LR infinito lo necesita.", "Solo para los literales cadena.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Contraejemplo: los literales cadena son LR infinitos reconocidos por el scanner, pero no necesitan centinela: se sabe que el lexema terminó al leer la comilla doble de cierre. Otros LR infinitos, como los identificadores o las constantes, sí lo necesitan, por lo que D es falsa. La regla general «si el LR es infinito requiere centinela» tiene esta excepción."], "blocks": [], "imgs": [], "ref": "Cada lexema es la mayor secuencia posible de caracteres para su token, por lo que a veces se lee un primer carácter que no pertenece al lexema (centinela). Ese carácter extra se devuelve al flujo con ungetc."}]}, {"n": 2, "title": "Gramáticas y análisis sintáctico", "short": "Gramáticas LL(1)", "pts": "0.5 puntos por item", "items": [{"id": "2.1", "text": "¿Qué problemas impiden que G sea LL(1)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abX | acY | a","X → Xc | Xb | a","Y → b | ε"], "img": null}, "opts": ["Solo la recursividad a izquierda de X.", "Solo el prefijo común a en las alternativas de S.", "La producción ε de Y.", "Ninguno: G ya es LL(1).", "El prefijo común a en las tres alternativas de S y la recursividad a izquierda de X.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Las tres alternativas de S comienzan con a: con preanálisis a no se puede elegir la producción, así que hay que factorizar. Además, X → Xc | Xb es recursiva a izquierda. La producción ε de Y no genera conflicto."], "blocks": [], "imgs": [], "ref": "Limitaciones de LL(1): no pueden ser recursivas a izquierda y no pueden tener un noterminal con dos o más producciones cuyos lados derechos comiencen con el mismo terminal."}, {"id": "2.2", "text": "¿Cuál es el resultado de factorizar a izquierda las producciones de S?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abX | acY | a","X → Xc | Xb | a","Y → b | ε"], "img": null}, "opts": ["S → aT; T → bX | cY.", "S → abT | acY; T → X | ε.", "S → aT; T → bX | cY | ε.", "S → aT | a; T → bX | cY.", "S → aT; T → bX | cY | a.", "Ninguna de las anteriores es correcta."], "ans": "C", "expl": ["Se extrae el prefijo común a y el resto queda en T: S → aT; T → bX | cY | ε. La alternativa ε conserva la cadena a. A pierde la cadena a; B sigue sin factorizar acY y genera ab; D conserva el conflicto entre aT y a; E genera aa."], "blocks": [{"title": "1°) Factorización en S", "code": ["S → aT", "T → bX | cY | ε", "X → Xc | Xb | a", "Y → b | ε"]}], "imgs": [], "ref": "Factorización a izquierda: A → αβ1 | … | αβn pasa a A → αB y B → β1 | … | βn. El prefijo común queda aislado en una sola producción."}, {"id": "2.3", "text": "¿Qué reemplazo elimina la recursividad a izquierda de X → Xc | Xb | a conservando el lenguaje?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abX | acY | a","X → Xc | Xb | a","Y → b | ε"], "img": null}, "opts": ["X → aZ; Z → cZ | bZ.", "X → cX | bX | a.", "X → aZ | ε; Z → cZ | bZ | ε.", "X → aZ; Z → cZ | bZ | ε.", "X → aZ; Z → cbZ | ε.", "Ninguna de las anteriores es correcta."], "ans": "D", "expl": ["L(X) = a(b + c)*. Se reescribe como X → aZ con la cola Z → cZ | bZ | ε. A no tiene derivación terminal para Z; B genera (b + c)*a; C agrega ε a L(X); E solo genera repeticiones de cb."], "blocks": [{"title": "2°) Eliminación de recursividad a izquierda en X", "code": ["S → aT", "T → bX | cY | ε", "X → aZ", "Z → cZ | bZ | ε", "Y → b | ε"]}], "imgs": [], "ref": "Eliminación de la recursividad a izquierda: X → Xα | β se transforma en X → βZ y Z → αZ | ε. Toda secuencia comienza con β seguida de cero o más α."}, {"id": "2.4", "text": "En G, ¿cuál es SIGUIENTE(X)?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abX | acY | a","X → Xc | Xb | a","Y → b | ε"], "img": null}, "opts": ["{b, c, $}.", "{b, c}.", "{$}.", "{a, b, c, $}.", "{b, c, ε}.", "Ninguna de las anteriores es correcta."], "ans": "A", "expl": ["En X → Xc y X → Xb, después de X aparecen c y b. En S → abX, X está al final: se incorpora SIGUIENTE(S) = {$}. Resultado: {b, c, $}. ε nunca integra un conjunto SIGUIENTE."], "blocks": [], "imgs": [], "ref": "SIGUIENTE(A): si A va seguido de un terminal x, x ∈ SIGUIENTE(A); si va seguido de un noterminal B, PRIMERO(B) ⊆ SIGUIENTE(A); si A es el último símbolo de T → …A, SIGUIENTE(T) ⊆ SIGUIENTE(A). El axioma lleva fdt ($)."}, {"id": "2.5", "text": "Aplicadas las transformaciones de 2.2 y 2.3, ¿es posible implementar un parser predictivo para la gramática obtenida?", "stmt": [], "ctx": {"text": "Para 2.1–2.5 use la gramática G. S es el axioma, ε la cadena vacía y $ el fin de entrada; los terminales son a, b y c.", "code": ["S → abX | acY | a","X → Xc | Xb | a","Y → b | ε"], "img": null}, "opts": ["No, porque T tiene una producción ε.", "Sí: es LL(1); el próximo token determina inequívocamente la producción a aplicar.", "No, porque Z es recursiva a derecha.", "Sí, pero solo con retroceso (backtracking).", "No, porque Y y T comparten b en PRIMERO.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["S tiene una sola alternativa. T: bX con b, cY con c, ε con SIGUIENTE(T) = {$}. Z: cZ con c, bZ con b, ε con SIGUIENTE(Z) = {$}. Y: b con b, ε con {$}. Los conjuntos PREDICE de las producciones de cada no terminal son disjuntos; que Y y T compartan b no es un conflicto, porque son no terminales distintos."], "blocks": [{"title": "Gramática LL(1) final:", "code": ["S → aT", "T → bX | cY | ε", "X → aZ", "Z → cZ | bZ | ε", "Y → b | ε"]}], "imgs": [], "ref": "PREDICE(A → X1…Xm) = PRIMERO(X1…Xm) si ε no está en él; si está, (PRIMERO − {ε}) ∪ SIGUIENTE(A). Si los PREDICE de cada noterminal no se superponen, la gramática es LL(1)."}]}, {"n": 3, "title": "Código C: léxico, sintaxis, semántica y declaraciones", "short": "Código C", "pts": "0.75 puntos por item", "items": [{"id": "3.1", "text": "¿Cuál es el diagnóstico léxico correcto del fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  void main (float a, int *b){", "2      char _a_[1] = 64;", "3      while(i<=10){", "4          printf(\"%d \\n\",i);", "5          i++;}", "6      return 3;", "7      return 5;"], "img": null}, "opts": ["_a_ no es un identificador válido porque comienza con guion bajo.", "No hay errores léxicos: todos los lexemas pertenecen a alguna categoría léxica.", "\"%d \\n\" contiene un carácter inválido.", "main es una palabra reservada y no puede usarse como nombre de función.", "64 debe escribirse entre comillas simples.", "Ninguna de las anteriores es correcta."], "ans": "B", "expl": ["Identificadores: main, a, b, _a_, i, printf. Palabras reservadas: void, float, int, char, while, return. Caracteres de puntuación/operadores: ( ) { } [ ] ++ * = ; <= ,. Constantes enteras decimales: 1, 3, 5, 10, 64. Literal cadena: \"%d \\n\" (\\n es una secuencia de escape válida). Un identificador puede comenzar con guion bajo, y main es un identificador, no una palabra reservada."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.2", "text": "¿Qué errores sintácticos presenta el fragmento?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  void main (float a, int *b){", "2      char _a_[1] = 64;", "3      while(i<=10){", "4          printf(\"%d \\n\",i);", "5          i++;}", "6      return 3;", "7      return 5;"], "img": null}, "opts": ["Solo el uso de dos sentencias return.", "Falta la llave de cierre de la función.", "El inicializador del arreglo debe ir entre llaves ({64}).", "Los parámetros deben separarse con ; en lugar de ,.", "Solo B y C son correctas.", "Ninguna de las anteriores es correcta."], "ans": "E", "expl": ["Falta la llave de cierre de la función: si se analizara con un AFP, la cima de la pila quedaría esperando el token }. Además, el inicializador de un arreglo debe ir entre llaves: para la cátedra es una restricción sintáctica, porque es una cuestión estructural sobre la secuencia de tokens. Sintácticamente correcto implica derivable y además cumplir las restricciones sintácticas."], "blocks": [], "imgs": [], "ref": ""}, {"id": "3.3", "text": "¿Qué restricción semántica se incumple?", "stmt": [], "ctx": {"text": "Para 3.1–3.3 use el fragmento siguiente. En 3.3 suponga corregido el error sintáctico si hubiere. Los números de línea no forman parte del código.", "code": ["1  void main (fl
