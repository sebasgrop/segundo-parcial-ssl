ada. `p0` es el símbolo inicial de la pila e indica que está vacía (por ejemplo, $).", "Ejemplo: `T(4, a, Z) = {(4, RPZ), (5, ε)}`: en el estado 4, leyendo a con Z en la cima, puede quedarse en 4 y reemplazar Z por RPZ (apila P y R; R queda en la cima), o pasar a 5 y desapilar Z.", "AFPN: varias transiciones para la misma terna (estado, entrada, cima). La tabla de movimientos se organiza por el **par estado y cima**, no solo por estado.", "Si un AFPD reconoce un lenguaje por estado final, se puede construir otro que lo reconozca por pila vacía, y viceversa. Uso típico: paréntesis balanceados y análisis sintáctico."], "exam": "Qué hace una transición ε: no consume entrada, pero consulta la cima y puede apilar, desapilar o reemplazar.", "practice": [[4, "4.4"], [3, "3.2"]]}, {"id": "turing", "title": "Máquina de Turing", "what": "Autómata determinístico capaz de reconocer cualquier lenguaje formal.", "bullets": ["Cinta infinita con la cadena seguida de blancos, que actúan como centinela.", "La cabeza lee, escribe y se mueve una celda a izquierda o derecha; no retrocede antes del primer carácter.", "Programa: según estado y carácter leído, qué escribir, hacia dónde moverse y a qué estado pasar.", "Elementos: alfabeto, cinta, cabeza, alfabeto de escritura, estados (inicial y finales) y programa.", "A diferencia de un AF, mueve la cabeza en **los dos sentidos** y puede escribir en la cinta: la usa como memoria auxiliar.", "Definición formal alternativa (7-upla): `(Q, Σ, Γ, δ, q0, q_acept, q_rech)`, con Γ el alfabeto de la cinta, que incluye Σ y el blanco."], "exam": "Enumerar sus elementos y explicar cómo se mueve la cabeza en cada paso.", "practice": []}]}, {"n": 6, "title": "Criterios de los modelos", "sub": "Lo que las resoluciones de la cátedra dan por correcto en el Ejercicio 3", "concepts": [{"id": "codigoc", "title": "Diagnóstico de código C", "what": "Cómo clasificar cada problema del fragmento: léxico, sintáctico, semántico o solo warning.", "bullets": ["**Léxico**: casi nunca hay error. `0` es constante octal; `main` y `_a_` son identificadores; `++`, `--` y `+=` son un solo token.", "**Sintáctico**: llave sin cerrar, paréntesis o `;` faltante. El inicializador de un arreglo va entre llaves (restricción sintáctica).", "`;;` no es error: el segundo `;` es una sentencia vacía.", "**Semántico**: variable sin declaración visible (incluso por usarla fuera de su bloque) o asignar a un `const`.", "**Solo warning**: variable sin inicializar, variable sin usar, `return` con valor en una función `void`.", "Que **falte un token** (un `)` o una `}`) es un error sintáctico, no léxico. Un error léxico sería un carácter que no inicia ningún lexema.", "Sintácticamente correcto = derivable **y** que cumpla las restricciones sintácticas. Una `}` faltante es la que la cima de la pila del AFP queda esperando.", "Son válidos: declarar una variable dentro del bloque de un `while`, `--j` e `int i,j,k = 0;` (solo k se inicializa).", "Usar `printf` sin `#include <stdio.h>` también es usarla sin una declaración visible."], "exam": "En el ítem 3.3 casi siempre hay una opción tentadora sobre variables sin inicializar: es warning, no error semántico.", "practice": [[1, "3.1"], [1, "3.2"], [1, "3.3"], [2, "3.1"], [2, "3.2"], [2, "3.3"], [3, "3.1"], [3, "3.2"], [3, "3.3"], [4, "3.1"], [4, "3.2"], [4, "3.3"]]}, {"id": "declaraciones", "title": "Declaraciones para una sentencia", "what": "Deducir los tipos a partir de los operadores que usa la sentencia.", "bullets": ["`.` exige una estructura; `->` exige un puntero a estructura.", "`x[i]` exige un arreglo o un puntero (un puntero también se indexa).", "`*S` y `(*S).campo` exigen que S sea un puntero.", "El arreglo tiene que admitir el índice usado: `contador[3]` necesita al menos 4 elementos.", "`(*S).campo` equivale a `S->campo`.", "`&items[i]` tiene tipo `Item*`. Si items es un `Item*` también se puede indexar: `items[i]` es un Item."], "exam": "Descartar opciones por operador: `.` sobre un puntero, `->` sobre una estructura, desreferenciar un int, indexar un int.", "practice": [[1, "3.4"], [2, "3.4"], [3, "3.4"], [4, "3.4"]]}]}], "errores": ["Complementar un AFD sin completarlo antes.", "Creer que una clausura-ε puede ser vacía: siempre contiene al propio estado.", "Marcar como final un estado del AFD solo si todos sus estados del AFN son finales: alcanza con uno.", "Poner transiciones que llegan al inicial o salen del final en un AFN de Thompson.", "Transformar la recursividad a izquierda en otra cosa que recursividad a derecha.", "Olvidar en PREDICE que, si ε está en PRIMERO, se resta ε y se une SIGUIENTE(A).", "Poner ε o $ en SIGUIENTE sin justificarlo: ε nunca va; $ solo si A puede quedar al final de lo que deriva el axioma.", "Confundir lo que retorna yylex() (código del token) con yylval (valor semántico).", "Olvidar que yyparse() devuelve 0 si todo está bien y 1 si hay error.", "Clasificar como error léxico un token faltante, como un `)` o una `}`: es sintáctico.", "Llamar error semántico a una variable sin inicializar: es solo un warning.", "Creer que aplicar una producción ε consume el símbolo de preanálisis.", "Contar igual los estados de Thompson para (x*)* y x*: cada estrella suma 2 estados.", "Ver un conflicto LL(1) donde dos noterminales distintos comparten un símbolo: el conflicto es solo entre producciones del mismo noterminal.", "Usar `.` sobre un puntero o `->` sobre una estructura."], "auto": [["¿En qué se diferencian AFD, AFN y AFN-ε?", "En el AFD cada estado y carácter llevan a un único estado; en el AFN puede haber 0, 1 o más transiciones por el mismo carácter; el AFN-ε suma transiciones que no leen carácter."], ["¿Cómo se completa un AFD y por qué hace falta?", "Se agrega un estado de rechazo al que van todos los huecos y del que no se sale. Es necesario antes de complementar."], ["¿Qué características tiene el AFN-ε de Thompson?", "Al inicial no llegan transiciones, el final es único y sin salidas, y de cualquier otro estado parte una transición con un carácter, o una o dos transiciones-ε."], ["¿Cómo se arma el AFD a partir de un AFN?", "Inicial: Clausura-ε del inicial del AFN. Para cada símbolo se calcula hacia(R, x), se le saca la Clausura-ε y se repite hasta que no haya estados nuevos. Finales: los conjuntos con al menos un final."], ["¿Cómo se complementa y cómo se intersecta?", "Complemento: completar y cambiar finales por no finales. Intersección: estados producto Q1 × Q2, finales F1 × F2."], ["¿Cómo se pasa de un AF a una ER?", "Se eliminan los estados erróneos, se plantea una ecuación por estado (con +ε si es final) y se resuelve con e = αe + β ⇒ e = α*β."], ["¿Cuándo dos estados son equivalentes inmediatos y qué se hace?", "Cuando están en la misma clase y tienen la misma fila en la TT. Se deja uno solo."], ["¿Qué agrega un AFP a un AF y cómo reconoce un LIC?", "Una pila. Reconoce por estado final o por pila vacía."], ["¿Qué elementos tiene una Máquina de Turing?", "Alfabeto, cinta infinita, cabeza de cinta, alfabeto de escritura, conjunto finito de estados (con inicial y finales) y un programa de reglas."], ["¿Cuáles son las fases de la compilación?", "Análisis (léxico, sintáctico y semántico, todos usando la tabla de símbolos) y síntesis (genera el programa objeto)."], ["¿Por qué el scanner a veces devuelve un carácter al flujo?", "Porque el lexema es la mayor secuencia posible: lee un carácter que no le pertenece y lo devuelve con ungetc."], ["¿Qué transformaciones necesita una GIC para ser LL(1)?", "Factorización a izquierda (prefijos comunes) y eliminación de la recursividad a izquierda."], ["¿Cómo se calcula PREDICE(A → X1…Xm)?", "Si ε no está en PRIMERO(X1…Xm), es ese PRIMERO. Si está, es (PRIMERO − {ε}) ∪ SIGUIENTE(A)."], ["¿Cómo se comunican yyparse() y yylex()?", "main() invoca yyparse(), que pide tokens a yylex(); el token es un entero y su valor queda en yylval. yyparse() devuelve 0 si la entrada es correcta y 1 si no, tras invocar yyerror()."], ["¿Qué va en cada sección del archivo de Bison?", "Definiciones (%union, %token, %type, %left y %right, %start), reglas con sus acciones ($$ y $N) y código de usuario (por ejemplo yyerror())."], ["¿Qué gramática y qué autómata mínimo corresponden a cada tipo de lenguaje?", "LR: GR y AF. LIC: GIC y AFP. LSC: GSC y Máquina de Turing. LIR: GIR y Máquina de Turing."], ["¿Cuándo hay un error léxico?", "Cuando el primer carácter que lee el scanner para armar el próximo lexema no inicia ningún lexema válido. Que falte un token es sintáctico."], ["En «int t; { float t; t = 2.5; }», ¿qué declaración usa la asignación?", "La interna, float t: es la visible más cercana y oculta a la externa. La TS respeta los ámbitos."], ["En un LL(1), la pila es B d $ y el preanálisis es d, con PREDICE(B → ε) = {d}. ¿Qué se hace?", "Se aplica B → ε: se desapila B sin consumir d. Después se hace Match(d) y, con $ en pila y entrada, se acepta."], ["¿Qué relación hay entre las gramáticas LL(1) y LR(1)?", "Toda gramática LL(1) es LR(1), pero no al revés. LL deriva por izquierda (descendente); LR reconstruye una derivación por derecha en orden inverso (ascendente)."], ["¿Qué diferencia hay entre el retorno de yylex(), yylval e yytext?", "yylex() retorna el código del token; yylval tiene su valor semántico (por ejemplo, el entero 36); yytext es el texto del lexema (\"36\") e yyleng su longitud."]]};
const TP = {"stages": [{"n": 1, "title": "Migración del TP3 al TP4 y nuevo formato del reporte", "desc": "Llevar el analizador léxico y sintáctico del TP3 a la carpeta `TP4/` y adaptar el reporte a los 5 listados que pide el TP4. Al terminar, el programa debe producir correctamente los listados de errores sintácticos y léxicos, y los listados 1 y 2 en el nuevo formato (todavía con la implementación del TP3; en E2 pasan a la TS). El listado de errores semánticos queda preparado (infraestructura de almacenamiento e impresión) pero vacío (`-`).", "tasks": [{"t": "Crear la rama `TP_4` desde `main` y traer a `TP4/src/` el contenido de `TP3/src/` de la rama `tp_3` (`parser.y`, `scanner.l`, `general.c`, `general.h`).", "sub": []}, {"t": "Eliminar del reporte el listado de sentencias del TP3 (el TP4 no lo pide) y la lógica que solo servía para él.", "sub": []}, {"t": "Ajustar los títulos y el orden de los listados exactamente a:", "sub": ["1. `* Listado de variables declaradas (tipo de dato y numero de linea):`", "2. `* Listado de funciones declaradas y definidas:`", "3. `* Listado de errores semanticos:`", "4. `* Listado de errores sintacticos:`", "5. `* Listado de errores lexicos:`", "Con una línea en blanco entre listados y `-` cuando un listado no tiene elementos."]}, {"t": "Listado 1: agregar la columna del identificador → `nombre: tipo, linea L, columna C`.", "sub": []}, {"t": "Verificar que la gramática acepte lo que aparece en el ejemplo de la consigna y en los tests y que el TP3 tal vez no cubra:", "sub": ["calificador `const` en declaraciones (el tipo se muestra como `const float`);", "parámetros sin identificador en prototipos (`float potencia(float base, unsigned long);` → `input: float base, unsigned long`)."]}, {"t": "Agregar en `general.c/.h` una lista dinámica de errores semánticos que conserve el orden de inserción, con una función pública para agregar un error (mensaje principal + nota opcional) y su impresión en el listado 3. Formato de cada error: `L:C: mensaje` y, si hay nota, en la línea siguiente `Nota: ...`.", "sub": []}, {"t": "Mantener el debug por `stderr` (macro `DEBUG` en `general.h`) para que `stdout` tenga solo el reporte.", "sub": []}, {"t": "Liberar toda la memoria dinámica al final.", "sub": []}], "files": ["`TP4/src/parser.y` (reemplaza la plantilla)", "`TP4/src/scanner.l` (reemplaza la plantilla)", "`TP4/src/general.c` (reemplaza la plantilla)", "`TP4/src/general.h` (reemplaza la plantilla)"], "handoff": ["Rama `TP_4` con el TP3 funcionando dentro de `TP4/`, compila con `make all`.", "Listados 4 (sintácticos) y 5 (léxicos) correctos contra los tests.", "Listados 1 y 2 con el formato del TP4 (aún sin TS).", "Función pública para registrar errores semánticos ya disponible: las etapas E3–E7 solo la invocan."], "prompt": "Trabajo en el repositorio de la materia Sintaxis y Semántica de los Lenguajes (UTN FRBA). Hay que implementar el TP4: un analizador léxico, sintáctico y semántico de ANSI C con Flex + Bison, que lee un archivo .i y imprime por stdout un reporte. Esta sesión es SOLO la Etapa 1 de 7: migrar el TP3 a la carpeta TP4 y adaptar el formato del reporte. No implementes nada de análisis semántico ni Tabla de Símbolos.\n\nContexto:\n- TP4/src/ hoy contiene solo una plantilla (calculadora polaca). El TP3 terminado está en la rama `tp_3`, en TP3/src/ (parser.y, scanner.l, general.c, general.h).\n- La entrega va por PR desde la rama `TP_4` a `main`; esa rama solo puede modificar archivos dentro de TP4/ y README.md. TP4/tests/ está protegido: no lo modifiques.\n- Se compila con `make all` dentro de TP4/ (ejecutable TP4/bin/tp4). Los tests: `./tests/run_testsuite.sh ./bin/tp4` desde TP4/. Salidas esperadas en TP4/tests/output/expected/test_*.txt. Respetar .clang-format de la raíz.\n\nPasos:\n1. Crear la rama `TP_4` desde `main` (si ya existe, usarla). Copiar a TP4/src/ los 4 archivos de TP3/src/ de la rama tp_3: `git show tp_3:TP3/src/parser.y > TP4/src/parser.y` (idem scanner.l, general.c, general.h). No tocar TP3/.\n2. Leer TP4/tests/output/expected/test_1.txt..test_5.txt y ajustar el reporte para que tenga exactamente estos 5 listados en este orden, separados por una línea en blanco, imprimiendo \"-\" cuando un listado esté vacío:\n   * Listado de variables declaradas (tipo de dato y numero de linea):\n   * Listado de funciones declaradas y definidas:\n   * Listado de errores semanticos:\n   * Listado de errores sintacticos:\n   * Listado de errores lexicos:\n3. Eliminar el listado de sentencias del TP3 (agregarSentencia y todo lo que solo exista para él). El TP4 no lo pide.\n4. Listado de variables: el formato pasa a ser `nombre: tipo, linea L, columna C`, donde C es la columna del identificador (usar @n.first_column del token IDENTIFICADOR). El listado de funciones mantiene el formato del TP3: `nombre: definicion|declaracion, input: <params>, retorna: <tipo>, linea L`.\n5. Verificar que la gramática acepte (y que el reporte muestre como en los tests): el calificador `const` en declaraciones (tipo mostrado como \"const float\") y parámetros sin identificador en prototipos (ej. `float potencia(float base, unsigned long);` se lista como `input: float base, unsigned long`). Si no lo acepta, agregar solo las producciones mínimas necesarias.\n6. En general.h/general.c agregar una lista enlazada dinámica de errores semánticos que conserve el orden de inserción, con una función pública, por ejemplo:\n   void agregarErrorSemantico(int linea, int columna, const char* mensaje, const char* nota);\n   (`nota` puede ser NULL). Al imprimir el listado 3, cada error sale como `L:C: mensaje` y, si tiene nota, en la línea siguiente `Nota: <nota>`. En esta etapa nadie la invoca todavía (el listado 3 sale \"-\"). Liberar esta lista en liberarMemoria().\n7. Mantener que los mensajes de debug vayan solo a stderr (macro DEBUG en general.h) y que stdout tenga únicamente el reporte.\n8. Verificar que los listados de errores sintácticos (\"texto\": linea N) y léxicos (cadena: linea L, columna C) coincidan con los tests.\n\nRestricciones:\n- NO implementar Tabla de Símbolos ni ninguna validación semántica (son etapas posteriores).\n- NO agregar soporte para punteros, arreglos, structs, unions, enums ni scope.\n- NO refactorizar ni renombrar código del TP3 que no sea necesario para estos cambios.\n- NO modificar GNUmakefile, mkframework/, tests/, .vscode/ ni archivos fuera de TP4/.\n- Solo bibliotecas estándar de C (nada de POSIX).\n\nVerificación: `make all` sin errores, correr la testsuite y confirmar que los listados 1, 2, 4 y 5 coinciden con los esperados (el 3 todavía saldrá \"-\" y no coincidirá; es lo esperado en esta etapa). Mostrame el resumen de cambios al final y no hagas commit sin preguntarme."}, {"n": 2, "title": "Tabla de Símbolos (TS) y listados 1 y 2 desde la TS", "desc": "Implementar la Tabla de Símbolos con memoria dinámica y hacer que los listados de variables y de funciones se construyan a partir de ella (la rúbrica exige que no sean listas paralelas). Definir también la representación de tipos y las funciones que los convierten a texto, porque todos los mensajes de error semánticos dependen de ese formato.", "tasks": [{"t": "Crear el módulo de TS (`ts.h` / `ts.c`) con una estructura dinámica (lista enlazada en orden de aparición) donde cada símbolo guarde: identificador, categoría (variable/función), tipo de dato, si es `const`, si es declaración o definición (funciones), lista de parámetros (tipo, nombre opcional, línea y columna de cada parámetro), tipo de retorno, línea y columna del identificador.", "sub": []}, {"t": "Funciones mínimas: crear/insertar símbolo, buscar por identificador, recorrer en orden (para el reporte) y liberar toda la TS.", "sub": []}, {"t": "Funciones de formateo de tipos, con el texto exacto que usa la consigna:", "sub": ["variable: `unsigned int`, `const float`, `char *`;", "función (en notas de declaración): `void(void)`, `int(int)`, `double(double, unsigned int)`;", "función usada como valor (puntero a función): `void (*)(void)`, `int (*)(int)`."]}, {"t": "Reemplazar las listas del TP3 (`agregarVariable`, `agregarFuncion`) para que el parser inserte en la TS y el reporte (listados 1 y 2) recorra la TS.", "sub": []}, {"t": "Permitir que una misma función tenga dos entradas en la TS: su prototipo (`declaracion`) y su definición (`definicion`), porque el listado esperado muestra ambas (ej. `incremento` declaración línea 9 y definición línea 43).", "sub": []}, {"t": "Agregar `ts.c` / `ts.h` al build si el makefile no toma automáticamente los `.c` de `src/`.", "sub": []}], "files": ["`TP4/src/ts.h` (nuevo)", "`TP4/src/ts.c` (nuevo)", "`TP4/src/parser.y` (acciones de declaraciones y definiciones)", "`TP4/src/general.c`, `TP4/src/general.h` (el reporte lee de la TS; se eliminan las listas de variables/funciones del TP3)"], "handoff": ["TS funcionando, liberada al final, con API de búsqueda e inserción.", "Funciones de formateo de tipos disponibles para todos los mensajes.", "Listados 1 y 2 generados desde la TS. Todavía se insertan **todos** los símbolos (sin validaciones), así que puede haber filas de más respecto de los tests: E3 decide cuáles no se insertan."], "prompt": "Repositorio de SSL (UTN FRBA), TP4: analizador léxico/sintáctico/semántico de ANSI C con Flex + Bison en TP4/src/ (parser.y, scanner.l, general.c, general.h). La Etapa 1 ya está hecha en la rama TP_4: el TP3 fue migrado y el reporte tiene 5 listados. Esta sesión es SOLO la Etapa 2 de 7: implementar la Tabla de Símbolos (TS) y que los listados 1 (variables) y 2 (funciones) se generen desde ella. No implementes validaciones semánticas.\n\nAntes de empezar, leé TP4/src/*, TP4/tests/output/expected/test_1.txt y TP4/tests/input/test_1.i para entender el formato.\n\nQué hacer:\n1. Crear TP4/src/ts.h y TP4/src/ts.c con una TS en memoria dinámica (lista enlazada que conserve el orden de inserción). Cada símbolo guarda como mínimo:\n   - identificador (char*), categoría (VARIABLE / FUNCION),\n   - tipo de dato (para variables) o tipo de retorno (para funciones), y un flag esConst,\n   - para funciones: si la entrada es \"declaracion\" o \"definicion\" y la lista de parámetros (tipo, nombre opcional porque en prototipos puede faltar, línea y columna; si no hay nombre, la ubicación es la del primer especificador de tipo del parámetro), con la cantidad de parámetros (`(void)` = 0 parámetros),\n   - línea y columna del identificador.\n   API mínima: insertar símbolo, buscar por identificador (devuelve la primera entrada con ese nombre o NULL), recorrer en orden, liberar todo.\n2. En ts.c, funciones que devuelvan el texto del tipo exactamente como en la consigna (memoria dinámica, el llamador libera):\n   - tipo de variable: \"unsigned int\", \"const float\", \"char *\"\n   - tipo de función: \"void(void)\", \"int(int)\", \"double(double, unsigned int)\" (sin espacio antes del paréntesis; parámetros separados por \", \")\n   - función usada como valor (puntero a función): \"void (*)(void)\", \"int (*)(int)\"\n3. Una misma función puede tener dos entradas: una de prototipo (\"declaracion\") y otra de definición (\"definicion\"); el listado 2 esperado muestra ambas filas.\n4. Reemplazar en parser.y las llamadas a agregarVariable/agregarFuncion por inserciones en la TS, y hacer que el reporte (general.c) recorra la TS para imprimir los listados 1 y 2 con el mismo formato actual:\n   - variables: `nombre: tipo, linea L, columna C`\n   - funciones: `nombre: definicion|declaracion, input: <params o void>, retorna: <tipo>, linea L`\n   Los parámetros de funciones NO aparecen en el listado de variables.\n   Eliminar las listas del TP3 para variables y funciones (no deben quedar listas paralelas a la TS).\n5. Liberar la TS en la rutina de liberación de memoria al final del programa.\n6. Si el GNUmakefile no compila automáticamente todos los .c de src/, agregar ts.c; si ya lo hace, no tocarlo.\n\nRestricciones:\n- NO implementar ninguna validación semántica ni registrar errores semánticos (en esta etapa se insertan todos los símbolos, aunque estén repetidos; las etapas siguientes lo resuelven). Es esperable que los listados 1 y 2 tengan filas de más respecto de los tests.\n- NO manejar scope ni namespaces (todo es global, la consigna lo permite).\n- NO agregar punteros, arreglos, structs, etc.\n- NO modificar scanner.l salvo que sea estrictamente necesario, ni tests/, mkframework/ ni archivos fuera de TP4/.\n- Solo bibliotecas estándar de C. Respetar .clang-format.\n\nVerificación: `make all` en TP4/, correr ./bin/tp4 tests/input/test_1.i y comparar los listados 1 y 2 con tests/output/expected/test_1.txt (las únicas diferencias deben ser filas de símbolos repetidos/conflictivos). Probar las funciones de formateo de tipos con los ejemplos de arriba. No hagas commit sin preguntarme."}, {"n": 3, "title": "Control de declaración de símbolos", "desc": "Validar con la TS las declaraciones y definiciones de variables y funciones, emitir los 5 mensajes de \"Control de declaración de símbolos\" (salvo \"sin declarar\", que es de E4) y no insertar en la TS los símbolos en conflicto, para que los listados 1 y 2 coincidan con los tests.", "tasks": [{"t": "Al declarar una variable o un prototipo, o al definir una función, buscar el identificador en la TS y aplicar:", "sub": ["categoría distinta (variable↔función) → `LA:CA: 'ID' redeclarado como un tipo diferente de simbolo` + `Nota: la declaracion previa de 'ID' es de tipo 'TIPO': LB:CB`;", "misma categoría, distinto tipo → `LA:CA: conflicto de tipos para 'ID'; la ultima es de tipo 'TIPO_A'` + `Nota: la declaracion previa de 'ID' es de tipo 'TIPO_B': LB:CB`;", "variable repetida con el mismo tipo → `LA:CA: Redeclaracion de 'ID'` + `Nota: la declaracion previa de 'ID' es de tipo 'TIPO': LB:CB`;", "función definida dos veces con el mismo tipo → `LA:CA: Redefinicion de 'ID'` + `Nota: la definicion previa de 'ID' es de tipo 'TIPO': LB:CB`."]}, {"t": "Casos permitidos (sin error): varios prototipos compatibles de una función; una definición compatible con un prototipo previo. Los nombres de parámetros no tienen que coincidir.", "sub": []}, {"t": "Solo se insertan en la TS los símbolos sin error. Un prototipo repetido compatible no se vuelve a listar; una definición compatible con un prototipo sí se lista como `definicion`.", "sub": []}, {"t": "Registrar la definición de función al reducir su encabezado (antes del cuerpo), para que los errores salgan en orden de aparición, y dejar disponible \"la función que se está definiendo\" (sus parámetros y su tipo de retorno) para las etapas E4 y E7.", "sub": []}], "files": ["`TP4/src/parser.y` (acciones de declaración/definición; separar el encabezado de la definición de función si hace falta)", "`TP4/src/ts.c`, `TP4/src/ts.h` (solo si hace falta alguna función auxiliar de comparación de tipos de símbolos)"], "handoff": ["Listados 1 y 2 coinciden con los tests.", "Los 4 mensajes de redeclaración/conflicto/redefinición salen en el listado 3.", "Hay acceso a la función en definición actual (para resolver parámetros en E4 y validar `return` en E7)."], "prompt": "Repositorio de SSL (UTN FRBA), TP4: analizador léxico/sintáctico/semántico de ANSI C con Flex + Bison, en TP4/src/ (parser.y, scanner.l, general.c/.h, ts.c/.h), rama TP_4. Ya existen: el reporte de 5 listados, la función agregarErrorSemantico(linea, columna, mensaje, nota) en general.c para el listado de errores semánticos, y una Tabla de Símbolos (ts.c/ts.h) con inserción, búsqueda y formateo de tipos (\"unsigned int\", \"int(int)\", \"void (*)(void)\", etc.). Esta sesión es SOLO la Etapa 3 de 7: control de declaración de símbolos (redeclaraciones, conflictos de tipos, redefiniciones). Leé primero TP4/src/* y TP4/tests/input/test_*.i con sus salidas en TP4/tests/output/expected/.\n\nImplementar en las acciones de parser.y que declaran variables, declaran prototipos o definen funciones, buscando el identificador en la TS (todo en alcance global, sin scope):\n1. Categoría distinta (variable vs función):\n   LA:CA: 'ID' redeclarado como un tipo diferente de simbolo\n   Nota: la declaracion previa de 'ID' es de tipo 'TIPO': LB:CB\n2. Misma categoría, distinto tipo de dato (para funciones: retorno o tipos de parámetros):\n   LA:CA: conflicto de tipos para 'ID'; la ultima es de tipo 'TIPO_A'\n   Nota: la declaracion previa de 'ID' es de tipo 'TIPO_B': LB:CB\n3. Variable declarada de nuevo con el mismo tipo:\n   LA:CA: Redeclaracion de 'ID'\n   Nota: la declaracion previa de 'ID' es de tipo 'TIPO': LB:CB\n4. Función definida de nuevo con el mismo tipo:\n   LA:CA: Redefinicion de 'ID'\n   Nota: la definicion previa de 'ID' es de tipo 'TIPO': LB:CB\nLA:CA = ubicación del identificador nuevo; LB:CB = ubicación del identificador de la declaración/definición previa. Los tipos se escriben con las funciones de formateo de ts.c (variables: \"unsigned int\", \"const float\"; funciones: \"void(void)\", \"double(double, unsigned int)\").\n\nCasos SIN error: múltiples prototipos de una función con tipos compatibles; una definición compatible con un prototipo previo. Los nombres de parámetros no importan (pueden faltar en prototipos).\n\nReglas de inserción (necesarias para que los listados 1 y 2 coincidan con los tests): un símbolo que produce cualquiera de estos errores NO se inserta en la TS; un prototipo repetido compatible tampoco se inserta de nuevo; una definición compatible con un prototipo previo SÍ se inserta como entrada \"definicion\". Ejemplo de la consigna (TP4/tests/input/test_1.i): `int imprimir = 2` tras `void imprimir(void){...}` da error y no se lista; `long incremento(long y);` tras `int incremento(int y);` da conflicto y no se lista; `int incremento(int x){...}` en la línea 43 sí se lista como definición.\n\nAdemás:\n- Registrar la definición de función al reducir su ENCABEZADO (tipo, nombre, parámetros), antes de procesar el cuerpo, para que los errores queden en orden de aparición (por ejemplo, con un no-terminal propio para el encabezado o una acción intermedia).\n- Dejar accesible (variable global en parser.y o función en ts.c) la función que se está definiendo: su tipo de retorno, su ubicación y su lista de parámetros. La van a usar las etapas siguientes (resolver parámetros en expresiones y validar return). No implementes esos usos ahora.\n- Los parámetros de una definición NO se insertan como variables en la TS (no deben aparecer en el listado 1 ni producir \"Redeclaracion\" entre funciones distintas).\n\nRestricciones:\n- NO implementar \"'ID' sin declarar\", control del operador *, invocación de funciones, asignaciones ni return (son otras etapas).\n- NO implementar scope ni namespaces.\n- NO cambiar el formato del reporte ni refactorizar código que no esté involucrado. No tocar tests/, mkframework/, GNUmakefile ni nada fuera de TP4/. Solo bibliotecas estándar. Respetar .clang-format.\n\nVerificación: `make all` en TP4/; en los 5 tests los listados 1 y 2 deben coincidir exactamente con los esperados, y en el listado 3 deben aparecer (en el lugar correcto relativo entre sí) todos los errores de redeclaración/conflicto/redefinición esperados, p. ej. en test_1: 7:5, 10:6, 13:57, 14:61, 47:5 y 62:8 con sus notas. No hagas commit sin preguntarme."}, {"n": 4, "title": "Tipado de expresiones, identificadores sin declarar y control del operador `*`", "desc": "Hacer que cada expresión lleve un valor semántico con su tipo (y los datos que necesitan las etapas siguientes), detectar el uso de identificadores no declarados e implementar el control de tipos del operador binario `*`, que es la única validación de operadores que la consigna exige.", "tasks": [{"t": "Definir en `%union` un tipo para expresiones con al menos: tipo de dato (texto o representación interna), si es valor-L modificable, si es `const`, si es una llamada a función que retorna `void`, identificador asociado (si la expresión es un identificador), ubicación, y una marca de \"tipo inválido/desconocido\" para no encadenar errores.", "sub": []}, {"t": "Asignar tipo a las expresiones primarias:", "sub": ["constantes enteras y de carácter → tipo aritmético entero; constantes reales → tipo aritmético real;", "literal de cadena → `char *`;", "identificador de variable → su tipo en la TS (sin `const` para comparar);", "identificador de función usado como valor → puntero a función (`void (*)(void)`);", "parámetro de la función que se está definiendo → su tipo (resolver primero en los parámetros de la función actual y después en la TS)."]}, {"t": "Propagar el tipo por las demás expresiones (unarias, aditivas, relacionales, lógicas, etc.) sin validarlas (opcional en la consigna).", "sub": []}, {"t": "Identificador no encontrado → `L:C: 'ID' sin declarar` (ubicación del identificador), salvo cuando es el nombre de una función invocada (eso lo resuelve E5).", "sub": []}, {"t": "Operador `*`: si algún operando es un identificador y alguno de los dos no es de tipo aritmético → `L:C: Operandos invalidos del operador binario * (tienen 'TIPO_L' y 'TIPO_R')`, con L:C = ubicación del `*`.", "sub": []}], "files": ["`TP4/src/parser.y` (`%union`, `%type`, acciones de expresiones)", "`TP4/src/scanner.l` (solo si hace falta que los tokens de constantes/literales informen su tipo)", "`TP4/src/ts.c`, `TP4/src/ts.h` (solo si hace falta un helper para \"es tipo aritmético\")"], "handoff": ["Toda expresión tiene tipo y ubicación disponibles en `$$`/`@$`.", "Errores `'ID' sin declarar` y `Operandos invalidos del operador binario *` correctos.", "E5, E6 y E7 pueden usar los atributos de la expresión (tipo, valor-L, const, llamada `void`)."], "prompt": "Repositorio de SSL (UTN FRBA), TP4: analizador léxico/sintáctico/semántico de ANSI C con Flex + Bison, en TP4/src/ (parser.y, scanner.l, general.c/.h, ts.c/.h), rama TP_4. Ya existen: reporte de 5 listados; agregarErrorSemantico(linea, columna, mensaje, nota) en general.c; Tabla de Símbolos con búsqueda y funciones de formateo de tipos (\"unsigned int\", \"char *\", \"void (*)(void)\", \"int(int)\"); control de redeclaraciones; y una referencia a la función que se está definiendo (tipo de retorno y parámetros). Esta sesión es SOLO la Etapa 4 de 7: tipar las expresiones, detectar identificadores sin declarar y validar el operador binario *. Leé primero TP4/src/* y los tests en TP4/tests/.\n\nQué hacer:\n1. En %union agregar un struct para expresiones con, como mínimo: tipo de dato, flag \"tipo inválido/desconocido\" (para no encadenar errores), flag esValorLModificable, flag esConst, flag esLlamadaVoid (lo completa la etapa de funciones; dejarlo en 0), identificador (si la expresión es un identificador, si no NULL). La ubicación se toma con @n. Declarar con %type los no-terminales de expresiones que lo usen. Liberar la memoria dinámica que se use.\n2. Tipos de las expresiones primarias:\n   - constante entera o de carácter → \"int\"; constante real → \"double\" (alcanza con que sean aritméticos y se impriman así si aparecen en un mensaje);\n   - literal de cadena → \"char *\";\n   - identificador: primero buscar entre los parámetros de la función que se está definiendo y después en la TS. Variable → su tipo, esValorLModificable=1, esConst según la TS. Función usada como valor → tipo puntero a función (\"void (*)(void)\", \"int (*)(int)\"), no es valor-L.\n   - expresión entre paréntesis → la interna.\n3. Propagar un tipo razonable en las demás expresiones (unarias, ++/--, aditivas, relacionales, igualdad, lógicas, asignación) sin validarlas: la consigna dice que la validación de los demás operadores es opcional, no la implementes.\n4. Identificador no encontrado → agregarErrorSemantico con \"'ID' sin declarar\" en la ubicación del identificador, y marcar la expresión como tipo inválido. Excepción: si el identificador es el nombre de una función que se está invocando (ID '(' ...), NO emitir este error; lo resuelve la etapa de invocación de funciones (deja el caso preparado, sin mensaje).\n5. Operador binario *: si al menos un operando es un identificador y alguno de los dos operandos no es de tipo aritmético (por ejemplo \"char *\" o un puntero a función), emitir:\n   L:C: Operandos invalidos del operador binario * (tienen 'TIPO_L' y 'TIPO_R')\n   con L:C = ubicación del token '*'. Si algún operando ya tiene tipo inválido, no emitir. El resultado de un * con error queda como tipo inválido.\n   Ejemplos esperados (test_1): `d = c * \"\"` → 13:66 (tienen 'unsigned int' y 'char *'); `3 * imprimir` → 35:32 (tienen 'int' y 'void (*)(void)'). `3.0 * f` con f const float NO da error.\n\nRestricciones:\n- NO validar invocaciones a funciones, asignaciones, inicializaciones ni return (otras etapas), ni los demás operadores.\n- NO implementar scope, punteros, arreglos, etc.\n- NO cambiar el formato del reporte ni refactorizar lo que no esté involucrado. No tocar tests/, mkframework/, GNUmakefile ni nada fuera de TP4/. Solo bibliotecas estándar. Respetar .clang-format.\n\nVerificación: `make all` en TP4/; correr los 5 tests y comprobar que los errores \"sin declarar\" y \"Operandos invalidos del operador binario *\" esperados aparecen con la ubicación exacta (ej. test_1: 17:11 'x' sin declarar, 13:66 y 35:32), que no aparecen errores de más y que los listados 1, 2, 4 y 5 siguen iguales. No hagas commit sin preguntarme."}, {"n": 5, "title": "Validación de invocación a funciones", "desc": "Validar con la TS cada invocación a función: que el identificador exista y sea una función, que la cantidad y el tipo de los argumentos sean correctos, y que no se use el valor de retorno de una función `void`.", "tasks": [{"t": "En la regla de invocación (`expPostfija '(' argumentos ')'`), con el identificador invocado:", "sub": ["no está en la TS → `L:C: Funcion 'ID' sin declarar`;", "está pero no es función → `LA:CA: El objeto invocado 'ID' no es una funcion o un puntero a una funcion` + `Nota: declarado aqui: LB:CB`;", "menos argumentos → `LA:CA: Insuficientes argumentos para la funcion 'ID'` + `Nota: declarado aqui: LB:CB`;", "más argumentos → `LA:CA: Demasiados argumentos para la funcion 'ID'` + `Nota: declarado aqui: LB:CB`;", "si la cantidad es correcta, por cada argumento incompatible → `LA:CA: Incompatibilidad de tipos para el argumento N de 'ID'` + `Nota: se esperaba 'TIPO_PARAM' pero el argumento es de tipo 'TIPO_ARG': LB:CB` (LA:CA = argumento, LB:CB = parámetro)."]}, {"t": "El tipo de la llamada es el tipo de retorno de la función; si es `void`, marcar la expresión.", "sub": []}, {"t": "Si una expresión marcada como llamada `void` se usa como operando de `*`, del lado derecho de una asignación o como inicializador → `L:C: No se ignora el valor de retorno void como deberia ser`.", "sub": []}, {"t": "Los argumentos deben recolectarse en orden con su tipo y ubicación.", "sub": []}], "files": ["`TP4/src/parser.y` (regla de invocación, lista de argumentos, chequeo de `void` en `*`, asignación e inicialización)", "`TP4/src/ts.c`, `TP4/src/ts.h` (solo si hace falta un helper de compatibilidad de tipos)"], "handoff": ["Los 6 mensajes de invocación a funciones salen correctamente.", "El chequeo de compatibilidad de tipos (aritmético ↔ aritmético compatible; puntero ↔ aritmético incompatible) queda disponible para E6 y E7 si conviene reutilizarlo."], "prompt": "Repositorio de SSL (UTN FRBA), TP4: analizador léxico/sintáctico/semántico de ANSI C con Flex + Bison, en TP4/src/ (parser.y, scanner.l, general.c/.h, ts.c/.h), rama TP_4. Ya existen: reporte de 5 listados; agregarErrorSemantico(linea, columna, mensaje, nota); Tabla de Símbolos (funciones con parámetros: tipo, nombre opcional, línea/columna; formateo de tipos); control de redeclaraciones; y las expresiones ya tienen un valor semántico con tipo, flag de tipo inválido, valor-L, const, identificador y un flag esLlamadaVoid sin usar. Esta sesión es SOLO la Etapa 5 de 7: validación de invocación a funciones. Leé primero TP4/src/* y los tests en TP4/tests/.\n\nQué hacer en la regla de invocación a función de parser.y (identificador seguido de '(' argumentos opcionales ')'):\n1. Recolectar los argumentos en orden con su tipo y su ubicación (@ del argumento, inicio de la expresión).\n2. Validaciones, con LA:CA = ubicación del identificador invocado y LB:CB = ubicación del identificador en la PRIMERA declaración de la función en la TS (prototipo o definición):\n   a. No está en la TS → \"L:C: Funcion 'ID' sin declarar\" (sin nota). Ej: 2:5 printf.\n   b. Está pero no es función → \"El objeto invocado 'ID' no es una funcion o un puntero a una funcion\" + nota \"declarado aqui: LB:CB\". Ej: f(x) → 17:9, nota 14:64.\n   c. Menos argumentos que parámetros → \"Insuficientes argumentos para la funcion 'ID'\" + nota \"declarado aqui: LB:CB\". Ej: 34:5, nota 9:5.\n   d. Más argumentos → \"Demasiados argumentos para la funcion 'ID'\" + nota \"declarado aqui: LB:CB\". Ej: 35:5, nota 8:7.\n   e. Si la cantidad es correcta, por cada argumento cuyo tipo no sea compatible con el del parámetro: \"Incompatibilidad de tipos para el argumento N de 'ID'\" con LA:CA = ubicación del argumento, y nota \"se esperaba 'TIPO_PARAM' pero el argumento es de tipo 'TIPO_ARG': LB:CB\" con LB:CB = ubicación del parámetro (su identificador, o el inicio de su tipo si no tiene nombre). Ej: potencia(\"++\", incremento) → 38:14 nota 8:22 ('float' vs 'char *') y 38:20 nota 8:28 ('unsigned long' vs 'int (*)(int)').\n   Compatibilidad: dos tipos aritméticos (int, float, double, long, unsigned..., char) son compatibles entre sí; un tipo aritmético con \"char *\" o con un puntero a función no lo es. No validar argumentos con tipo inválido (para no encadenar errores).\n3. Los errores se registran en orden de detección; los errores de los argumentos (ej. \"'x' sin declarar\" 17:11) ya salen antes que el de la invocación (17:9), y así lo esperan los tests.\n4. El tipo de la expresión de llamada es el tipo de retorno de la función; si es void, poner esLlamadaVoid=1. En los casos a-d dejar la expresión como tipo inválido.\n5. \"No se ignora el valor de retorno void como deberia ser\": emitir cuando una expresión con esLlamadaVoid=1 se usa como operando del operador binario *, como lado derecho de una asignación o como inicializador de una variable. Ojo con la ubicación: en test_1, `a = imprimir();` espera 39:7, que es la columna del '='; usar la ubicación que haga coincidir los tests.\n6. El identificador de una función invocada que no existe NO debe generar además \"'ID' sin declarar\" (ya hay un caso preparado para esto en la regla de identificador).\n\nRestricciones:\n- NO implementar validaciones de asignación (const, valor-L, tipos de inicialización) ni de return: son otras etapas.\n- NO validar otros operadores, NO agregar scope ni punteros a función declarados por el usuario.\n- NO cambiar el formato del reporte ni refactorizar código no involucrado. No tocar tests/, mkframework/, GNUmakefile ni nada fuera de TP4/. Solo bibliotecas estándar. Respetar .clang-format.\n\nVerificación: `make all` en TP4/; correr los 5 tests y comparar el listado 3: los 6 tipos de mensajes de invocación deben aparecer con ubicaciones y notas exactas, en el orden esperado, sin errores de más. No hagas commit sin preguntarme."}, {"n": 6, "title": "Validación de asignación e inicialización", "desc": "Implementar las tres validaciones de asignación que pide la consigna: inicialización con tipo incompatible, asignación a una variable `const` y operando izquierdo que no es un valor-L modificable.", "tasks": [{"t": "Inicialización en declaración (`tipo id = expresion`): si el tipo del inicializador no es compatible con el de la variable → `L:C: Incompatibilidad de tipos al inicializar el tipo 'TIPO_L' usando el tipo 'TIPO_R'` (L:C = ubicación del inicializador; `TIPO_L` sin `const`).", "sub": []}, {"t": "Asignación simple `=`:", "sub": ["lado izquierdo es variable `const` → `L:C: Asignacion de la variable de solo lectura 'ID'` (L:C = ubicación del `=`);", "lado izquierdo no es valor-L modificable → `L:C: Se requiere un valor-L modificable como operando izquierdo de la asignacion` (L:C = ubicación del `=`)."]}, {"t": "No emitir errores cuando algún operando ya tiene tipo inválido.", "sub": []}], "files": ["`TP4/src/parser.y` (regla del declarador con inicializador y regla de asignación)"], "handoff": ["Los 3 mensajes de asignación salen correctamente en todos los tests."], "prompt": "Repositorio de SSL (UTN FRBA), TP4: analizador léxico/sintáctico/semántico de ANSI C con Flex + Bison, en TP4/src/ (parser.y, scanner.l, general.c/.h, ts.c/.h), rama TP_4. Ya existen: reporte de 5 listados; agregarErrorSemantico(linea, columna, mensaje, nota); Tabla de Símbolos con formateo de tipos; control de redeclaraciones; y un valor semántico de expresión con tipo, flag de tipo inválido, esValorLModificable, esConst e identificador. Esta sesión es SOLO la Etapa 6 de 7: validación de asignación simple e inicialización. Leé primero TP4/src/* y los tests en TP4/tests/.\n\nQué hacer en parser.y:\n1. En el declarador con inicializador (IDENTIFICADOR '=' expresión dentro de una declaración): si el tipo del inicializador no es compatible con el tipo declarado, emitir\n   L:C: Incompatibilidad de tipos al inicializar el tipo 'TIPO_L' usando el tipo 'TIPO_R'\n   con L:C = ubicación del inicializador (inicio de la expresión) y TIPO_L = tipo declarado SIN el calificador const. Compatibilidad: tipos aritméticos son compatibles entre sí; un aritmético con \"char *\" o con un puntero a función no lo es. Ejemplos de test_1: `b = \"Hola mundo! \\n\"` → 13:30 'unsigned int' usando 'char *'; `f = imprimir` → 14:68 'float' usando 'void (*)(void)'. `d = c * \"\"` NO da este error porque el inicializador ya tiene tipo inválido.\n2. En la asignación simple con el operador '=' (expresión de asignación, no la inicialización):\n   a. Si el operando izquierdo es una variable const → \"L:C: Asignacion de la variable de solo lectura 'ID'\" con L:C = ubicación del '='. Ej: `e @double = 0;` → 30:23.\n   b. Si el operando izquierdo no es un valor-L modificable (constante, literal, resultado de una operación, función) → \"L:C: Se requiere un valor-L modificable como operando izquierdo de la asignacion\" con L:C = ubicación del '='. Ej: `1 = 1;` → 29:15.\n   Si el operando izquierdo tiene tipo inválido (por ejemplo un identificador sin declarar), no emitir nada.\n3. Usar la ubicación del token '=' con @n del símbolo correspondiente de la regla.\n\nRestricciones:\n- La consigna pide validar la asignación simple: NO agregar validaciones para +=, -=, *=, /= ni para otros operadores.\n- NO implementar validaciones de invocación a funciones ni de return (otras etapas); no tocar el chequeo de \"valor de retorno void\" si ya existe.\n- NO cambiar el formato del reporte ni refactorizar código no involucrado. No tocar tests/, mkframework/, GNUmakefile ni nada fuera de TP4/. Solo bibliotecas estándar. Respetar .clang-format.\n\nVerificación: `make all` en TP4/; correr los 5 tests y comprobar que los 3 mensajes de asignación aparecen con la ubicación exacta y en el orden esperado, sin errores de más. No hagas commit sin preguntarme."}, {"n": 7, "title": "Validación de `return`, cierre y README", "desc": "Implementar las dos validaciones de sentencias `return` usando el tipo de retorno de la función que se está definiendo, completar el `README.md` del TP4 y hacer la verificación final contra los tests.", "tasks": [{"t": "`return;` en una función que no retorna `void` → `LA:CA: 'return' sin valor en una funcion que no retorna void` + `Nota: declarado aqui: LB:CB` (LA:CA = token `return`; LB:CB = identificador de la función).", "sub": []}, {"t": "`return expresion;` con tipo incompatible con el retorno declarado → `L:C: Incompatibilidad de tipos al retornar el tipo 'TIPO_return' pero se esperaba 'TIPO_declarado'` (L:C = ubicación de la expresión).", "sub": []}, {"t": "Completar `TP4/README.md` con los datos que pide la plantilla (estándar de C, versión de gcc, versiones mínimas de flex y bison, comandos de compilación y ejecución) y, según la rúbrica, una descripción breve de la estructura de la TS.", "sub": []}, {"t": "Verificación final: los 5 tests pasan, no queda salida de debug por `stdout`, se libera toda la memoria.", "sub": []}], "files": ["`TP4/src/parser.y` (regla de la sentencia de salto `return`)", "`TP4/README.md`"], "handoff": ["TP4 completo: los 5 listados del reporte coinciden con los tests.", "README completo, listo para abrir el PR `TP_4` → `main`."], "prompt": "Repositorio de SSL (UTN FRBA), TP4: analizador léxico/sintáctico/semántico de ANSI C con Flex + Bison, en TP4/src/ (parser.y, scanner.l, general.c/.h, ts.c/.h), rama TP_4. Ya existen: reporte de 5 listados; agregarErrorSemantico(linea, columna, mensaje, nota); Tabla de Símbolos con formateo de tipos; control de redeclaraciones; tipado de expresiones (tipo, flag de tipo inválido); validaciones de *, invocaciones y asignaciones; y una referencia a la función que se está definiendo (tipo de retorno, ubicación de su identificador). Esta sesión es SOLO la Etapa 7 de 7: validar sentencias return, completar el README y verificar el TP completo. Leé primero TP4/src/*, TP4/README.md, .github/rubrics/tp4_rubric.md y los tests en TP4/tests/.\n\n1. En la regla de la sentencia de salto return de parser.y, usando la función que se está definiendo:\n   a. `return;` en una función cuyo tipo de retorno no es void:\n      LA:CA: 'return' sin valor en una funcion que no retorna void\n      Nota: declarado aqui: LB:CB\n      LA:CA = ubicación del token return; LB:CB = ubicación del identificador de la función.\n   b. `return expresion;` con tipo no compatible con el tipo de retorno declarado:\n      L:C: Incompatibilidad de tipos al retornar el tipo 'TIPO_return' pero se esperaba 'TIPO_declarado'\n      L:C = ubicación de la expresión (no del return). Compatibilidad: aritméticos entre sí son compatibles; aritmético con \"char *\" o con puntero a función no. Si la expresión tiene tipo inválido, no emitir. Ejemplos de test_1: `return imprimir;` en main → 31:20 ('void (*)(void)' pero se esperaba 'int'); `return \"Terminado\";` → 40:12 ('char *' pero se esperaba 'int'). `return ++x;` y `return acumulador;` (float en función double) NO dan error. `return;` en una función void no da error.\n2. Completar TP4/README.md llenando los campos de la plantilla (estándar de C usado, compilador gcc y su versión mínima, versiones mínimas de flex y bison — consultá las instaladas con `gcc --version`, `flex --version`, `bison --version` y preguntame si hay dudas —, comandos para compilar y ejecutar) y agregar una descripción breve de la estructura de datos de la TS implementada (leer ts.h). No inventar datos de integrantes: si la plantilla los pide, dejá los del README.md de la raíz.\n3. Verificación final del TP completo:\n   - `make clean && make all` en TP4/ sin errores.\n   - `./tests/run_testsuite.sh ./bin/tp4` desde TP4/: comparar cada listado contra tests/output/expected/. Si hay diferencias en otros listados, informámelas sin corregirlas.\n   - Confirmar que stdout solo contiene el reporte (debug solo por stderr) y que toda la memoria dinámica (TS, listas de errores, cadenas) se libera al final.\n\nRestricciones:\n- NO implementar validaciones extra (otros operadores, scope, etc.) ni corregir otras etapas sin consultarme.\n- NO cambiar el formato del reporte ni refactorizar código no involucrado. No tocar tests/, mkframework/, GNUmakefile ni nada fuera de TP4/. Solo bibliotecas estándar. Respetar .clang-format.\n- No hagas commit, push ni PR sin preguntarme."}], "deps": {"1": [], "2": [1], "3": [2], "4": [2], "5": [4], "6": [4], "7": [4]}, "summary": [{"id": "que", "title": "Qué hay que construir", "bullets": ["Un programa en C que lee un archivo `.i` (C ya preprocesado) y hace el análisis **léxico** (Flex), **sintáctico** (Bison) y **semántico** (rutinas semánticas y TS) de ANSI C (C89/C90).", "Uso: `./bin/tp4 archivo.i > salida.txt`. La ruta de entrada es el único parámetro obligatorio.", "Por stdout sale solo el reporte: 5 listados en orden (variables, funciones, errores semánticos, sintácticos y léxicos), con `-` cuando un listado está vacío.", "El `.i` no trae directivas ni comentarios: ya los resolvió el preprocesador."]}, {"id": "minimos", "title": "Estructuras sintácticas mínimas (las del TP3)", "bullets": ["**Expresiones**: primarias, postfijas (invocación, `++` y `--`), unarias, multiplicativas, aditivas, relacionales, de igualdad, `&&`, `||` y de asignación (`=`, `+=`, `-=`, `*=`, `/=`).", "**Declaraciones**: variables simples (varias por línea) y prototipos simples.", "**Sentencias**: de expresión, compuestas, `if`/`else`/`switch`, `while`/`do`/`for`, `case`/`default`, `continue`/`break`/`return`.", "**Definiciones externas**: definiciones de funciones y declaraciones globales."]}, {"id": "validaciones", "title": "Validaciones semánticas mínimas", "bullets": ["Tipos del operador binario `*` cuando algún operando es un identificador (los demás operadores son opcionales).", "Declaración de símbolos: sin declarar, redeclaraciones, conflictos de tipos y redefiniciones. Una función puede tener varios prototipos si sus tipos coinciden.", "Invocación a funciones: que sea una función declarada, cantidad y tipos de argumentos, y no usar el retorno de una `void`.", "Asignación simple e inicialización: valor-L modificable, `const` y tipos.", "Sentencias `return`: con o sin valor según el tipo de retorno."]}, {"id": "errores", "title": "Criterio para manejo de errores", "bullets": ["**Léxico**: capturar la cadena no reconocida; no le llega ningún token al parser (puede desencadenar un error sintáctico). Se retoma en el siguiente `\\n` o `;`.", "**Sintáctico**: usar el token `error` de Bison, registrar la estructura no derivable y seguir desde `;` o `\\n`.", "**Semántico**: no hace falta recuperarse, la GIC sigue operando. Se guardan en una lista y se imprimen en el listado 3."]}, {"id": "tecnicos", "title": "Requisitos técnicos", "bullets": ["Ubicaciones: llevar línea y columna en el scanner y pasarlas al parser con `yylloc` (directiva `%locations`).", "Memoria dinámica para generar el reporte; la TS también es dinámica.", "C portable: solo bibliotecas estándar (nada de POSIX) y sin extensiones de GNU. Compila con gcc.", "Debug activable con una variable o `#define DEBUG`, siempre por **stderr**: los tests comparan stdout.", "Se entregan solo `.y`, `.l`, `.c`, `.h` y el makefile. Nada generado (`.tab.c`, `lex.yy.c`, `.o`, `.exe`).", "Completar `README.md` del TP como carátula."]}, {"id": "repo", "title": "Reglas del repositorio (de la planificación)", "bullets": ["Entrega por PR desde la rama `TP_4` hacia `main`. Esa rama solo puede tocar `TP4/` y `README.md`.", "`TP4/tests/` está protegido y el formato se valida con `.clang-format`.", "Compilar con `make all` dentro de `TP4/`; el ejecutable queda en `TP4/bin/tp4`.", "Tests: `./tests/run_testsuite.sh ./bin/tp4` desde `TP4/`.", "El TP3 terminado está en la rama `tp_3`; `PLANIFICACION_TP4.md` no se commitea en `TP_4`."]}, {"id": "defensa", "title": "Entrega y defensa", "bullets": ["Exposición sincrónica de unos 15 minutos, en la fecha acordada con el equipo.", "Tienen que estar todos con cámara y micrófono, y **todos** responden preguntas sobre el TP.", "Fuera de alcance (opcional): otros operadores, scope y namespaces, punteros, arreglos, structs, unions, enums y typedefs."]}], "errors": [{"group": "Operador binario *", "stage": 4, "items": [{"fmt": "L:C: Operandos invalidos del operador binario * (tienen 'TIPO_L' y 'TIPO_R')", "where": "L:C = el operador *", "ex": ["13:66", "35:32"]}]}, {"group": "Declaración de símbolos", "stage": 3, "items": [{"fmt": "L:C: 'ID' sin declarar", "where": "L:C = el identificador (lo implementa la Etapa 4)", "ex": ["17:11"], "stage": 4}, {"fmt": "LA:CA: 'ID' redeclarado como un tipo diferente de simbolo\nNota: la declaracion previa de 'ID' es de tipo 'TIPO': LB:CB", "where": "Variable ↔ función. LA:CA y LB:CB = los identificadores", "ex": ["7:5"]}, {"fmt": "LA:CA: conflicto de tipos para 'ID'; la ultima es de tipo 'TIPO_A'\nNota: la declaracion previa de 'ID' es de tipo 'TIPO_B': LB:CB", "where": "Mismo tipo de símbolo, distinto tipo de dato", "ex": ["10:6", "14:61", "62:8"]}, {"fmt": "LA:CA: Redeclaracion de 'ID'\nNota: la declaracion previa de 'ID' es de tipo 'TIPO': LB:CB", "where": "Variable repetida con el mismo tipo", "ex": ["13:57"]}, {"fmt": "LA:CA: Redefinicion de 'ID'\nNota: la definicion previa de 'ID' es de tipo 'TIPO': LB:CB", "where": "Función definida dos veces con el mismo tipo", "ex": ["47:5"]}]}, {"group": "Invocación a funciones", "stage": 5, "items": [{"fmt": "L:C: Funcion 'ID' sin declarar", "where": "L:C = el identificador invocado", "ex": ["2:5"]}, {"fmt": "LA:CA: El objeto invocado 'ID' no es una funcion o un puntero a una funcion\nNota: declarado aqui: LB:CB", "where": "Se invoca algo que no es función", "ex": ["17:9"]}, {"fmt": "LA:CA: Insuficientes argumentos para la funcion 'ID'\nNota: declarado aqui: LB:CB", "where": "Menos argumentos que parámetros", "ex": ["34:5"]}, {"fmt": "LA:CA: Demasiados argumentos para la funcion 'ID'\nNota: declarado aqui: LB:CB", "where": "Más argumentos que parámetros", "ex": ["35:5"]}, {"fmt": "LA:CA: Incompatibilidad de tipos para el argumento N de 'ID'\nNota: se esperaba 'TIPO_A' pero el argumento es de tipo 'TIPO_B': LB:CB", "where": "LA:CA = el argumento; LB:CB = el parámetro", "ex": ["38:14", "38:20"]}, {"fmt": "L:C: No se ignora el valor de retorno void como deberia ser", "where": "Se opera con el retorno de una función void", "ex": ["39:7"]}]}, {"group": "Asignación e inicialización", "stage": 6, "items": [{"fmt": "L:C: Incompatibilidad de tipos al inicializar el tipo 'TIPO_L' usando el tipo 'TIPO_R'", "where": "L:C = el inicializador", "ex": ["13:30", "14:68"]}, {"fmt": "L:C: Asignacion de la variable de solo lectura 'ID'", "where": "L:C = el operador =", "ex": ["30:23"]}, {"fmt": "L:C: Se requiere un valor-L modificable como operando izquierdo de la asignacion", "where": "L:C = el operador =", "ex": ["29:15"]}]}, {"group": "Sentencias return", "stage": 7, "items": [{"fmt": "LA:CA: 'return' sin valor en una funcion que no retorna void\nNota: declarado aqui: LB:CB", "where": "LA:CA = el token return; LB:CB = la función", "ex": []}, {"fmt": "L:C: Incompatibilidad de tipos al retornar el tipo 'TIPO_return' pero se esperaba 'TIPO_declarado'", "where": "L:C = el valor del return", "ex": ["31:20", "40:12"]}]}], "defensa": [["¿Cómo se comunican el scanner y el parser en su TP?", "yyparse() llama a yylex() cada vez que necesita un token. yylex() retorna el código del token y deja el valor semántico en yylval. La ubicación viaja en yylloc (por %locations) y en las reglas se lee con @n.", "flexbison"], ["¿Qué pasa ante un error léxico?", "Se captura la cadena no reconocida y va al listado 5 con línea y columna. Al parser no le llega ningún token, lo que puede provocar además un error sintáctico. El análisis se retoma en el siguiente \\n o ;.", "scanner"], ["¿Cómo se recuperan de un error sintáctico?", "Con el token error de Bison: se registra la estructura no derivable con su línea y se sigue procesando desde el próximo ; o \\n.", "derivaciones"], ["¿Por qué los errores semánticos no necesitan recuperación?", "Porque la GIC sigue operando sin problemas: la secuencia de tokens es válida. Las rutinas semánticas solo guardan el error en una lista que se imprime en el listado 3.", "semantico"], ["¿Cómo es la tabla de símbolos que implementaron?", "Una lista enlazada en memoria dinámica que conserva el orden de inserción. Cada símbolo guarda identificador, categoría, tipo, si es const, si es declaración o definición, parámetros, tipo de retorno, línea y columna. Los listados 1 y 2 se generan recorriéndola.", "ts"], ["¿Por qué una función puede tener varios prototipos y una variable no puede repetirse?", "Los prototipos llevan el especificador extern de forma implícita, así que se aceptan mientras sus tipos coincidan. Ni las variables ni las funciones pueden definirse dos veces.", "ts"], ["¿Cuándo es válido el operador *?", "Cuando ambos operandos son de tipo aritmético. Si algún operando es un identificador y alguno no es aritmético (por ejemplo char * o un puntero a función), se informa el error en la ubicación del *.", "semantico"], ["¿Qué es un valor-L modificable?", "Una expresión que designa un objeto que se puede modificar, como una variable no const. En 1 = 1 el lado izquierdo no lo es; en e = 0 con e const sale \"Asignacion de la variable de solo lectura\".", "semantico"], ["¿Por qué la definición de una función se registra al reducir su encabezado?", "Para que los errores salgan en orden de aparición y para tener disponibles los parámetros y el tipo de retorno mientras se analiza el cuerpo (los usan las validaciones de expresiones y de return).", "archivobison"], ["¿Por qué el debug va por stderr?", "Los tests automáticos comparan la salida estándar: por stdout tiene que salir únicamente el reporte.", "flexbison"], ["¿Qué tipo de análisis hace el parser que genera Bison?", "Ascendente (LR): lee los tokens de izquierda a derecha y reduce hasta el axioma, reconstruyendo una derivación por derecha en orden inverso.", "derivaciones"], ["¿Por qué no manejan alcance (scope)?", "La consigna permite considerar todos los símbolos en un mismo alcance global, y no afecta a los tests mínimos. Si se hiciera: alcance 0 es global, +1 por cada { y −1 por cada }; el símbolo de menor alcance tiene precedencia.", "ts"]], "code": ["void imprimir(void) {", "    printf(\"Log: %s \\n\", \"\");", "    return;", "}", "", "void imprimir(void);", "int imprimir = 2, compartida = -5;", "float potencia(float base, unsigned long);", "int incremento(int y);", "long incremento(long y);", "", "int main(void) {", "    unsigned int a = 06, b = \"Hola mundo! \\n\", c = 0xA, c, d = c * \"\";", "    const float e = potencia(1.0 * 2.0, 2 * 3) * (1.0 * 1), a, f = imprimir;", "    if (a <= 6 && c != 'A') {", "        int i;", "        f(x);", "        while (i > 0) {", "            c = incremento(c);", "            --i;", "        }", "    }", "", "    switch (c) {", "        case 10:", "            c = a", "            break;", "        default:", "            1 = 1;", "            e @double = 0;", "            return imprimir;", "    }", "", "    incremento();", "    potencia(a * 1.0, a * c, 3 * imprimir);", "    potencia(c * 3, e * 1.0);", "    potencia(3.0 * f, e * f);", "    potencia(\"++\", incremento);", "    a = imprimir();", "    return \"Terminado\";", "}", "", "int incremento(int x) {", "    return ++x;", "}", "", "int incremento(int x) {", "    do {", "        x+=1;", "        continue;", "    } while (x < 5);", "", "    if (x > 5)", "        if (x == 6 || x >= 10)", "            return ++x;", "        else {", "            x += 2;", "        }", "    return x;", "}", "", "double potencia(double base, unsigned int exp) {", "    float acumulador = 1.0;", "    for (; exp > 0; exp--) {", "        acumulador *= base;", "    }", "    return acumulador;", "}"], "output": "* Listado de variables declaradas (tipo de dato y numero de linea):\ncompartida: int, linea 7, columna 19\na: unsigned int, linea 13, columna 18\nb: unsigned int, linea 13, columna 26\nc: unsigned int, linea 13, columna 48\nd: unsigned int, linea 13, columna 60\ne: const float, linea 14, columna 17\nf: const float, linea 14, columna 64\ni: int, linea 16, columna 13\nacumulador: float, linea 63, columna 11\n\n* Listado de funciones declaradas y definidas:\nimprimir: definicion, input: void, retorna: void, linea 1\npotencia: declaracion, input: float base, unsigned long, retorna: float, linea 8\nincremento: declaracion, input: int y, retorna: int, linea 9\nmain: definicion, input: void, retorna: int, linea 12\nincremento: definicion, input: int x, retorna: int, linea 43\n\n* Listado de errores semanticos:\n2:5: Funcion 'printf' sin declarar\n7:5: 'imprimir' redeclarado como /* ---------- estado ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const LETTERS = ['A','B','C','D','E','F'];
let state = { view:'home', m:null, ex:0, q:0, answers:{} };

const $app = document.getElementById('app');
const $crumb = document.getElementById('crumb');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function loadAnswers(mi){ return store.get('ssl2-m'+mi) || {}; }
function saveAnswers(){ store.set('ssl2-m'+state.m, state.answers); }

function weight(ex){ const m = ex.pts.match(/([\d.]+)/); return m ? parseFloat(m[1]) : 0.5; }
function exMax(ex){ return +(weight(ex)*ex.items.length).toFixed(2); }
function fmt(n){ return (Math.round(n*100)/100).toString().replace('.',','); }
function scoreOf(mi, answers){
  const model = DATA[mi]; let total=0, answered=0, per=[];
  model.exercises.forEach(ex=>{
    let s=0; ex.items.forEach(it=>{ const a=answers[it.id]; if(a){answered++; if(a===it.ans) s+=weight(ex);} });
    per.push(s); total+=s;
  });
  return {total, answered, per, count: model.exercises.reduce((n,e)=>n+e.items.length,0)};
}
/* primer ítem sin responder de un ejercicio (o el último si está completo) */
function nextOpen(ex){ const i = ex.items.findIndex(it=>!state.answers[it.id]); return i<0 ? ex.items.length-1 : i; }
/* un ítem está disponible si todos los anteriores de su ejercicio fueron respondidos */
function unlocked(ex, qi){ for(let k=0;k<qi;k++){ if(!state.answers[ex.items[k].id]) return false; } return true; }

/* ---------- inicio con pestañas ---------- */
function tabsHTML(active){
  return `<div class="tabs" role="tablist" aria-label="Sección">
    <button role="tab" aria-selected="${active==='modelos'}" data-tab="modelos">Modelos</button>
    <button role="tab" aria-selected="${active==='repaso'}" data-tab="repaso">Repaso</button>
    <button role="tab" aria-selected="${active==='temas'}" data-tab="temas">Temas frecuentes</button>
    <button role="tab" aria-selected="${active==='tp'}" data-tab="tp">TP integrador</button>
  </div>`;
}
function bindTabs(){
  $app.querySelectorAll('.tabs [data-tab]').forEach(b=>b.addEventListener('click',()=>renderHome(b.dataset.tab)));
}
function modelRowHTML(m, mi){
  const ans = loadAnswers(mi); const sc = scoreOf(mi, ans);
  const grid = m.exercises.map(ex=>`<span class="g">${ex.items.map(it=>{
    const a=ans[it.id]; return `<i class="${a ? (a===it.ans?'ok':'bad') : ''}"></i>`; }).join('')}</span>`).join('');
  const scoreHTML = sc.answered
    ? `<div class="n">${fmt(sc.total)}</div><div class="l">${sc.answered}/${sc.count} respondidas</div>`
    : `<div class="n" style="color:var(--ink-3)">–</div><div class="l">sin empezar</div>`;
  return `<button class="model-row" data-m="${mi}">
    <h2>${m.title}${m.kind==='practica' ? ` · ${esc(m.exercises[0].title)}` : ''}</h2>
    <div class="score">${scoreHTML}</div>
    <div class="topics">${esc(m.topics)}</div>
    <div class="minigrid" aria-hidden="true">${grid}</div>
  </button>`;
}

const md = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function seenSet(){ return new Set(store.get('ssl2-seen') || []); }
function toggleSeen(id){
  const s = seenSet(); s.has(id) ? s.delete(id) : s.add(id); store.set('ssl2-seen',[...s]);
}
function freqLabel(c){
  const n = new Set(c.practice.map(p=>p[0])).size;
  if(!n) return {txt:'Solo en el resumen', cls:'f0'};
  if(n===4) return {txt:'En los 4 modelos', cls:'f4'};
  return {txt:`En ${n} ${n===1?'modelo':'modelos'}`, cls:'f'+Math.min(n,3)};
}
function itemState(m,id){
  const a = loadAnswers(m-1)[id]; if(!a) return '';
  const it = findItem(m-1,id); return it && a===it.item.ans ? 'ok' : 'bad';
}
function findItem(mi,id){
  const exs = DATA[mi].exercises;
  for(let ei=0;ei<exs.length;ei++){ const qi = exs[ei].items.findIndex(x=>x.id===id); if(qi>=0) return {ei,qi,item:exs[ei].items[qi]}; }
  return null;
}
function goPractice(m,id,cid,backTab){
  const mi=m-1; const f=findItem(mi,id); if(!f) return;
  state.m=mi; state.answers=loadAnswers(mi); state.view='quiz'; state.backConcept=cid; state.backTab=backTab||'repaso';
  const ex=DATA[mi].exercises[f.ei];
  state.ex=f.ei; state.q = (state.answers[id] || unlocked(ex,f.qi)) ? f.qi : nextOpen(ex);
  document.querySelector('.wrap').classList.remove('wide');
  renderQuiz(); window.scrollTo({top:0});
}

function tpState(){ const s = store.get('ssl2-tp') || {}; s.tasks = s.tasks || {}; s.owners = s.owners || {}; return s; }
function tpSave(s){ store.set('ssl2-tp', s); }
function stageProgress(st, s){ const done = st.tasks.filter((_,i)=>s.tasks[`E${st.n}-${i}`]).length; return {done, total: st.tasks.length}; }
function concTitle(id){ for(const m of REPASO.modules){ const c=m.concepts.find(x=>x.id===id); if(c) return c.title; } return id; }

const TP_SHORT = {1:'Migración TP3 → TP4',2:'Tabla de símbolos',3:'Declaración de símbolos',4:'Tipado y operador *',5:'Invocación a funciones',6:'Asignación',7:'Return y README'};
function depGraphSVG(s){
  // posiciones: columna x por nivel, fila y
  const P = {1:[0,1],2:[1,1],3:[2,0],4:[2,2],5:[3,1],6:[3,2],7:[3,3]};
  const W=150,H=46,GX=60,GY=16, X=c=>c*(W+GX), Y=r=>r*(H+GY);
  const st = Object.fromEntries(TP.stages.map(x=>[x.n,x]));
  let edges='', nodes='';
  Object.entries(TP.deps).forEach(([n,ds])=>ds.forEach(d=>{
    const [c1,r1]=P[d],[c2,r2]=P[n]; const x1=X(c1)+W, y1=Y(r1)+H/2, x2=X(c2), y2=Y(r2)+H/2, mx=(x1+x2)/2;
    edges += `<path d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2-6} ${y2}" class="dg-edge" marker-end="url(#arr)"/>`;
  }));
  TP.stages.forEach(x=>{
    const [c,r]=P[x.n]; const pr=stageProgress(x,s); const cls = pr.done===pr.total ? 'done' : pr.done ? 'wip' : '';
    const short = TP_SHORT[x.n] || x.title;
    nodes += `<g class="dg-node ${cls}" data-stage="${x.n}" tabindex="0" role="button" aria-label="Etapa ${x.n}: ${esc(x.title.replace(/`/g,''))}, ${pr.done} de ${pr.total} tareas">
      <rect x="${X(c)}" y="${Y(r)}" width="${W}" height="${H}" rx="7"/>
      <text x="${X(c)+12}" y="${Y(r)+19}" class="dg-n">E${x.n}<tspan class="dg-p" dx="6">${pr.done}/${pr.total}</tspan></text>
      <text x="${X(c)+12}" y="${Y(r)+36}" class="dg-t">${esc(short)}</text>
    </g>`;
  });
  const w = X(3)+W+2, h = Y(3)+H+2;
  return `<svg class="depgraph" viewBox="-2 -2 ${w+2} ${h+2}" role="img" aria-label="Dependencias entre etapas">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-arrow"/></marker></defs>
    ${edges}${nodes}</svg>`;
}
